#textdomain wesnoth-liminal-union
#define LIUN_BALANCE_TELEMETRY_EVENTS
    [event]
        id=LIUN_balance_telemetry_enable
        name=prestart
        first_time_only=yes
        [set_variable]
            name=liun_balance_telemetry
            value=yes
        [/set_variable]
        [lua]
            code=<<
                std_print("LIUN_BALANCE\tTELEMETRY\tENABLED\n")
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_balance_telemetry_placed
        name=recruit,recall
        first_time_only=no
        [lua]
            code=<<
                local ctx = wesnoth.current.event_context or {}
                local u = ctx.x1 and ctx.y1 and wesnoth.units.get(ctx.x1, ctx.y1)
                if u and tostring(u.type):sub(1, 5) == "LIUN_" then
                    local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                    local tier = reso.get_tier(u)
                    local zoc = reso.get_formation_zoc(u) and 1 or 0
                    std_print(string.format(
                        "LIUN_BALANCE\tPLACED\t%s\t%d\t%d\t%d\t%d\t%d\t%d\t%d\t%d\t%d\n",
                        tostring(u.type), u.side, u.level, u.cost or 0, u.hitpoints,
                        u.max_hitpoints, u.x, u.y, tier, zoc))
                end
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_balance_telemetry_died
        name=die
        first_time_only=no
        [lua]
            code=<<
                local ctx = wesnoth.current.event_context or {}
                local u = ctx.x1 and ctx.y1 and wesnoth.units.get(ctx.x1, ctx.y1)
                if u and tostring(u.type):sub(1, 5) == "LIUN_" then
                    std_print(string.format(
                        "LIUN_BALANCE\tDIED\t%s\t%d\t%d\t%d\t%d\t%d\t%d\n",
                        tostring(u.type), u.side, u.level, u.cost or 0, u.x, u.y,
                        wesnoth.current.turn or 0))
                end
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_balance_telemetry_advanced
        name=post_advance
        first_time_only=no
        [lua]
            code=<<
                local ctx = wesnoth.current.event_context or {}
                local u = ctx.x1 and ctx.y1 and wesnoth.units.get(ctx.x1, ctx.y1)
                if u and tostring(u.type):sub(1, 5) == "LIUN_" then
                    std_print(string.format(
                        "LIUN_BALANCE\tADVANCED\t%s\t%d\t%d\t%d\t%d\t%d\n",
                        tostring(u.type), u.side, u.level, u.cost or 0, u.x, u.y))
                end
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_balance_telemetry_attacker_hits
        name=attacker_hits
        first_time_only=no
        [lua]
            code=<<
                local ctx = wesnoth.current.event_context or {}
                local a = ctx.x1 and ctx.y1 and wesnoth.units.get(ctx.x1, ctx.y1)
                local d = ctx.x2 and ctx.y2 and wesnoth.units.get(ctx.x2, ctx.y2)
                if a and d then
                    std_print(string.format(
                        "LIUN_BALANCE\tHIT\tATTACKER_HITS\t%s\t%d\t%s\t%d\t%d\t%d\t%d\n",
                        tostring(a.type), a.side, tostring(d.type), d.side,
                        ctx.damage_inflicted or 0, a.hitpoints, d.hitpoints))
                end
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_balance_telemetry_defender_hits
        name=defender_hits
        first_time_only=no
        [lua]
            code=<<
                local ctx = wesnoth.current.event_context or {}
                local a = ctx.x1 and ctx.y1 and wesnoth.units.get(ctx.x1, ctx.y1)
                local d = ctx.x2 and ctx.y2 and wesnoth.units.get(ctx.x2, ctx.y2)
                if a and d then
                    std_print(string.format(
                        "LIUN_BALANCE\tHIT\tDEFENDER_HITS\t%s\t%d\t%s\t%d\t%d\t%d\t%d\n",
                        tostring(a.type), a.side, tostring(d.type), d.side,
                        ctx.damage_inflicted or 0, a.hitpoints, d.hitpoints))
                end
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_balance_telemetry_formation
        name=side turn
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                local units = wesnoth.units.find_on_map({ side = wesnoth.current.side })
                for _, u in ipairs(units) do
                    if tostring(u.type):sub(1, 5) == "LIUN_" then
                        local tier = reso.get_tier(u)
                        local zoc = reso.get_formation_zoc(u) and 1 or 0
                        local poisoned = u.status.poisoned and 1 or 0
                        local slowed = u.status.slowed and 1 or 0
                        std_print(string.format(
                            "LIUN_BALANCE\tFORMATION\t%s\t%d\t%d\t%d\t%d\t%d\t%d\t%d\t%d\n",
                            tostring(u.type), u.side, wesnoth.current.turn or 0,
                            u.x, u.y, tier, zoc, poisoned, slowed))
                    end
                end
            >>
        [/lua]
    [/event]
#enddef
