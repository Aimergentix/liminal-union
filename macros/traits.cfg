#textdomain wesnoth-liminal-union

# traits that are common/mainline to all races and units
    # TRAIT_STRONG        # +1 damage melee attack
    # TRAIT_QUICK         # +1 MP
    # TRAIT_INTELLIGENT   # -20% XP
    # TRAIT_RESILIENT     # +4 HP, +1 per level

# other  MP traits:
    # TRAIT_DEXTROUS      # elves, +1 damage ranged attack
    # TRAIT_HEALTHY       # dwarves, +1 HP, +1 per level, always rest heals 2 HP

# other positive traits:
    # TRAIT_FEARLESS      # overrides ToD >> neutral
    # TRAIT_LOYAL
    # TRAIT_HEALTH        # +1 HP, +1 per level, +2 HP selfheal, custom trait to make it non-dwarf specific

# custom traits for era Liminal Union (liminal_union, phoinixes, golem warforms)
    # TRAIT_IMMORTAL      # like ELEMENTAL w/custom descriptions + LOYAL
    # TRAIT_CYBORG        # like MECHANICAL w/custom descriptions + LOYAL
    # TRAIT_ARCANEALLOY_MUSTHAVE    # the WEAPON_SPECIAL_ARCANE in musthave trait format w/o descriptions in sidebar
    # TRAIT_INTELLIGENT_MUSTHAVE    # trait intelligent with musthave switch on

# -----------------------------------------------
#define TRAIT_ARCANEALLOY_MUSTHAVE
    # custom trait for race=maidencommand and race=marinecommand units
    # units with trait ARCANEALLOY use the weapon type=arcane when the opponent is
    # particularly sensitive to it in relation to the weapon on which it is applied…
    # …custom descriptions adapted to this era's lore and specifics…
    # arcanealloy:=
    # It's the Liminal Union's ability to enrich their weaponry with arcanite alloys by hightech alchemical refinement.
    # All weapons possess arcane alloy properties to some extent.
    # electron:=
    # The elektron-alloy weaponry has a manna-energizing effect every time its attack hits (equivalent of 2 HP).
    [trait]
        id=LIUN_arcanealloy
        availability="musthave"
        male_name= _ "arcanealloy"
        female_name= _ "female^arcanealloy"
        description= _ "All weapons possess arcane alloy properties to some extent."
        help_text= _ "The Liminal Union tempers its weapons with mana-bearing arcanite alloys, allowing them to turn hostile sorcery aside and answer it in kind."
        [effect]
            apply_to=attack
            range=melee
            [set_specials]
                mode=append
                [damage_type]
                    id=LIUN_arcanealloy
                    alternative_type=arcane
                    overlay_image="icons/arcane.webp"
                [/damage_type]
            [/set_specials]
        [/effect]
        [effect]
            apply_to=attack
            range=ranged
            [set_specials]
                mode=append
                [damage_type]
                    id=LIUN_arcanealloy_ranged
                    alternative_type=arcane
                    overlay_image="icons/arcane.webp"
                [/damage_type]
            [/set_specials]
        [/effect]
    [/trait]
#enddef

#define TRAIT_IMMORTAL
    # custom trait for race=phoinix units
    # units with trait IMMORTAL cannot be drained, poisoned, or plagued.
    # …custom descriptions adapted to this era's lore and specifics…
    [trait]
        id=LIUN_immortal
        availability="musthave"
        male_name= _ "immortal"
        female_name= _ "female^immortal"
        description= _ "Immune to drain, poison, and plague"
        help_text= _ "<i>Immortal</i> units are immune to poison, drain, and plague. Phoinixes generally bear this trait. As creatures of renewal, they do not sicken as mortal beasts do, which makes them especially useful against foes who rely on poison or plague."
        [effect]
            apply_to=status
            add=unpoisonable
        [/effect]
        [effect]
            apply_to=status
            add=undrainable
        [/effect]
        [effect]
            apply_to=status
            add=unplagueable
        [/effect]
    [/trait]
#enddef

#define TRAIT_CYBORG
    # custom trait for golem warforms
    # units with trait CYBORG cannot be drained, poisoned, or plagued.
    # …custom descriptions adapted to this era's lore and specifics…
    [trait]
        id=LIUN_cyborg
        availability="musthave"
        male_name= _ "corebound"
        female_name= _ "female^corebound"
        description= _ "Immune to drain, poison, and plague"
        help_text= _ "<i>Corebound</i> units are immune to poison, drain, and plague. G9 units generally bear this trait. Their lawful frames and sealed cores do not sicken as living flesh does, and the death-bound arts find little purchase in them. This makes them especially useful against foes who rely on poison or plague."
        [effect]
            apply_to=status
            add=unpoisonable
        [/effect]
        [effect]
            apply_to=status
            add=undrainable
        [/effect]
        [effect]
            apply_to=status
            add=unplagueable
        [/effect]
    [/trait]
#enddef

#define TRAIT_HEALTH_MUSTHAVE
    # …custom descriptions – code based on TRAIT_HEALTH
    [trait]
        id=LIUN_healthy_musthave
        male_name= _ "healthy"
        female_name= _ "female^healthy"
        availability="musthave"
        description= _ "This unit can tend its wounds while resting."
        help_text= _ "Healthy units regain 2 hit points when resting, and gain +1 maximum hit point upon leveling up."
        [effect]
            apply_to=healthy
        [/effect]
        [effect]
            apply_to=hitpoints
            increase_total=1
        [/effect]
        [effect]
            apply_to=hitpoints
            times=per level
            increase_total=1
        [/effect]
    [/trait]
#enddef
