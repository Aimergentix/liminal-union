#define AMLA_PHOINIX_END
    [advancement]
        id=LIUN_amla_phoinix_end
        always_display=yes
        strict_amla=no
        major_amla=yes
        max_times=3                # AMLA capped end loop
        description= _ "Cycle of death and rebirth 🔥 | …when a phoinix nears the end of its life, its inner fire has consumed it. A mystically reborn phoinix instantly rises from the ashes…"
        image="icons/phoinix.webp"
        [effect]
            apply_to=type
            name="LIUN_Phoinix"    # cycle of death–rebirth effect
        [/effect]
        [effect]
            apply_to=hitpoints
            violate_maximum=no
            increase_total=2
            heal_full=yes
        [/effect]
        [effect]
            apply_to=max_experience
            increase=30%
        [/effect]
        [effect]
            apply_to=status
            remove=poisoned
        [/effect]
        [effect]
            apply_to=status
            remove=slowed
        [/effect]
    [/advancement]
#enddef
