#textdomain wesnoth-liminal-union

# Customized after max level advancements (AMLA)
# see: Monster Origins – The First Golem
# https://www.youtube.com/watch?v=OZKN535GkEM

#define AMLA_VALORHEART_END
    [advancement]
        id=LIUN_valorheart_end
        always_display=yes
        strict_amla=no # only shows up when advances_to=null
        major_amla=no
        max_times=5    # MLA capped end loop
        description= _ "Order of Remembrance 🎗 | Stiff-Necked. Defiant. Never Again."
        image="icons/amla-gallantry.webp"
        [effect]
            apply_to=hitpoints
            violate_maximum=no
            increase_total=3
            heal_full=yes
        [/effect]
        [effect]
            apply_to=max_experience
            increase=20%
        [/effect]
        [effect]
            apply_to=status
            remove=poisoned
        [/effect]
        [effect]
            apply_to=status
            remove=slowed
        [/effect]
        [effect]
            apply_to=new_ability
            [abilities]
                {ABILITY_AMLA_LEADER_MARKER}
            [/abilities]
        [/effect]
    [/advancement]
#enddef

#define AMLA_SIMULACRUM_END
    [advancement]
        id=LIUN_amla_simulacrum_end
        always_display=yes
        strict_amla=no
        major_amla=yes
        max_times=6         # AMLA capped end loop (capped at 6 to prevent ≤0 HP)
        description= _ "Inspection and reawakening | This G8 simulacrum undergoes mending, inspection, and ordered reawakening."
        image="icons/reboot.webp"
        [effect]
            apply_to=hitpoints
            heal_full=yes
            increase_total=-3
        [/effect]
        [effect]
            apply_to=max_experience
            increase=-10%
        [/effect]
        [effect]
            apply_to=status
            remove=slowed
        [/effect]
    [/advancement]
#enddef

