#define CONDUCTANCE_STANDING_ANIM
    [standing_anim]
        start_time=0
        [frame]
            halo="halo/conductance-aura-1.webp:750,halo/conductance-aura-2.webp:750,halo/conductance-aura-3.webp:750,halo/conductance-aura-4.webp:750"
        [/frame]
    [/standing_anim]
#enddef

#define ABILITY_CONDUCTOR
    [dummy]
        id=LIUN_conductor
        name= _ "conductor"
        female_name= _ "female^conductor"
        description= _ "Twilight lantern: by day and by night, this officer pulls the time of day on its own hex and the hexes around it 10 points toward twilight. Liminal units there fight with +10% damage. Lawful and chaotic units there, friend or foe, gain or lose 10% less from the time of day. Lanterns do not stack."
    [/dummy]
    # Twilight lantern (engine [illuminates], radius 1). The [filter] is checked on the
    # flat time of day of the officer's hex, so exactly one lantern is active by day
    # (darkens toward 0) or by night (lights toward 0), none at dawn and dusk.
    # Liminal bonus = 25 - |lawful_bonus|, so a 25 -> 15 shift gives liminal units +10%.
    # Unnamed, so the help shows only the conductor entry above.
    [illuminates]
        id=LIUN_twilight_lantern_day
        value=-10
        min_value=0
        cumulative=no
        [filter]
            [filter_location]
                time_of_day=lawful
            [/filter_location]
        [/filter]
    [/illuminates]
    [illuminates]
        id=LIUN_twilight_lantern_night
        value=10
        max_value=0
        cumulative=no
        [filter]
            [filter_location]
                time_of_day=chaotic
            [/filter_location]
        [/filter]
    [/illuminates]
#enddef

# LEADERSHIP - type abilities:
# -----------------------------------------------
#define ABILITY_TEAMWEAPONBEARER
    [leadership]
        id=LIUN_team_weaponbearer
        value=10
        name= _ "team"
        female_name= _ "female^team"
        description= _ "When paired with an adjacent Shieldguard, this unit and that Shieldguard deal 10% more damage per level."
        description_inactive= _ "Inactive unless adjacent to an allied Shieldguard."
        cumulative=no
        affect_self=yes
        affect_allies=yes
        [filter]
            [filter_adjacent]
                type_adv_tree=LIUN_Shieldguard
            [/filter_adjacent]
        [/filter]
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
            [filter]
                type_adv_tree=LIUN_Shieldguard
            [/filter]
        [/affect_adjacent]
    [/leadership]
#enddef

# HEAL - type abilities:
# -----------------------------------------------
#define ABILITY_EXTRA_REPAIR AMT
    # Canned definition of this ability to be included in an [abilities] clause.
    # Adjusted description for golem warforms, compared to mainline ABILITY_EXTRA_HEAL.
    [heals]
        id=LIUN_mobile_repair
        name= _ "mobile repair"
        female_name= _ "female^mobile repair"
        description= _ "Quickbound golems and other warforms, such as war chariots, are restored in repair shops in towns and cities or by mobile artificers. Adjacent warforms regain 4 HP per turn from a Jaeger or Mechatronic, 8 HP from a Techtronic and 12 HP from a veteran Techtronic (2·2)."
        description_inactive= _ "This is inactive because no warform stands next to this artificer."
        value={AMT}
        affect_self=no
        affect_allies=yes
        cumulative=no
        [filter]
            [filter_adjacent]
                race="maidengolem"
            [/filter_adjacent]
        [/filter]
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
            [filter]
                race="maidengolem"
            [/filter]
        [/affect_adjacent]
    [/heals]
#enddef

#define ABILITY_FIRSTAID AMT
    # Canned definition of the heal ability to be included in an [abilities] clause.
    [heals]
        id=LIUN_first_aid
        name= _ "first aid"
        female_name= _ "female^first aid"
        description= _ "This unit has basic field-medicine skill and equipment. It can heal and slow the effects of poison."
        value={AMT}
        poison=slowed   # slowed, cured
        affect_self=no
        affect_allies=yes
        cumulative=no
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
            [filter]
                [not]
                    trait="undead, mechanical, elemental, LIUN_cyborg, LIUN_immortal"
                [/not]
            [/filter]
        [/affect_adjacent]
    [/heals]
#enddef

# Special - type abilities:
# -----------------------------------------------
#define ABILITY_SUICIDEBOMBER
    # Note: this will not work with [attack] range=melee
    # or =ranged in the [unit_type] [attack] use
    # "range=kamikaze" instead
    [dummy]
        id=LIUN_suicide_bomber
        name= _ "suicide bomber"
        female_name= _ "female^suicide bomber"
        description=_"The suicide bomber always hits a target when attacking, but dies instantly"
    [/dummy]
    [/abilities]
    [event]
        id=LIUN_event_suicide_bomber
        name=attack_end
        first_time_only=no
        [filter]
            ability=LIUN_suicide_bomber
        [/filter]
        [harm_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]
            amount=999
            kill=yes
            fire_event=yes
            experience=yes # Grants XP to the defender if they survived
        [/harm_unit]
    [/event]
    [+abilities]
#enddef
