#textdomain wesnoth-liminal-union
# wmllint: general spellings Kabbalah Kabbalahs Golem Golems Chol bird Chol birds Rav Ravs Posek Poseks Ivri liminal_union scripturestudy call the phoinix bird

# RESONANCE - alloy assignment macros:
# -----------------------------------------------
# Use these inside a [unit_type] → [event] name=unit_placed block,
# or in [modifications] → [object] on the unit definition,
# to stamp the lu_alloy and optionally lu_conductor variables.
#
# Example usage in a unit .cfg:
#   {LIUN_ALLOY_PYRITE}        — for Maiden Corps units
#   {LIUN_ALLOY_KRYONITE}      — for Marine Corps units
#   {LIUN_ALLOY_ARCANITE}      — for elite/vanguard units
#   {LIUN_CONDUCTOR}            — add to officer/captain units
#
# These set unit variables that the Lua resonance engine reads.
# They do NOT grant any bonus by themselves.

#define LIUN_ALLOY_PYRITE
    [+variables]
        lu_alloy=pyrite
    [/variables]
#enddef

#define LIUN_ALLOY_KRYONITE
    [+variables]
        lu_alloy=kryonite
    [/variables]
#enddef

#define LIUN_ALLOY_ARCANITE
    [+variables]
        lu_alloy=arcanite
    [/variables]
#enddef

#define LIUN_CONDUCTOR
    [+variables]
        lu_conductor=yes
    [/variables]
#enddef

#define ABILITY_AMLA_LEADER_MARKER
    [dummy]
        id=LIUN_amla_leader_marker
    [/dummy]
#enddef

# RESONANCE - WML-native ability for tooltip display:
# -----------------------------------------------
# This is a [dummy] ability so the resonance mechanic appears
# in the unit's ability list with a proper description.
# The actual bonuses are applied by the Lua engine.

#define ABILITY_RESONANCE_PYRITE
    [dummy]
        id=LIUN_resonance_pyrite
        name= _ "Pyrite resonance"
        female_name= _ "female^Pyrite resonance"
        description= _ "This unit's Pyrite armor resonates with adjacent Pyrite-armored allies. Resonance tier depends on the current formation and is recalculated after movement. It grants physical resistance and improves ranged accuracy by 5 percentage points per tier. At Tier 3, it also grants +10% Fire and +10% Arcane resistance and Focus. Poison disables resonance; slow can reduce its tier."
    [/dummy]
#enddef

#define ABILITY_RESONANCE_KRYONITE
    [dummy]
        id=LIUN_resonance_kryonite
        name= _ "Kryonite resonance"
        female_name= _ "female^Kryonite resonance"
        description= _ "This unit's Kryonite armor resonates with adjacent Kryonite-armored allies. Resonance tier depends on the current formation and is recalculated after movement. It grants physical resistance and improves melee defense. At Tier 3, it grants firststrike on defense and +10% Cold and +10% Arcane resistance. Interlock can redistribute up to 30% of damage from a normal hit to eligible adjacent Kryonite allies; no recipient falls below 1 HP. Poison disables resonance; slow can reduce its tier."
    [/dummy]
#enddef

#define ABILITY_RESONANCE_ARCANITE
    [dummy]
        id=LIUN_resonance_arcanite
        name= _ "Arcanite resonance"
        female_name= _ "female^Arcanite resonance"
        description= _ "This unit's Arcanite armor resonates with adjacent Arcanite-armored allies. Resonance tier depends on the current formation and is recalculated after movement. It grants physical resistance and increases melee damage by 1 per tier. At Tier 3, it also grants +20% Fire and +20% Cold resistance. Poison disables resonance; slow can reduce its tier."
    [/dummy]
#enddef

#define ABILITY_SQUAD_ANCHOR_PYRITE
    [dummy]
        id=LIUN_squad_anchor_pyrite
        name= _ "squad anchor"
        female_name= _ "female^squad anchor"
        description= _ "Doctrinaire Squad Anchor: This veteran anchors the firing line, granting adjacent Pyrite-armored allies an additional +10% ranged accuracy on offense."
    [/dummy]
#enddef

#define ABILITY_SQUAD_ANCHOR_KRYONITE
    [dummy]
        id=LIUN_squad_anchor_kryonite
        name= _ "squad anchor"
        female_name= _ "female^squad anchor"
        description= _ "Doctrinaire Squad Anchor: This veteran anchors the shield wall. When adjacent Kryonite-armored allies take damage in formation, Interlock cushions an additional 2 points of damage."
    [/dummy]
#enddef

#define ABILITY_FORMATION_ZOC
    [dummy]
        id=LIUN_formation_zoc_dummy
        name= _ "formation zoc"
        female_name= _ "female^formation zoc"
        description= _ "This level 0 unit exerts Zone of Control while adjacent to an eligible Liminal Union ally. The effect is recalculated when formation changes. Poison disables it; slow can disrupt it unless an unslowed eligible ally remains adjacent."
    [/dummy]
#enddef

#define CONDUCTANCE_STANDING_ANIM
    [standing_anim]
        start_time=0
        [frame]
            halo="halo/conductance-aura-1.webp:750,halo/conductance-aura-2.webp:750,halo/conductance-aura-3.webp:750,halo/conductance-aura-4.webp:750"
        [/frame]
    [/standing_anim]
#enddef

#define ABILITY_CONDUCTOR
    [dummy]
        id=LIUN_conductor
        name= _ "conductor"
        female_name= _ "female^conductor"
        description= _ "This officer and adjacent allied liminal units gain +10 percentage points of damage during lawful (Day) or chaotic (Night) times of day. Their alignment is not changed. The effect applies regardless of level."
    [/dummy]
    [leadership]
        id=LIUN_conductor_day
        value=10
        cumulative=no
        affect_self=yes
        affect_allies=yes
        [filter]
            alignment=liminal
            [filter_location]
                time_of_day=lawful
            [/filter_location]
        [/filter]
        [affect_adjacent]
            [filter]
                alignment=liminal
                [filter_location]
                    time_of_day=lawful
                [/filter_location]
            [/filter]
        [/affect_adjacent]
    [/leadership]
    [leadership]
        id=LIUN_conductor_night
        value=10
        cumulative=no
        affect_self=yes
        affect_allies=yes
        [filter]
            alignment=liminal
            [filter_location]
                time_of_day=chaotic
            [/filter_location]
        [/filter]
        [affect_adjacent]
            [filter]
                alignment=liminal
                [filter_location]
                    time_of_day=chaotic
                [/filter_location]
            [/filter]
        [/affect_adjacent]
    [/leadership]
#enddef

# LEADERSHIP - type abilities:
# -----------------------------------------------
#define ABILITY_CADET
    # Canned definition of the Leadership ability to be included in an
    # [abilities] clause.
    [leadership]
        id=LIUN_cadet_leadership
        value="25"
        name= _ "leadership"
        female_name= _ "female^leadership"
        description= _ "This cadet unit can lead troops in battle. Adjacent lvl 0 units from the same side deal 25% more damage."
        cumulative=no
        affect_self=no
        affect_allies=yes
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
            [filter]
                formula="level = other.level"
            [/filter]
        [/affect_adjacent]
    [/leadership]
#enddef

#define ABILITY_OFFICER
    # Canned definition of the Leadership ability to be included in an
    # [abilities] clause.
    # Changes in description, only.
    [leadership]
        id=LIUN_officer_leadership
        value="(25 * (level - other.level))"
        name= _ "leadership"
        female_name= _ "female^leadership"
        description= _ "This officer unit can lead other troops into battle. All adjacent lower-level units from the same side deal 25% more damage for each difference in level."
        cumulative=no
        affect_self=no
        affect_allies=yes
        [affect_adjacent]
            [filter]
                formula="level < other.level"
            [/filter]
        [/affect_adjacent]
    [/leadership]
#enddef

#define ABILITY_TEAMWEAPONBEARER
    [leadership]
        id=LIUN_team_weaponbearer
        value=10
        name= _ "team"
        female_name= _ "female^team"
        description= _ "When paired with an adjacent Shieldguard, this unit and that Shieldguard deal 10% more damage per level."
        description_inactive= _ "Inactive unless adjacent to an allied Shieldguard."
        cumulative=no
        affect_self=yes
        affect_allies=yes
        [filter]
            [filter_adjacent]
                type_adv_tree=LIUN_Shieldguard
            [/filter_adjacent]
        [/filter]
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
            [filter]
                type_adv_tree=LIUN_Shieldguard
            [/filter]
        [/affect_adjacent]
    [/leadership]
#enddef

# RESISTANCE - type abilities:
# -----------------------------------------------
#define ABILITY_TEAMSHIELDBEARER
    [resistance]
        id=LIUN_team_shieldbearer
        value=10
        max_value=10
        name= _ "team"
        female_name= _ "female^team"
        description= _ "When paired with an adjacent Weaponguard, this unit and that Weaponguard gain physical resistance."
        description_inactive= _ "Inactive unless adjacent to an allied Weaponguard."
        active_on=both
        apply_to=blade,pierce,impact
        cumulative=no
        affect_self=yes
        affect_allies=yes
        [filter]
            [filter_adjacent]
                type_adv_tree=LIUN_Weaponguard
            [/filter_adjacent]
        [/filter]
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
            [filter]
                type_adv_tree=LIUN_Weaponguard
            [/filter]
        [/affect_adjacent]
    [/resistance]
#enddef

# HEAL - type abilities:
# -----------------------------------------------
#define ABILITY_EXTRA_REPAIR AMT
    # Canned definition of this ability to be included in an [abilities] clause.
    # Adjusted description for golem warforms, compared to mainline ABILITY_EXTRA_HEAL.
    [heals]
        id=LIUN_mobile_repair
        name= _ "mobile repair"
        female_name= _ "female^mobile repair"
        description= _ "Quickbound golems and other warforms, such as war chariots, can be restored in repair shops in towns and cities or by mobile artificers, up to 6 HP per turn."
        description_inactive= _ "This is inactive because no warform stands next to this artificer."
        value={AMT}
        affect_self=no
        affect_allies=yes
        cumulative=no
        [filter]
            [filter_adjacent]
                race="maidengolem"
            [/filter_adjacent]
        [/filter]
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
            [filter]
                race="maidengolem"
            [/filter]
        [/affect_adjacent]
    [/heals]
#enddef

#define ABILITY_FIRSTAID AMT
    # Canned definition of the heal ability to be included in an [abilities] clause.
    [heals]
        id=LIUN_first_aid
        name= _ "first aid"
        female_name= _ "female^first aid"
        description= _ "This unit has basic field-medicine skill and equipment. It can heal and slow the effects of poison."
        value={AMT}
        poison=slowed   # slowed, cured
        affect_self=yes
        affect_allies=yes
        cumulative=no
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
            [filter]
                [not]
                    trait="undead, mechanical, elemental, LIUN_cyborg, LIUN_immortal"
                [/not]
            [/filter]
        [/affect_adjacent]
    [/heals]
#enddef

# Special - type abilities:
# -----------------------------------------------
#define ABILITY_SUICIDEBOMBER
    # Note: this will not work with [attack] range=melee
    # or =ranged in the [unit_type] [attack] use
    # "range=kamikaze" instead
    [dummy]
        id=LIUN_suicide_bomber
        name= _ "suicide bomber"
        female_name= _ "female^suicide bomber"
        description=_"The suicide bomber always hits a target when attacking, but dies instantly"
    [/dummy]
    [/abilities]
    [event]
        id=LIUN_event_suicide_bomber
        name=attack_end
        first_time_only=no
        [filter]
            ability=LIUN_suicide_bomber
        [/filter]
        [harm_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]
            amount=999
            kill=yes
            fire_event=yes
            experience=yes # Grants XP to the defender if they survived
        [/harm_unit]
    [/event]
    [+abilities]
#enddef
