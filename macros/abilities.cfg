#textdomain wesnoth-liminal-union
# wmllint: general spellings Kabbalah Kabbalahs Golem Golems Chol bird Chol birds Rav Ravs Posek Poseks Ivri liminal_union scripturestudy call the phoinix bird

# A unit's alloy is its resonance dummy ability (ABILITY_RESONANCE_*); officers carry
# the LIUN_conductor ability. lua/resonance.lua caches both in unit variables at runtime.
# Unit types cannot carry [variables]: the engine ignores them.

#define LIUN_CONDUCTOR
    [+abilities]
        {ABILITY_OFFICER_SHIELD}
    [/abilities]
#enddef

#define ABILITY_OFFICER_SHIELD
    [resistance]
        id=LIUN_officer_shield
        add=10
        max_value=50
        name= _ "shield"
        female_name= _ "female^shield"
        description= _ "When attacked, this unit raises its shield and gains 10% resistance to blade, pierce and impact."
        active_on=both
        apply_to=blade,pierce,impact
        [filter_second_weapon]
            range=ranged
        [/filter_second_weapon]
    [/resistance]
#enddef

#define ABILITY_PORTAL_WARDEN
    [dummy]
        id=LIUN_portal_warden
        name= _ "portal warden"
        female_name= _ "female^portal warden"
        description= _ "This Shieldguard carries a portable Arcanite portal, charged by mana crystals. After standing still for a full turn with a Phoinix beside it, the portal opens at once. Marines other than leaders may then travel one way from their side's villages to any free hex beside it, arriving with no moves and no attack that turn. The portal closes when this unit moves."
    [/dummy]
#enddef

#define ABILITY_AMLA_LEADER_MARKER
    [dummy]
        id=LIUN_amla_leader_marker
    [/dummy]
#enddef

# RESONANCE - WML-native ability for tooltip display:
# -----------------------------------------------
# This is a [dummy] ability so the resonance mechanic appears
# in the unit's ability list with a proper description.
# The actual bonuses are applied by the Lua engine.

#define ABILITY_RESONANCE_PYRITE
    [dummy]
        id=LIUN_resonance_pyrite
        name= _ "Pyrite resonance"
        female_name= _ "female^Pyrite resonance"
        description= _ "Resonates with adjacent Pyrite-armored allies (Tier 1–3). Grants physical resistance and +5% ranged accuracy per tier; Level-0 units in formation exert Zone of Control. At Tier 3, grants +10% Fire and +10% Arcane resistance and Focus. Poison disables resonance; slow can reduce its tier."
    [/dummy]
#enddef

#define ABILITY_RESONANCE_KRYONITE
    [dummy]
        id=LIUN_resonance_kryonite
        name= _ "Kryonite resonance"
        female_name= _ "female^Kryonite resonance"
        description= _ "Resonates with adjacent Kryonite-armored allies (Tier 1–3). Grants physical resistance and improves melee defense; Level-0 units in formation exert Zone of Control. At Tier 3, grants firststrike on defense and +10% Cold and +10% Arcane resistance. Interlock redistributes up to 30% of normal hit damage to eligible adjacent Kryonite allies (never below 1 HP, never onto a leader). Poison disables resonance; slow can reduce its tier."
    [/dummy]
#enddef

#define ABILITY_RESONANCE_ARCANITE
    [dummy]
        id=LIUN_resonance_arcanite
        name= _ "Arcanite resonance"
        female_name= _ "female^Arcanite resonance"
        description= _ "Resonates with adjacent Arcanite-armored allies (Tier 1–3). Grants physical resistance and +1 melee damage per tier; Level-0 units in formation exert Zone of Control. At Tier 3, grants +20% Fire and +20% Cold resistance. Poison disables resonance; slow can reduce its tier."
    [/dummy]
#enddef

#define ABILITY_SQUAD_ANCHOR_PYRITE
    [dummy]
        id=LIUN_squad_anchor_pyrite
        name= _ "squad anchor [pyrite]"
        female_name= _ "female^squad anchor [pyrite]"
        description= _ "Reinforces adjacent Pyrite allies: +10% ranged accuracy on offense (max +20% total)."
    [/dummy]
#enddef

#define ABILITY_SQUAD_ANCHOR_KRYONITE
    [dummy]
        id=LIUN_squad_anchor_kryonite
        name= _ "squad anchor [kryonite]"
        female_name= _ "female^squad anchor [kryonite]"
        description= _ "Reinforces adjacent Kryonite allies: Interlock absorbs +2 additional damage."
    [/dummy]
#enddef

#define ABILITY_SQUAD_ANCHOR_ARCANITE
    [dummy]
        id=LIUN_squad_anchor_arcanite
        name= _ "squad anchor [arcanite]"
        female_name= _ "female^squad anchor [arcanite]"
        description= _ "Reinforces adjacent Arcanite allies: +1 melee damage on offense (max +3 Sunder total)."
    [/dummy]
#enddef

#define CONDUCTANCE_STANDING_ANIM
    [standing_anim]
        start_time=0
        [frame]
            halo="halo/conductance-aura-1.webp:750,halo/conductance-aura-2.webp:750,halo/conductance-aura-3.webp:750,halo/conductance-aura-4.webp:750"
        [/frame]
    [/standing_anim]
#enddef

#define ABILITY_CONDUCTOR
    [dummy]
        id=LIUN_conductor
        name= _ "conductor"
        female_name= _ "female^conductor"
        description= _ "This officer and adjacent allied liminal units gain +10 percentage points of damage during lawful (Day) or chaotic (Night) times of day. Their alignment is not changed. The effect applies regardless of level."
    [/dummy]
    [leadership]
        id=LIUN_conductor_day
        value=10
        cumulative=no
        affect_self=yes
        affect_allies=yes
        [filter]
            alignment=liminal
            [filter_location]
                time_of_day=lawful
            [/filter_location]
        [/filter]
        [affect_adjacent]
            [filter]
                alignment=liminal
                [filter_location]
                    time_of_day=lawful
                [/filter_location]
            [/filter]
        [/affect_adjacent]
    [/leadership]
    [leadership]
        id=LIUN_conductor_night
        value=10
        cumulative=no
        affect_self=yes
        affect_allies=yes
        [filter]
            alignment=liminal
            [filter_location]
                time_of_day=chaotic
            [/filter_location]
        [/filter]
        [affect_adjacent]
            [filter]
                alignment=liminal
                [filter_location]
                    time_of_day=chaotic
                [/filter_location]
            [/filter]
        [/affect_adjacent]
    [/leadership]
#enddef

# LEADERSHIP - type abilities:
# -----------------------------------------------
#define ABILITY_TEAMWEAPONBEARER
    [leadership]
        id=LIUN_team_weaponbearer
        value=10
        name= _ "team"
        female_name= _ "female^team"
        description= _ "When paired with an adjacent Shieldguard, this unit and that Shieldguard deal 10% more damage per level."
        description_inactive= _ "Inactive unless adjacent to an allied Shieldguard."
        cumulative=no
        affect_self=yes
        affect_allies=yes
        [filter]
            [filter_adjacent]
                type_adv_tree=LIUN_Shieldguard
            [/filter_adjacent]
        [/filter]
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
            [filter]
                type_adv_tree=LIUN_Shieldguard
            [/filter]
        [/affect_adjacent]
    [/leadership]
#enddef

# HEAL - type abilities:
# -----------------------------------------------
#define ABILITY_EXTRA_REPAIR AMT
    # Canned definition of this ability to be included in an [abilities] clause.
    # Adjusted description for golem warforms, compared to mainline ABILITY_EXTRA_HEAL.
    [heals]
        id=LIUN_mobile_repair
        name= _ "mobile repair"
        female_name= _ "female^mobile repair"
        description= _ "Quickbound golems and other warforms, such as war chariots, are restored in repair shops in towns and cities or by mobile artificers. Adjacent warforms regain 4 HP per turn from a Jaeger or Mechatronic, 8 HP from a Techtronic and 12 HP from a veteran Techtronic (2·2)."
        description_inactive= _ "This is inactive because no warform stands next to this artificer."
        value={AMT}
        affect_self=no
        affect_allies=yes
        cumulative=no
        [filter]
            [filter_adjacent]
                race="maidengolem"
            [/filter_adjacent]
        [/filter]
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
            [filter]
                race="maidengolem"
            [/filter]
        [/affect_adjacent]
    [/heals]
#enddef

#define ABILITY_FIRSTAID AMT
    # Canned definition of the heal ability to be included in an [abilities] clause.
    [heals]
        id=LIUN_first_aid
        name= _ "first aid"
        female_name= _ "female^first aid"
        description= _ "This unit has basic field-medicine skill and equipment. It can heal and slow the effects of poison."
        value={AMT}
        poison=slowed   # slowed, cured
        affect_self=no
        affect_allies=yes
        cumulative=no
        [affect_adjacent]
            adjacent=n,ne,se,s,sw,nw
            [filter]
                [not]
                    trait="undead, mechanical, elemental, LIUN_cyborg, LIUN_immortal"
                [/not]
            [/filter]
        [/affect_adjacent]
    [/heals]
#enddef

# Special - type abilities:
# -----------------------------------------------
#define ABILITY_SUICIDEBOMBER
    # Note: this will not work with [attack] range=melee
    # or =ranged in the [unit_type] [attack] use
    # "range=kamikaze" instead
    [dummy]
        id=LIUN_suicide_bomber
        name= _ "suicide bomber"
        female_name= _ "female^suicide bomber"
        description=_"The suicide bomber always hits a target when attacking, but dies instantly"
    [/dummy]
    [/abilities]
    [event]
        id=LIUN_event_suicide_bomber
        name=attack_end
        first_time_only=no
        [filter]
            ability=LIUN_suicide_bomber
        [/filter]
        [harm_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]
            amount=999
            kill=yes
            fire_event=yes
            experience=yes # Grants XP to the defender if they survived
        [/harm_unit]
    [/event]
    [+abilities]
#enddef
