#textdomain wesnoth-liminal-union

# Stun (lua/stun.lua): a hit removes a level 1+ target's zone of control until its own
# side's next turn begins. The G9 Overclock appends the same special (id=stun) in Lua.
#define WEAPON_SPECIAL_LIUN_STUN
    [stun]
        id=stun
        name= _ "stun"
        description= _ "When this attack hits, an opponent of level 1 or higher is dazed and loses its zone of control until its own side’s next turn begins."
    [/stun]
#enddef

# Stun handlers. Used in LIUN_ERA_EVENTS and in the unit types that carry the special, so
# stun also works with the worker modifications outside the Liminal Union eras. Event ids
# make the engine register each handler only once.
#define LIUN_STUN_EVENTS
    [event]
        id=LIUN_event_stun_attacker_hits
        name=attacker_hits
        first_time_only=no
        [lua]
            code=<<
                wesnoth.require("~add-ons/liminal-union/lua/stun.lua").on_attacker_hits(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]
    [event]
        id=LIUN_event_stun_defender_hits
        name=defender_hits
        first_time_only=no
        [lua]
            code=<<
                wesnoth.require("~add-ons/liminal-union/lua/stun.lua").on_defender_hits(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]
    [event]
        id=LIUN_event_stun_side_turn
        name=side turn
        first_time_only=no
        [lua]
            code=<<
                wesnoth.require("~add-ons/liminal-union/lua/stun.lua").on_side_turn(wesnoth.current.side)
            >>
        [/lua]
    [/event]
#enddef

#define WEAPON_SPECIAL_BOMBEXPLOSION
    [chance_to_hit]
        id=LIUN_suicide_bomb_explosion
        name= _ "bomb attack"
        description=_"Since suicide attacks are set up close to the enemy, this bomb attack always has a 100% chance to hit."
        value=100
        cumulative=no
    [/chance_to_hit]
#enddef
