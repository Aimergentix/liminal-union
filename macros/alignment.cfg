#textdomain wesnoth-liminal-union

[alignment]
    id=LIUN_liminal
    name= _ "liminal"
    description= _ "Liminal units are at their most effective during the transition turns of Dawn and Dusk (+25%). The Liminal Union's unique engineering reduces the midday penalty to -15%."
    image="misc/liminal.webp"

    # Transition Turns (Peak Power)
    [bonus]
        time_id=dawn
        value=25
    [/bonus]
    [bonus]
        time_id=dusk
        value=25
    [/bonus]

    # Day Turns (Stabilized Penalty)
    [bonus]
        time_id=morning
        value=-15
    [/bonus]
    [bonus]
        time_id=midday
        value=-15
    [/bonus]
    [bonus]
        time_id=afternoon
        value=-15
    [/bonus]

    # Night Turns (Standard Penalty)
    [bonus]
        time_id=first_watch
        value=-25
    [/bonus]
    [bonus]
        time_id=second_watch
        value=-25
    [/bonus]
[/alignment]

[alignment]
    id=LIUN_liminal_conducted
    name= _ "liminal (conducted)"
    description= _ "This unit's alignment is being stabilized by a nearby Conductor. Peak power is maintained, and Day and Night penalties are softened by +10%."
    image="misc/liminal.webp" # You could use a glow effect variant here

    [bonus]
        time_id=dawn
        value=25
    [/bonus]
    [bonus]
        time_id=dusk
        value=25
    [/bonus]

    # Day Turns (Stabilized Penalty - softened from -15% to -5%)
    [bonus]
        time_id=morning
        value=-5
    [/bonus]
    [bonus]
        time_id=midday
        value=-5
    [/bonus]
    [bonus]
        time_id=afternoon
        value=-5
    [/bonus]

    # Night Turns (Stabilized Penalty - softened from -25% to -15%)
    [bonus]
        time_id=first_watch
        value=-15
    [/bonus]
    [bonus]
        time_id=second_watch
        value=-15
    [/bonus]
[/alignment]
