#textdomain wesnoth-liminal-union

# achievements in the UMC era LIUN is based around exploration of the new multiplayer after max level advancement (AMLA)
# in short in each level Liminal Union units of this era will get an in between advancement (half of XP) to level up
# it means that there are two AMLA steps to level up from lvl0 to lvl1 for example
# achievements represent the steps all the units can achieve in advancement
# there are 5 achievements: Bronzeheart, Silverheart, Goldheart, Valorheart, Pour le Meritë
# to level up one unit all 5 times until the end achievement Meritë in a multiplayer session would be hard

[achievement_group]
    display_name=_"Liminal Union 🔰"
    content_for=LIUN_achievements
    [achievement]
        id=LIUN_bronzeheart
        hidden=no
        name= _ "Bronze Heart Award 🎖️"
        name_completed= _ "Bronze Heart Award 🎖️"
        description= _ "For meritorious conduct in the field."
        description_completed= _ "For meritorious conduct in the field."
        icon="data/core/images/attacks/blank-attack.png~SCALE(72,72)~BLIT(data/add-ons/liminal-union/images/icons/amla-bronze.webp~RC(magenta>blue), 0, 0)"
        icon_completed="data/core/images/attacks/blank-attack.png~SCALE(72,72)~BLIT(data/add-ons/liminal-union/images/icons/amla-bronze.webp~RC(magenta>blue), 0, 0)~BLIT(misc/achievement-frame-mp.png, 0, 0)"
