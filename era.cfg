#textdomain wesnoth-liminal-union

[era]
    id=LIUN_era_courageous
    name= _ "Liminal Union 🔰 Default (" + "{LIUN_VERSION}" + ")"
    description= _ "The extended standard era for Wesnoth multiplayer. Consists of eight factions and is generally balanced."
    type=hybrid
    {RANDOM_SIDE}
    {multiplayer/factions/loyalists-default.cfg}
    {multiplayer/factions/rebels-default.cfg}
    {multiplayer/factions/northerners-default.cfg}
    {multiplayer/factions/undead-default.cfg}
    {multiplayer/factions/knalgans-default.cfg}
    {multiplayer/factions/drakes-default.cfg}
    {multiplayer/factions/dunefolk-default.cfg}
    {~add-ons/liminal-union/factions/liminal-union-braves.cfg}
    {QUICK_4MP_LEADERS}
    {TURNS_OVER_ADVANTAGE}
    {LIUN_ERA_EVENTS}
    [event]
        id=LIUN_event_leader_advance_courageous
        name=post_advance
        first_time_only=no
        [filter]
            ability=LIUN_amla_leader_marker
            [not]
                canrecruit=yes
            [/not]
        [/filter]
        [modify_unit]
            [filter]
                id=$unit.id
            [/filter]
            canrecruit=yes
        [/modify_unit]
    [/event]
[/era]


[era]
    id=LIUN_era_heroes
    name= _ "Liminal Union ⭐ Age of Heroes (" + "{LIUN_VERSION}" + ")"
    description= _ "An extended era with higher level units: level three leaders, with level one and two units available for recruit. Consists of eight factions. Not considered balanced."
    type=mp
    {RANDOM_SIDE}
    {multiplayer/factions/loyalists-aoh.cfg}
    {multiplayer/factions/rebels-aoh.cfg}
    {multiplayer/factions/northerners-aoh.cfg}
    {multiplayer/factions/undead-aoh.cfg}
    {multiplayer/factions/knalgans-aoh.cfg}
    {multiplayer/factions/drakes-aoh.cfg}
    {multiplayer/factions/dunefolk-aoh.cfg}
    {~add-ons/liminal-union/factions/liminal-union-heroes.cfg}
    {QUICK_4MP_LEADERS}
    {TURNS_OVER_ADVANTAGE}
    {LIUN_ERA_EVENTS}
    [event]
        id=LIUN_event_leader_advance_heroes
        name=post_advance
        first_time_only=no
        [filter]
            ability=LIUN_amla_leader_marker
            [not]
                canrecruit=yes
            [/not]
        [/filter]
        [modify_unit]
            [filter]
                id=$unit.id
            [/filter]
            canrecruit=yes
        [/modify_unit]
    [/event]
[/era]
