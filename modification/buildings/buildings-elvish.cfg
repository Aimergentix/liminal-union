#textdomain wesnoth-liminal-union

#define LIUN_BUILDINGS_ELVISH
    # Build Village
    {LIUN_BUILD_VILLAGE "terrain/village/elven-tile.png" _"Build Village" 15 Ve (
        {LIUN_SHOW_IF ("LIUN_Elvish_Citizen") "G*,G*^Efm,D*"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}
    {LIUN_BUILD_VILLAGE "terrain/village/elven-snow-tile.png" _"Build Village" 15 Vea (
        {LIUN_SHOW_IF ("LIUN_Elvish_Citizen") "Aa"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}

    # ------------------------------------------------
    # CASTLES

    # normal variant
    {LIUN_TERRAFORM "terrain/castle/elven/tile.png" _"Build Castle" 5 () (
        {LIUN_SHOW_IF ("LIUN_Elvish_Citizen") "G*,G*^Efm,D*"}
    ) (
        {MODIFY_TERRAIN "Cv" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # snowy variant
    {LIUN_TERRAFORM "terrain/castle/winter-elven/tile.png" _"Build Castle" 5 () (
        {LIUN_SHOW_IF ("LIUN_Elvish_Citizen") "Aa"}
    ) (
        {MODIFY_TERRAIN "Cva" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # --------------------------------------
    # KEEP
    {LIUN_TERRAFORM "terrain/castle/elven/keep-tile.png" _"Build a Keep" 8 () (
        {LIUN_SHOW_IF ("LIUN_Elvish_Citizen") "!,Cvr,Cva,Chr,Chs,Chw,Cm*,Cud,!,C*"}
    ) (
        {MODIFY_TERRAIN "Kv" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/elven-ruin/keep-tile.png" _"Build a Keep" 8 () (
        {LIUN_SHOW_IF ("LIUN_Elvish_Citizen") "Cvr,Chr,Chs,Chw,Cm*"}
    ) (
        {MODIFY_TERRAIN "Kvr" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/winter-elven/keep-tile.png" _"Build a Keep" 8 () (
        {LIUN_SHOW_IF ("LIUN_Elvish_Citizen") "Cva"}
    ) (
        {MODIFY_TERRAIN "Kva" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # different forest
    {LIUN_TERRAFORM "terrain/forest/deciduous-summer-tile.png" _"Plant Saplings" 2 entangle.wav (
        {LIUN_SHOW_IF ("LIUN_Elvish_Citizen") "G*,G*^Efm,Hh*"}
    ) (
        {LIUN_MODIFY_TERRAIN_OVERLAY "^Fds" $x1 $y1}
    )}
#enddef
