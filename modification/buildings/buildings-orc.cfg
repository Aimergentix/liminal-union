#textdomain wesnoth-liminal-union

#define LIUN_BUILDINGS_ORC
    # Build Village
    {LIUN_BUILD_VILLAGE "terrain/village/orc-tile.png" _"Build Village" 15 Vo (
        {LIUN_SHOW_IF ("Goblin Spearman,Goblin Impaler,Goblin Rouser,LIUN_Minion") "G*,G*^Efm,D*"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}
    {LIUN_BUILD_VILLAGE "terrain/village/orc-snow-tile.png" _"Build Village" 15 Voa (
        {LIUN_SHOW_IF ("Goblin Spearman,Goblin Impaler,Goblin Rouser,LIUN_Minion") "Aa"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}

    # ------------------------------------------------
    # CASTLES

    {LIUN_TERRAFORM "terrain/castle/orcish/tile.png" _"Build Castle" 6 () (
        {LIUN_SHOW_IF ("Goblin Spearman,Goblin Impaler,Goblin Rouser,LIUN_Minion") "G*,G*^Efm,D*"}
    ) (
        {MODIFY_TERRAIN "Co" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/winter-orcish/tile.png" _"Build Castle" 6 () (
        {LIUN_SHOW_IF ("Goblin Spearman,Goblin Impaler,Goblin Rouser,LIUN_Minion") "Aa"}
    ) (
        {MODIFY_TERRAIN "Coa" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # --------------------------------------
    # KEEP

    {LIUN_TERRAFORM "terrain/castle/orcish/keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Goblin Spearman,Goblin Impaler,Goblin Rouser,LIUN_Minion") "!,Cha,Coa,Cea,Cva,Cfa,Cud,!,C*"}
    ) (
        {MODIFY_TERRAIN "Ko" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/winter-orcish/keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Goblin Spearman,Goblin Impaler,Goblin Rouser,LIUN_Minion") "Cha,Coa,Cea,Cva,Cfa"}
    ) (
        {MODIFY_TERRAIN "Koa" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
#enddef
