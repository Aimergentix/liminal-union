#textdomain wesnoth-liminal-union

#define LIUN_BUILDINGS_DWARVISH
    # Build Village
    {LIUN_BUILD_VILLAGE "terrain/village/dwarven-tile.png" _"Build Village" 15 Vud (
        {LIUN_SHOW_IF ("LIUN_Dwarvish_Miner") "G*,G*^Efm,D*,Aa"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}

    # ------------------------------------------------
    # CASTLES

    # outside castle
    {LIUN_TERRAFORM "terrain/castle/outside-dwarven/dwarven-castle-tile.png" _"Build Castle" 5 () (
        {LIUN_SHOW_IF ("LIUN_Dwarvish_Miner,LIUN_Drake_Brave,LIUN_Saurian_Brave") "G*,G*^Efm,D*"}
    ) (
        {MODIFY_TERRAIN "Cf" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # snowy variant
    {LIUN_TERRAFORM "terrain/castle/winter-dwarven/dwarven-castle-tile.png" _"Build Castle" 5 () (
        {LIUN_SHOW_IF ("LIUN_Dwarvish_Miner,LIUN_Drake_Brave,LIUN_Saurian_Brave") "Aa"}
    ) (
        {MODIFY_TERRAIN "Cfa" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # --------------------------------------
    # KEEP

    # new variant
    # (Cud is handled in worker_options instead)
    {LIUN_TERRAFORM "terrain/castle/outside-dwarven/dwarven-keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("LIUN_Dwarvish_Miner,LIUN_Drake_Brave,LIUN_Saurian_Brave") "!,Cha,Coa,Cea,Cva,Cfa,Cfr,Cvr,Chr,Cud,!,C*"}
    ) (
        {MODIFY_TERRAIN "Kf" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # snowy variant
    {LIUN_TERRAFORM "terrain/castle/winter-dwarven/dwarven-keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("LIUN_Dwarvish_Miner,LIUN_Drake_Brave,LIUN_Saurian_Brave") "Cha,Coa,Cea,Cva,Cfa"}
    ) (
        {MODIFY_TERRAIN "Kfa" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # ruined variant
    {LIUN_TERRAFORM "terrain/castle/ruin-dwarven/dwarven-keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("LIUN_Dwarvish_Miner,LIUN_Drake_Brave,LIUN_Saurian_Brave") "Cfr,Cvr,Chr"}
    ) (
        {MODIFY_TERRAIN "Kfr" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
#enddef
