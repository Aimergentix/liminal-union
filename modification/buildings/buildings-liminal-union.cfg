#textdomain wesnoth-liminal-union

# The encampment faction.
# Can also upgrade castles to keeps of other factions for style reasons.

# Build Village
#define LIUN_BUILDINGS_LIMINAL_UNION
    # Walking Corpse also builds normal village (on G*)
    {LIUN_BUILD_VILLAGE "terrain/village/human-tile.png" _"Build Village" 15 Vh (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private,Walking Corpse") "G*,G*^Efm"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}
    # Same as human, but for 15 gold
    {LIUN_BUILD_VILLAGE "terrain/village/snow-tile.png" _"Build Village" 15 Vha (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private,LIUN_Fellah") "Aa"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}
    # On sand they build tents
    {LIUN_BUILD_VILLAGE "terrain/village/desert-camp-tile.png" _"Build Tent Camp" 15 Vdt (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "Dd*,D*^Edp*,D*^Esd"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}
    {LIUN_BUILD_VILLAGE "terrain/sand/beach.png~BLIT(terrain/village/desert-camp-tile.png)" _"Build Tent Camp" 15 Vct (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "!,Dd*,!,D*"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}

    # ------------------------------------------------
    # CASTLES

    {LIUN_TERRAFORM "terrain/castle/encampment/regular-tile.png" _"Build Encampment" 5 () (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "G*,G*^Efm,D*,D*^Edp*,D*^Esd"}
    ) (
        {MODIFY_TERRAIN "Ce" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/encampment/snow-tile.png" _"Build Encampment" 5 () (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "Aa"}
    ) (
        {MODIFY_TERRAIN "Cea" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # --------------------------------------
    # KEEPS

    # base variants
    {LIUN_TERRAFORM "terrain/castle/encampment/regular-keep-tile.png" _"Build a Keep" 5 () (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "!,Cha,Coa,Cea,Cva,Cfa,Cv*,Cf*,Cud,Ch,Chr,Chw,Chs,Cer,!,C*"}
    ) (
        {MODIFY_TERRAIN "Ke" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/encampment/snow-keep-tile.png" _"Build a Keep" 5 () (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "Coa,Cea"}
    ) (
        {MODIFY_TERRAIN "Kea" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/encampment-ruin/regular-keep-tile.png" _"Build a Keep" 5 () (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "Cer"}
    ) (
        {MODIFY_TERRAIN "Ker" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    # downgrading some solid castle to an encampment keep looks strange
    {LIUN_TERRAFORM "terrain/castle/ruined-keep-tile.png" _"Build a Keep" 5 () (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "Ch,Chr,Chw,Chs"}
    ) (
        {MODIFY_TERRAIN "Khr" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/elven-ruin/keep-tile.png" _"Build a Keep" 5 () (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "!,Cva,!,Cv*"}
    ) (
        {MODIFY_TERRAIN "Kvr" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/ruin-dwarven/dwarven-keep-tile.png" _"Build a Keep" 5 () (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "!,Cfa,!,Cf*"}
    ) (
        {MODIFY_TERRAIN "Kfr" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    # snowy variants
    {LIUN_TERRAFORM "terrain/castle/winter-dwarven/dwarven-keep-tile.png" _"Build a Keep" 5 () (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "Cfa"}
    ) (
        {MODIFY_TERRAIN "Kfa" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/snowy/keep-tile.png" _"Build a Keep" 5 () (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "Cha"}
    ) (
        {MODIFY_TERRAIN "Kha" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/winter-elven/keep-tile.png" _"Build a Keep" 5 () (
        {LIUN_SHOW_IF ("LIUN_Maiden_Private,LIUN_Marine_Private") "Cva"}
    ) (
        {MODIFY_TERRAIN "Kva" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
#enddef
