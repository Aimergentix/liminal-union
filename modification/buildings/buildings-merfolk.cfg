#textdomain wesnoth-liminal-union

#define LIUN_MERFOLK_UNIVERSITY
_"race^Merfolk"#enddef

# Special water unit, available to all factions after unlocking.

#define LIUN_BUILDINGS_MERFOLK

    # Fill Deep Water
    # Expensive because it is rather a lategame option.
    {LIUN_TERRAFORM "terrain/water/coast-tropical-tile.png" _"Landfill" 10 () (
        {LIUN_SHOW_IF ("LIUN_Merman_Citizen") "Wot"}
    ) (
        [delay]
            time=200
        [/delay]
        [sound]
            name=claws.ogg
        [/sound]
        {MODIFY_TERRAIN "Wwt" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/water/coast-grey-tile.png" _"Landfill" 10 () (
        {LIUN_SHOW_IF ("LIUN_Merman_Citizen") "Wog"}
    ) (
        [delay]
            time=200
        [/delay]
        [sound]
            name=claws.ogg
        [/sound]
        {MODIFY_TERRAIN "Wwg" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/water/coast-tile.png" _"Landfill" 10 () (
        {LIUN_SHOW_IF ("LIUN_Merman_Citizen") "Wo"}
    ) (
        [delay]
            time=200
        [/delay]
        [sound]
            name=claws.ogg
        [/sound]
        {MODIFY_TERRAIN "Ww" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    {LIUN_HARVEST "terrain/water/coast-tile.png" _"Remove Water Lilies" 1 (
        {LIUN_SHOW_IF ("LIUN_Merman_Citizen") "*^Ew*"}
    ) (
        [sound]
            name=dagger-swish.wav
        [/sound]
        {LIUN_MODIFY_TERRAIN_OVERLAY "^" $x1 $y1}
    )}

    # Build Village
    {LIUN_BUILD_VILLAGE "terrain/village/coast-tile.png" _"Build Village" 17 Vm (
        {LIUN_SHOW_IF ("LIUN_Merman_Citizen") "!,Wo*,!,W*"}
    ) (
        {LIUN_REMOVE_IMAGE_OF_DESTROYED_CASTLE}
        {LIUN_BUILD_SOUND_1}
    )}
    {LIUN_BUILD_VILLAGE "terrain/village/swamp-merfolk-tile.png" _"Build Village" 17 Vm (
        {LIUN_SHOW_IF ("LIUN_Merman_Citizen") "!,Sm,!,S*"}
    ) (
        {LIUN_REMOVE_IMAGE_OF_DESTROYED_CASTLE}
        {LIUN_BUILD_SOUND_1}
    )}

    # Build University
    {LIUN_TERRAFORM "terrain/village/swamp-merfolk-tile.png" (_"Establish University" + " (" + {LIUN_MERFOLK_UNIVERSITY} + ")") 14 () (
        {LIUN_SHOW_IF ("LIUN_Merman_Citizen") "!,Sm^V*,*^Vhc*,!,*^Vm,S*^V*"}
    ) (
        {MODIFY_TERRAIN "Sm^Vm" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    # po: special case that there is Sm terrain on the map
    {LIUN_BUILD_VILLAGE "terrain/village/swamp-merfolk-tile.png" (_"Build University" + " (" + {LIUN_MERFOLK_UNIVERSITY} + ")") 31 Vm (
        {LIUN_SHOW_IF ("LIUN_Merman_Citizen") "Sm"}
    ) (
        {LIUN_BUILD_SOUND_2}
    )}

    # Land villages next to water
    {LIUN_BUILD_VILLAGE "terrain/sand/beach.png~BLIT(terrain/village/coast-tile.png)" _"Build Village" 17 Vm (
        {LIUN_SHOW_IF_ADJACENT ("LIUN_Merman_Citizen") "G*,G*^Efm,D*,Aa" {LIUN_WATER_TERRAIN}}
    ) (
        {LIUN_BUILD_SOUND_2}
    )}

    # ------------------------------------------------
    # CASTLE

    {LIUN_TERRAFORM "terrain/castle/aquatic-camp/tile.png" _"Build Castle" 5 () (
        {LIUN_SHOW_IF ("LIUN_Merman_Citizen") "!,Wwf*,Wo*,!,W*"}
    ) (
        {LIUN_REMOVE_IMAGE_OF_DESTROYED_CASTLE}
        {MODIFY_TERRAIN "Cme" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # --------------------------------------
    # KEEP

    {LIUN_TERRAFORM "terrain/castle/aquatic-camp/keep-tile.png" _"Build a Keep" 5 () (
        {LIUN_SHOW_IF ("LIUN_Merman_Citizen") "!,Cud,!,C*"}
    ) (
        {MODIFY_TERRAIN "Kme" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
#enddef
