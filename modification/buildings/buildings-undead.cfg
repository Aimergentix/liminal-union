#textdomain wesnoth-liminal-union

#define LIUN_BUILDINGS_UNDEAD
    # Walking Corpse builds normal village (like humans, also defined there),
    # so that not everything looks ruined, only the Soulless creates the ruined variant.
    {LIUN_BUILD_VILLAGE "terrain/village/human-cottage-ruin-tile.png" _"Build Village" 15 Vhr (
        {LIUN_SHOW_IF ("Soulless") "G*,G*^Efm"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}
    {LIUN_BUILD_VILLAGE "terrain/village/snow-tile.png" _"Build Village" 15 Vha (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "Aa"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}
    {LIUN_BUILD_VILLAGE "terrain/village/tropical-tile.png" _"Build Village" 15 Vht (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "D*"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}
    {LIUN_BUILD_VILLAGE "terrain/village/swampwater-tile.png" _"Build Village" 18 Vhs (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "S*"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}
    {LIUN_TERRAFORM "terrain/village/human-tile.png" _"Standardize Village" 3 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "!,Sm^Vm,!,*^Vhs,*^Vm"}
    ) (
        {MODIFY_TERRAIN "Gg^Vh" $x1 $y1}
        {LIUN_BUILD_SOUND_1}
    )}
    # ------------------------------------------------
    # CASTLES
    {LIUN_TERRAFORM "terrain/castle/castle-tile.png" _"Build Castle" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "G*,G*^Efm"}
    ) (
        {MODIFY_TERRAIN "Ch" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/encampment-ruin/regular-tile.png" _"Build Castle" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "D*"}
    ) (
        {MODIFY_TERRAIN "Cer" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/snowy/castle-tile.png" _"Build Castle" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "Aa"}
    ) (
        {MODIFY_TERRAIN "Cea" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # --------------------------------------
    # KEEPS

    {LIUN_TERRAFORM "terrain/castle/keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "Ch"}
    ) (
        {MODIFY_TERRAIN "Kh" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/ruined-keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "!,Ch,Cha,Coa,Cv*,Cf*,Ce*,Cud,!,C*"}
    ) (
        {MODIFY_TERRAIN "Khr" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/elven-ruin/keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "!,Cva,!,Cv*"}
    ) (
        {MODIFY_TERRAIN "Kvr" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/ruin-dwarven/dwarven-keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "!,Cfa,!,Cf*"}
    ) (
        {MODIFY_TERRAIN "Kfr" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/encampment-ruin/regular-keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "!,Cea,!,Ce*"}
    ) (
        {MODIFY_TERRAIN "Ker" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/winter-dwarven/dwarven-keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "Cfa"}
    ) (
        {MODIFY_TERRAIN "Kfa" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/snowy/keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "Cha"}
    ) (
        {MODIFY_TERRAIN "Kha" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/winter-elven/keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "Cva"}
    ) (
        {MODIFY_TERRAIN "Kva" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/winter-orcish/keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "Coa"}
    ) (
        {MODIFY_TERRAIN "Koa" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/encampment/snow-keep-tile.png" _"Build a Keep" 6 () (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "Cea"}
    ) (
        {MODIFY_TERRAIN "Kea" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # ------------------------------------------------
    # UNIQUE TERRAIN CHANGES

    # Mushrooms
    {LIUN_TERRAFORM "terrain/forest/mushrooms-tile.png" _"Plant Mushrooms" 1 entangle.wav (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "Uu*,Uh*,T*"}
    ) (
        {LIUN_REMOVE_IMAGE_OF_BURNED_DOWN_VILLAGE}
        {LIUN_MODIFY_TERRAIN_OVERLAY "^Tf" $x1 $y1}
    )}
    {LIUN_TERRAFORM "terrain/forest/mushrooms-beam-tile.png" _"Plant Mushrooms" 1 entangle.wav (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "G*^Ii,Rb^Ii,Uu*^Ii,Uh*^Ii,T*^Ii"}
    ) (
        {LIUN_MODIFY_TERRAIN_OVERLAY "^Tfi" $x1 $y1}
    )}

    {LIUN_TERRAFORM "terrain/swamp/water-tile.png" _"Putrefy the Land" 3 water-blast.wav (
        {LIUN_SHOW_IF_ADJACENT ("Walking Corpse,Soulless,LIUN_Drake_Brave,LIUN_Saurian_Brave") "G*,G*^Efm,D*,Aa" "{LIUN_WATER_TERRAIN}"}
    ) (
        {MODIFY_TERRAIN "Ss" $x1 $y1}
    )}
    {LIUN_TERRAFORM "terrain/swamp/water-tile.png" _"Corrupt the Ford" 1 water-blast.wav (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless,LIUN_Drake_Brave,LIUN_Saurian_Brave") "Wwf"}
    ) (
        {MODIFY_TERRAIN "Ss" $x1 $y1}
    )}
    {LIUN_TERRAFORM "terrain/water/coast-tile.png" _"Flood the Swamp" 1 water-blast.wav (
        {LIUN_SHOW_IF ("Walking Corpse,Soulless") "S*"}
    ) (
        {MODIFY_TERRAIN "Ww" $x1 $y1}
    )}
#enddef
