#textdomain wesnoth-liminal-union

# Configured to work for level 0 units in SP/MP.

#define LIUN_SHOW_IF_LEVEL_0 TERRAINLIST
    [show_if]
        [have_unit]
            side=$side_number
            x,y=$x1,$y1
            level=0
            [filter_location]
                terrain={TERRAINLIST}
            [/filter_location]
        [/have_unit]
    [/show_if]
#enddef

#define LIUN_WORKER_OPTIONS_SP
    [set_menu_item]
        id=LIUN_get_to_work_sp
        description= _ "Get to Work!"
        [show_if]
            [have_unit]
                side=$side_number
                x,y=$x1,$y1
                level=0
                [not]
                    status=worked_this_turn
                [/not]
            [/have_unit]
        [/show_if]
        [command]
            [store_gold]
                side=$side_number
                variable=gold
            [/store_gold]

            [store_unit]
                [filter]
                    x=$x1
                    y=$y1
                [/filter]
                variable=unit
            [/store_unit]

            [while]
                [true][/true]
                [do]
# wmlindent: start ignoring
            [message]
                speaker=unit
                message= _ "What shall I do?"

[option]
label= _ "Nothing"
    [command]
#ifver WESNOTH_VERSION < 1.18.0
        [allow_undo][/allow_undo]
#endif
#ifver WESNOTH_VERSION >= 1.19.2
        [allow_undo][/allow_undo]
#endif
        [break][/break]
    [/command]
[/option]

# ---------------------------------------------- 🟑 -------
# BUILDINGS
    # VILLAGE
    {LIUN_BUILD_VILLAGE "terrain/village/human-tile.png" _"Build Settlement" 48 Vda (
        {LIUN_SHOW_IF_LEVEL_0 "G*,G*^Efm,G*^Es,G*^Em,G*^Emf,G*^Edp*,G*^Ecf,G*^Eb*,G*^Eff,G*^Eq*,G*^Esd,G*^Ewsh,G*^Ed*,G*^Tf,G*^Tb,G*^Qhh"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}

    # CASTLE
    {LIUN_TERRAFORM "terrain/castle/encampment/regular-tile.png" _"Build Encampment" 22 () (
        {LIUN_SHOW_IF_LEVEL_0 "G*,G*^Efm,G*^Es,G*^Em,G*^Emf,G*^Edp*,G*^Ecf,G*^Eb*,G*^Eff,G*^Eq*,G*^Esd,G*^Ewsh,G*^Ed*,G*^Tf,G*^Tb,G*^Qhh,D*,D*^Edp*,D*^Esd"}
    ) (
        {MODIFY_TERRAIN "Ce" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/encampment/snow-tile.png" _"Build Encampment" 25 () (
        {LIUN_SHOW_IF_LEVEL_0 "Aa"}
    ) (
        {MODIFY_TERRAIN "Cea" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # KEEP
    {LIUN_TERRAFORM "terrain/castle/encampment/regular-keep-tile.png" _"Build a Keep" 28 () (
        {LIUN_SHOW_IF_LEVEL_0 "!,Cha,Coa,Cea,Cva,Cfa,Cv*,Cf*,Cud,Ch,Chr,Chw,Chs,Cer,!,C*"}
    ) (
        {MODIFY_TERRAIN "Ke" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}
    {LIUN_TERRAFORM "terrain/castle/encampment/snow-keep-tile.png" _"Build a Keep" 32 () (
        {LIUN_SHOW_IF_LEVEL_0 "Coa,Cea"}
    ) (
        {MODIFY_TERRAIN "Kea" $x1 $y1}
        {LIUN_BUILD_SOUND_2}
    )}

    # HILLS
    {LIUN_BUILD_VILLAGE "terrain/village/human-hills-tile.png" _"Build Mine" 38 Vhh (
        {LIUN_SHOW_IF_LEVEL_0 "H*"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}

    # MOUNTAINS
    {LIUN_BUILD_VILLAGE "terrain/village/human-mountain-tile.png" _"Build Mine" 42 Vhh (
        {LIUN_SHOW_IF_LEVEL_0 "M*"}
    ) (
        {LIUN_BUILD_SOUND_1}
    )}

