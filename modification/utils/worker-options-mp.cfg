#textdomain wesnoth-liminal-union

#define LIUN_WORKER_OPTIONS TYPES
    [set_menu_item]
        id=LIUN_get_to_work
        description= _ "Get to Work!"
        [default_hotkey]
            key=1
        [/default_hotkey]
        [show_if]
            [have_unit]
                side=$side_number
                x,y=$x1,$y1
                type={TYPES}",LIUN_Merman_Citizen"
                [not]
                    status=worked_this_turn
                [/not]
            [/have_unit]
        [/show_if]
        [command]
            [store_gold]
                side=$side_number
                variable=gold
            [/store_gold]

            [store_unit]
                [filter]
                    x=$x1
                    y=$y1
                [/filter]
                variable=unit
            [/store_unit]

            [while]
                [true][/true]
                [do]
                    [message]
                        speaker=unit
                        wait_description= _ "construction"
                        message= _ "What shall I do my liege?"
# wmlindent: start ignoring

[option]
label= _ "Nothing"
    [command]
#ifver WESNOTH_VERSION < 1.18.0
        [allow_undo][/allow_undo]
#endif
#ifver WESNOTH_VERSION >= 1.19.2
        [allow_undo][/allow_undo]
#endif
        [break][/break]
    [/command]
[/option]

# ----------------------------------------------
# FARMLAND

{LIUN_TERRAFORM_FOR_FREE "terrain/grass/green6.png" _"Demolish Farmland" 0 (
    {LIUN_SHOW_IF ({TYPES}) "Re"}
) (
    {MODIFY_TERRAIN Gg $x1 $y1}
    [sound]
        name=dagger-swish.wav
    [/sound]
)}
{LIUN_TERRAFORM_FOR_FREE "terrain/grass/green6.png" _"Convert to Grassland" 0 (
    {LIUN_SHOW_IF ({TYPES}) "Rb"}
) (
    {MODIFY_TERRAIN Gg $x1 $y1}
    [sound]
        name=dagger-swish.wav
    [/sound]
)}

# Plant Farm
{LIUN_TERRAFORM_FOR_FREE "terrain/embellishments/farm-veg-spring-icon.png" _"Plant Farm" 0 (
    {LIUN_SHOW_IF ({TYPES}) "G*,G*^Efm"}
) (
    {MODIFY_TERRAIN Re $x1 $y1}
    [sound]
        name=entangle.wav
    [/sound]
)}

