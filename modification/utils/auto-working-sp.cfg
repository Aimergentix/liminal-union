#textdomain wesnoth-liminal-union

# ------------------------------------------------------
# Automatic Farming (SP / Level 0)
# ------------------------------------------------------

#define LIUN_AUTO_FARMING_SP
    [event]
        id=LIUN_event_auto_farming_sp
        name=side turn
        first_time_only=no

        [store_unit]
            [filter]
                level=0
                side=$side_number
                [filter_location]
                    terrain=Re^Gvs
                [/filter_location]
            [/filter]
            variable=harvesters
        [/store_unit]

        [store_unit]
            [filter]
                level=0
                side=$side_number
                [filter_location]
                    terrain=Re
                [/filter_location]
            [/filter]
            variable=planters
        [/store_unit]

        [foreach]
            array=harvesters
            [do]
                [gold]
                    side=$this_item.side
                    amount=3
                [/gold]

                {MODIFY_TERRAIN "Re" $this_item.x $this_item.y}
                [remove_item]
                    x,y=$this_item.x,$this_item.y
                    image="items/flower4.png"
                [/remove_item]

                {VARIABLE sound yes}

                [scroll_to]
                    x,y=$this_item.x,$this_item.y
                    [filter_side]
                        side=$this_item.side
                    [/filter_side]
                [/scroll_to]

                [unstore_unit]
                    variable=this_item
                    text=3 # wmllint: noconvert
                    red,green,blue=204,204,51
                [/unstore_unit]
            [/do]
        [/foreach]

        [if]
            {VARIABLE_CONDITIONAL sound boolean_equals yes}
            [then]
                [sound]
                    name=gold.ogg
                [/sound]

                [delay]
                    time=200
                [/delay]
            [/then]
        [/if]

        {CLEAR_VARIABLE sound,harvesters}

        [foreach]
            array=planters
            [do]
                {MODIFY_TERRAIN "Re^Gvs" $this_item.x $this_item.y }

                [item]
                    x,y=$this_item.x,$this_item.y
                    image=items/flower4.png
                [/item]

                {VARIABLE sound yes}
            [/do]
        [/foreach]

        [if]
            {VARIABLE_CONDITIONAL sound boolean_equals yes}
            [then]
                [sound]
                    name=entangle.wav
                [/sound]

                [redraw][/redraw]

                [delay]
                    time=200
                [/delay]
            [/then]
        [/if]

        {CLEAR_VARIABLE sound,planters}
    [/event]
#enddef

# ------------------------------------------------------
# Automatic Mining (SP / Level 0)
# ------------------------------------------------------

#define LIUN_AUTO_MINING_SP
    [event]
        id=LIUN_event_auto_mining_sp
        name=side turn
        first_time_only=no

        [store_unit]
            [filter]
                level=0
                side=$side_number
                [filter_location]
                    terrain=H*^Vhh*,M*^Vhh*
                [/filter_location]
            [/filter]
            variable=miners
        [/store_unit]

        [foreach]
            array=miners
            [do]
                [gold]
                    side=$this_item.side
                    amount=4
                [/gold]

                [scroll_to]
                    x,y=$this_item.x,$this_item.y
                    [filter_side]
                        side=$this_item.side
                    [/filter_side]
                [/scroll_to]

                {VARIABLE sound yes}

                [unstore_unit]
                    variable=this_item
                    text=4 # wmllint: noconvert
                    red,green,blue=204,204,51
                [/unstore_unit]
            [/do]
        [/foreach]

        [if]
            {VARIABLE_CONDITIONAL sound boolean_equals yes}
            [then]
                [sound]
                    name=gold.ogg
                [/sound]

                [delay]
                    time=200
                [/delay]
            [/then]
        [/if]

        {CLEAR_VARIABLE sound,miners}
    [/event]
#enddef
