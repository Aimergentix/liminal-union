#textdomain wesnoth-liminal-union

# ------------------------------------------------------
# Automatic Studying
# ------------------------------------------------------

#define LIUN_AUTO_STUDYING TYPES
    [store_unit]
        [filter]
            type_adv_tree={TYPES}
            side=$side_number
            canrecruit=no
            [filter_location]
                terrain={LIUN_UNIVERSITIES}
            [/filter_location]
            [or]
                type_adv_tree="Mermaid Initiate"
                side=$side_number
                canrecruit=no
                [filter_location]
                    terrain="Sm^Vm"
                [/filter_location]
            [/or]
        [/filter]

        variable=researchers
        kill=no
    [/store_unit]

    [foreach]
        array=researchers
        [do]
            {LIUN_ADDING_TO_CURRENT_RESEARCH_FIELD "$($this_item.level + $player_$side_number|.philosophy.bonus?0|)" }

            {VARIABLE sound yes}

            [scroll_to]
                x,y=$this_item.x,$this_item.y
                [filter_side]
                    side=$this_item.side
                [/filter_side]
            [/scroll_to]

            [floating_text]
                x,y=$this_item.x,$this_item.y
                text="<span color='#ffffff'>$($this_item.level + $player_$side_number|.philosophy.bonus?0|)</span>" # wmllint: noconvert
            [/floating_text]
        [/do]
    [/foreach]

    [if]
        {VARIABLE_CONDITIONAL sound boolean_equals yes}
        [then]
            [sound]
                name=magic-holy-miss-3.ogg
            [/sound]

            [delay]
                time=200
            [/delay]
        [/then]
    [/if]

    {CLEAR_VARIABLE sound,researchers}
#enddef

# ------------------------------------------------------
# Automatic Farming
# ------------------------------------------------------

#define LIUN_AUTO_FARMING TYPES
    [store_unit]
        [filter]
            type={TYPES}
            side=$side_number
            [filter_location]
                terrain=*^Gvs
            [/filter_location]
        [/filter]
        variable=harvesters
    [/store_unit]

    [store_unit]
        [filter]
            type={TYPES}
            side=$side_number
            [filter_location]
                terrain=Re
            [/filter_location]
        [/filter]
        variable=planters
    [/store_unit]

    [foreach]
        array=harvesters
        [do]
            [gold]
                side=$side_number
                amount=$player_$side_number|.farming.gold
            [/gold]

            {MODIFY_TERRAIN "Re" $this_item.x $this_item.y}
            [remove_item]
                x,y=$this_item.x,$this_item.y
                image="items/flower4.png"
            [/remove_item]
            [remove_item]
                x,y=$this_item.x,$this_item.y
                image="items/straw-bale1.png"
            [/remove_item]
            [remove_item]
                x,y=$this_item.x,$this_item.y
                image="items/straw-bale2.png"
            [/remove_item]
            [remove_item]
                x,y=$this_item.x,$this_item.y
                image="items/grain-sheaf.png"
            [/remove_item]

            {VARIABLE sound yes}

            [scroll_to]
                x,y=$this_item.x,$this_item.y
                [filter_side]
                    side=$this_item.side
                [/filter_side]
            [/scroll_to]

            [floating_text]
                x,y=$this_item.x,$this_item.y
                text="<span color='#cccc33'>$player_$side_number|.farming.gold</span>" # wmllint: noconvert
            [/floating_text]
        [/do]
    [/foreach]

    [if]
        {VARIABLE_CONDITIONAL sound boolean_equals yes}
        [then]
            [sound]
                name=gold.ogg
            [/sound]

            [delay]
                time=200
            [/delay]
        [/then]
    [/if]

    {CLEAR_VARIABLE sound,harvesters}

    [foreach]
        array=planters
        [do]
            {LIUN_MODIFY_TERRAIN_OVERLAY "^Gvs" $this_item.x $this_item.y }

            [remove_item]
                x,y=$this_item.x,$this_item.y
            [/remove_item]

            {RANDOM "items/straw-bale1.png,items/straw-bale2.png,items/grain-sheaf.png"}
            [item]
                x,y=$this_item.x,$this_item.y
                image=$random
            [/item]

            {VARIABLE sound yes}
        [/do]
    [/foreach]

    [redraw][/redraw]

    [if]
        {VARIABLE_CONDITIONAL sound boolean_equals yes}
        [then]
            [sound]
                name=entangle.wav
            [/sound]

            [delay]
                time=200
            [/delay]
        [/then]
    [/if]

    {CLEAR_VARIABLE sound,planters,random}
#enddef

