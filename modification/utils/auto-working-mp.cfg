# ------------------------------------------------------
# Remove working status from any working units when starting a turn
# ------------------------------------------------------

#define LIUN_AUTO_RELAXING
    [store_unit]
        [filter]
            side=$side_number
            status=worked_this_turn
        [/filter]

        variable=this_side_workers
    [/store_unit]
    [foreach]
        array=this_side_workers
        [do]
            {CLEAR_VARIABLE this_item.status.worked_this_turn}
            [unstore_unit]
                variable=this_item
            [/unstore_unit]
        [/do]
    [/foreach]
    {CLEAR_VARIABLE this_side_workers}
#enddef

# ------------------------------------------------------
# Disable building directly after recruitment or creation via plague.
# ------------------------------------------------------

#define LIUN_AUTO_BREAKFASTING TYPES
    [event]
        id=LIUN_event_breakfast_turn1
        name=turn 1

        [event]
            id=LIUN_event_breakfast_unit_placed
            name=unit placed
            first_time_only=no
            [filter]
                {TYPES}
                [not]
                    status=worked_this_turn
                [/not]
            [/filter]

            [modify_unit]
                [filter]
                    id=$unit.id
                [/filter]
                [status]
                    worked_this_turn=yes
                [/status]
            [/modify_unit]
        [/event]
    [/event]
#enddef
