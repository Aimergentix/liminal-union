#textdomain wesnoth-liminal-union

# https://wiki.wesnoth.org/TerrainCodeTableWML
# Syntactic sugar and terrain/menu helper macros for Liminal Union worker modifications.

#define LIUN_UNIVERSITIES
*^Vhc,*^Vhca,*^Ve,*^Vea#enddef

#define LIUN_WATER_TERRAIN
W*^*,S*^*,Cm*^*,Km*^*,Chw*^*,Chs*^*,*^Do#enddef

#define LIUN_MODIFY_TERRAIN_OVERLAY TERRAIN X_SPAN Y_SPAN
    [terrain]
        terrain={TERRAIN}
        layer=overlay
        x={X_SPAN}
        y={Y_SPAN}
    [/terrain]
#enddef

#define LIUN_MODIFY_BASE_TERRAIN TERRAIN X_SPAN Y_SPAN
    [terrain]
        terrain={TERRAIN}
        layer=base
        x={X_SPAN}
        y={Y_SPAN}
    [/terrain]
#enddef

#define LIUN_COMPLETE_ACTION GOLD_NUMBER
    [set_variable]
        name=unit.status.worked_this_turn
        value=yes
    [/set_variable]
    [set_variable]
        name=unit.moves
        value=0
    [/set_variable]

    [unstore_unit]
        variable=unit
    [/unstore_unit]

    [gold]
        amount={GOLD_NUMBER}
        side=$side_number
    [/gold]
#enddef

#define LIUN_SHOW_IF TYPE TERRAINLIST
    [show_if]
        [have_unit]
            side=$side_number
            x,y=$x1,$y1
            type={TYPE}
            [filter_location]
                terrain={TERRAINLIST}
            [/filter_location]
        [/have_unit]
    [/show_if]
#enddef

#define LIUN_SHOW_IF_UNDEAD_EMPIRE TYPE TERRAINLIST
    [show_if]
        [lua]
            name=worker_options
            code="return string.match(wesnoth.scenario.id or '', 'Empire') ~= nil"
        [/lua]
        [have_unit]
            side=$side_number
            x,y=$x1,$y1
            type={TYPE}
            [filter_location]
                terrain={TERRAINLIST}
            [/filter_location]
        [/have_unit]
    [/show_if]
#enddef

#define LIUN_SHOW_IF_ADJACENT TYPE TERRAINLIST ADJACENT_TERRAIN
    [show_if]
        [have_unit]
            side=$side_number
            x,y=$x1,$y1
            type={TYPE}
            [filter_location]
                terrain={TERRAINLIST}
                [filter_adjacent_location]
                    terrain={ADJACENT_TERRAIN}
                [/filter_adjacent_location]
            [/filter_location]
        [/have_unit]
    [/show_if]
#enddef

#define LIUN_SHOW_IF_PATH_FIELD TYPE
    [show_if]
        [not]
            [lua]
                name=worker_remove_street
                code="return string.match((wesnoth.scenario.era and wesnoth.scenario.era.id) or '', 'LIUN_era') ~= nil"
            [/lua]
        [/not]
        [have_unit]
            side=$side_number
            x,y=$x1,$y1
            type={TYPE}
            [filter_location]
                terrain="!,Re,Rd,Rb,Rrd,!,R*,Ur,Urb"
            [/filter_location]
        [/have_unit]
        [or]
            [have_unit]
                side=$side_number
                x,y=$x1,$y1
                type={TYPE}
                [filter_location]
                    terrain="!,Re,Rd,Rb,Rrd,!,R*,Ur,Urb"
                    [filter_adjacent_location]
                        terrain="!,Re,Rd,Rb,Rrd,!,R*,Ur,Urb,*^B*"
                        count="0-1"
                    [/filter_adjacent_location]
                [/filter_location]
            [/have_unit]
        [/or]
    [/show_if]
#enddef

#define LIUN_TERRAFORM IMAGE LABEL COST SOUND SHOW_IF THEN
    [option]
        label="<span color='green'>" + {LABEL} + "</span>" # wmllint: ignore
        image={IMAGE}
        description="<span size='small'>" + _ "Cost:" + " " + {COST} +
            # po: "g" denotes the unit for Gold. Depending on your language's rules you may want to use a capital letter.
            _ "g" + "</span>"
        {SHOW_IF}
        [command]
            [if]
                [variable]
                    name=gold
                    greater_than_equal_to={COST}
                [/variable]

                [then]
                    {LIUN_COMPLETE_ACTION -{COST}}

                    [sound]
                        name={SOUND}
                    [/sound]

                    {THEN}

                    [break][/break]
                [/then]
            [/if]
        [/command]
    [/option]
#enddef

#define LIUN_TERRAFORM_FOR_FREE IMAGE LABEL GOLD SHOW_IF THEN
    [option]
        label="<span color='green'>" + {LABEL} + "</span>" # wmllint: ignore
        description="<span size='small'>" + _ "No costs" + "</span>"
        image={IMAGE}
        {SHOW_IF}
        [command]
            [modify_unit]
                [filter]
                    id=$unit.id
                [/filter]
                [status]
                    worked_this_turn=yes
                [/status]
                moves=0
            [/modify_unit]

            {THEN}

            [break][/break]
        [/command]
    [/option]
#enddef

#define LIUN_BUILD_VILLAGE IMAGE LABEL COST TERRAIN_OVERLAY SHOW_IF THEN
    {LIUN_TERRAFORM {IMAGE} {LABEL} {COST} () ({SHOW_IF}) (
        {LIUN_MODIFY_TERRAIN_OVERLAY "^{TERRAIN_OVERLAY}" $x1 $y1}
        [capture_village]
            x=$x1
            y=$y1
            side=$side_number
        [/capture_village]
        [redraw][/redraw]
        {THEN}
    )}
#enddef

#define LIUN_HARVEST IMAGE LABEL GOLD SHOW_IF THEN
    [option]
        label="<span color='green'>" + {LABEL} + "</span>" # wmllint: ignore
        description="<span size='small'>" + _ "Earns:" + " " + {GOLD} + _ "g" + "</span>"
        image={IMAGE}
        {SHOW_IF}
        [command]
            {LIUN_COMPLETE_ACTION {GOLD}}

            {THEN}

            [unstore_unit]
                variable=unit
                find_vacant=no
                text={GOLD} # wmllint: ignore
                red,green,blue=204,204,51
            [/unstore_unit]

            [break][/break]
        [/command]
    [/option]
#enddef
