#textdomain wesnoth-liminal-union

# Helper macros for Liminal Union worker mechanics.

#define LIUN_SET_SIDE_RESEARCH KEY PROGRESS TARGET
    [{KEY}]
        progress={PROGRESS}
        target={TARGET}
    [/{KEY}]
#enddef

#define LIUN_SET_SIDE_VARIABLES SIDE
    # Initializes research and economy variables for a side.
    [set_variables]
        name=player_{SIDE}

        [value]
            [farming]
                progress=0
                target=4
                gold=3
            [/farming]

            [mining]
                progress=0
                target=5
                gold=4
            [/mining]

            [warfare]
                progress=0
                target=4
                troop_available=0
            [/warfare]

            [philosophy]
                progress=0
                target=7
                bonus=0
            [/philosophy]

            troops=0

            [research]
                current_target=farming
                target_language_name= _ "agriculture" # wmllint: ignore
            [/research]

            {LIUN_SET_SIDE_RESEARCH leader_option_1 0 4}
            ally_1=no
            ally_2=no
            ally_3=no
            ally_4=no
            ally_5=no

            {LIUN_SET_SIDE_RESEARCH leader_option_2 0 4}
            ally_6=no
            ally_7=no
            ally_8=no

            {LIUN_SET_SIDE_RESEARCH leader_option_3 0 4}
            ally_9=no
            ally_10=no
            ally_11=no
            ally_12=no

            {LIUN_SET_SIDE_RESEARCH leader_option_4 0 4}
            ally_13=no
            ally_14=no
            ally_15=no
            ally_16=no

            {LIUN_SET_SIDE_RESEARCH leader_option_5 0 4}
            ally_17=no
            ally_18=no
            ally_19=no
            ally_20=no
            ally_21=no
            ally_22=no
            ally_23=no

            {LIUN_SET_SIDE_RESEARCH leader_option_6 0 4}
            ally_24=no
            ally_25=no
            ally_26=no
            ally_27=no

            {LIUN_SET_SIDE_RESEARCH leader_option_7 0 3}
            ally_28=no
            ally_29=no
            ally_30=no
            ally_31=no

            {LIUN_SET_SIDE_RESEARCH leader_option_8 0 8}
            ally_32=no
            ally_33=no
            ally_34=no
            ally_35=no

            {LIUN_SET_SIDE_RESEARCH leader_option_9 0 4}

            troop_1=no
            troop_2=no
            troop_3=no
            troop_4=no
            troop_5=no
            troop_6=no
            troop_7=no
        [/value]
    [/set_variables]
#enddef

#define LIUN_ADDING_TO_CURRENT_RESEARCH_FIELD NUMBER
    [switch]
        variable=player_$side_number|.research.current_target
        [case]
            value="farming"

            [set_variable]
                name=player_$side_number|.farming.progress
                add={NUMBER}
            [/set_variable]
        [/case]
        [case]
            value="mining"

            [set_variable]
                name=player_$side_number|.mining.progress
                add={NUMBER}
            [/set_variable]
        [/case]
        [case]
            value="philosophy"

            [set_variable]
                name=player_$side_number|.philosophy.progress
                add={NUMBER}
            [/set_variable]
        [/case]
        [case]
            value="warfare"

            [set_variable]
                name=player_$side_number|.warfare.progress
                add={NUMBER}
            [/set_variable]
        [/case]
    [/switch]
#enddef

#define LIUN_RECORD_GAME_AS_WON
    {VARIABLE won_once yes}
    [set_global_variable]
        namespace=LIUN
        from_local=won_once
        to_global=won_a_LIUN_game
        side=global
        immediate=yes
    [/set_global_variable]
    {CLEAR_VARIABLE won_once}
#enddef

#define LIUN_BUILD_SOUND_1
