#textdomain wesnoth-liminal-union
# wmllint: no translatables

{~add-ons/liminal-union/modification/utils/syntactic-sugar.cfg}
{~add-ons/liminal-union/modification/utils/helper-macros.cfg}
{~add-ons/liminal-union/modification/buildings}
{~add-ons/liminal-union/modification/utils/worker-options-mp.cfg}
{~add-ons/liminal-union/modification/utils/worker-options-sp.cfg}
{~add-ons/liminal-union/modification/utils/auto-working-mp.cfg}
{~add-ons/liminal-union/modification/utils/auto-working-sp.cfg}

[modification]
    id=LIUN_Worker_Mod
    name= _ "Liminal Union ⚒ Level 0 Worker Mod"
    type=hybrid
    require_modification=no
    disallow_modification="LIUN_Faction_Worker_Mod"
    disallow_era="ANLEra"
    disallow_scenario="multiplayer_A_New_Land"
    # wmllint: local spellings SP MP
    description= _ "A universal SP/MP modification that allows level 0 units to build castles, chop trees, and terraform via the in-game context menu."
    [event]
        id=LIUN_event_worker_sp_prestart
        name=prestart
        {LIUN_WORKER_OPTIONS_SP}
    [/event]
    [event]
        id=LIUN_event_worker_sp_side_turn
        name=side turn
        first_time_only=no
        {LIUN_AUTO_RELAXING}
    [/event]
    {LIUN_AUTO_BREAKFASTING level=0}
    {LIUN_AUTO_FARMING_SP}
    {LIUN_AUTO_MINING_SP}
[/modification]

[modification]
    id=LIUN_Faction_Worker_Mod
    name= _ "Liminal Union 🏛 Faction Builders & Research Mod"
    type=hybrid
    require_modification=no
    disallow_modification="LIUN_Worker_Mod"
    disallow_era="ANLEra"
    disallow_scenario="multiplayer_A_New_Land"
    description= _ "Enables faction-specific building, terraforming, farming, mining, herding, fishing, and university research for Liminal Union and nation worker units."
    [event]
        id=LIUN_event_worker_mp_prestart
        name=prestart
        [store_side]
            variable=liun_sides
        [/store_side]
        [foreach]
            array=liun_sides
            [do]
                {LIUN_SET_SIDE_VARIABLES $this_item.side}
            [/do]
        [/foreach]
        {CLEAR_VARIABLE liun_sides}
        {LIUN_WORKER_OPTIONS "Peasant,LIUN_Maiden_Private,LIUN_Marine_Private,LIUN_Drake_Brave,LIUN_Saurian_Brave,LIUN_Dwarvish_Miner,LIUN_Elvish_Citizen,LIUN_Fellah,LIUN_Minion,Goblin Spearman,Goblin Impaler,Goblin Rouser,Walking Corpse,Soulless"}
    [/event]
    [event]
        id=LIUN_event_worker_mp_side_turn
        name=side turn
        first_time_only=no
        {LIUN_AUTO_RELAXING}
        {LIUN_AUTO_STUDYING "Mage,Dark Adept,LIUN_Initiate,LIUN_Dark_Initiate,LIUN_Elvish_Healer,LIUN_Saurian_Elementalist,LIUN_Herbalist,LIUN_Maiden_Ensign,LIUN_Marine_Ensign"}
        {LIUN_AUTO_FARMING "Peasant,LIUN_Maiden_Private,LIUN_Marine_Private,LIUN_Drake_Brave,LIUN_Saurian_Brave,LIUN_Elvish_Citizen,LIUN_Fellah,LIUN_Minion,Goblin Spearman,Walking Corpse"}
        {LIUN_AUTO_MINING "Peasant,LIUN_Maiden_Private,LIUN_Marine_Private,LIUN_Dwarvish_Miner,LIUN_Drake_Brave,LIUN_Fellah,LIUN_Minion,Goblin Spearman,Walking Corpse"}
        {LIUN_AUTO_HERDING "LIUN_Elvish_Citizen,LIUN_Wose_Sapling,LIUN_Wolfling"}
        {LIUN_AUTO_FISHING "LIUN_Merman_Citizen,LIUN_Brawler,LIUN_Dune_Nagaling,LIUN_Naga_Hooligan"}
    [/event]
    [event]
        id=LIUN_event_worker_mp_victory
        name=victory
        {LIUN_RECORD_GAME_AS_WON}
        [store_side]
            variable=liun_sides
        [/store_side]
        [foreach]
            array=liun_sides
            [do]
                {CLEAR_VARIABLE player_$this_item.side}
            [/do]
        [/foreach]
        {CLEAR_VARIABLE liun_sides}
    [/event]
    [event]
        id=LIUN_event_worker_mp_defeat
        name=defeat
        [store_side]
            variable=liun_sides
        [/store_side]
        [foreach]
            array=liun_sides
            [do]
                {CLEAR_VARIABLE player_$this_item.side}
            [/do]
        [/foreach]
        {CLEAR_VARIABLE liun_sides}
    [/event]
    {LIUN_AUTO_BREAKFASTING level=0}
[/modification]
