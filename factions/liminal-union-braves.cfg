#textdomain wesnoth-liminal-union
# cf. factions/*-default.cfg

[multiplayer_side]
    id=LIUN_braves
    # lvl2 leaders with lvl1 recruits
    name= _"Liminal Union 🔰"
    image="factions/liminal-union-default.webp"
    type="LIUN_Maiden_Captain"
    leader="LIUN_Marine_Captain, LIUN_Maiden_Captain"

    random_leader="LIUN_Marine_Captain, LIUN_Maiden_Captain"

    recruit="LIUN_Marine_Cornet, LIUN_Maiden_Cornet, LIUN_Marine_Private, LIUN_Maiden_Private, LIUN_G9_AI, LIUN_Phoinix"

    terrain_liked="Ff, Fa, Ha, Hh, Ds, Gg"
    # is used exclusively by Wesnoth's Random Map Generator (RMG) to determine keep placement.
    # on random maps, attempting to put the keep near the listed terrains.
    description="<img>src='factions/liminal-union-default.webp~BG()' align='middle'</img>

"+_"The <bold>text='Liminal Union: Braves'</bold> era features ♙lvl1 recruits and ♕lvl2 leaders.
"+_"<bold><ref>text='The Liminal Union' dst='..race_maidencommand'</ref></bold> is a disciplined commonwealth fighting under an interlocking military doctrine. Strike at peak power with <bold>text='Three Golden Maxims'</bold>:

1. <bold>text='March in Pairs'</bold>: Keep units adjacent to activate armor alloy traits automatically (Pyrite ranged focus, Kryonite damage Interlock, Arcanite warding). Resonance activates immediately upon stepping into formation.
2. <bold>text='Keep an Officer Close'</bold>: Officers and adjacent allied liminal units gain +10 percentage points of damage during Day or Night. Their alignment remains unchanged.
3. <bold>text='Strike at Twilight'</bold>: Retreat or consolidate during deep day and pitch-black night; attack fiercely at Dawn and Dusk (+25% power).

• <bold>text='Visual & Audio Feedback'</bold>: Color-coded breathing halos (Amber Pyrite, Cyan Kryonite, Purple Arcanite) and floating battle badges display tier status immediately without checking menus.
• <bold>text='Tactical Maneuvers'</bold>: Level 0 troops exert Formation ZOC in pairs; Maidens glide from hills (+1 MP, Skirmisher); G9 Warforms overclock for emergency burst strikes and Stun.
• <bold>text='Field Codex'</bold>: Right-click any allied unit anytime on the map to review the automated Doctrine Codex without pausing the match."
# wmllint: markcheck on
    [ai]
        recruitment_pattern="mixed fighter,fighter,mixed fighter,scout,archer,fighter,archer,fighter"
        # the order in the list is importand and the game-engine ai will try to recruit the first unit in the list first, then the second, and so on.
        # mixed fighter and archer are lvl0 marine/maiden, fighter is lvl1 officer or lvl0 G9, scout is lvl0 phoinix, healer is lvl1 mechatronic. 
        grouping=defensive
        caution=0.45
        [aspect]
            id=leader_value
            value=4.0
        [/aspect]
        [aspect]
            id=village_value
            value=1.4
        [/aspect]
    [/ai]
[/multiplayer_side]
