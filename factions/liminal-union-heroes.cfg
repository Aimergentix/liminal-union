#textdomain wesnoth-liminal-union
# cf. factions/*-aoh.cfg

[multiplayer_side]
    id=LIUN_heroes
    # AoH = lvl3 leaders with lvl1 and lvl2 recruits
    name= _"Liminal Union 🔰"
    image="factions/liminal-union-aoh.webp"
    type="LIUN_Maiden_Colonel"
    leader="LIUN_Marine_Colonel, LIUN_Maiden_Colonel"

    random_leader="LIUN_Marine_Colonel, LIUN_Maiden_Colonel"

    recruit="LIUN_Marine_Captain, LIUN_Maiden_Captain, LIUN_Techtronic, LIUN_Sergeant, LIUN_Hunterkiller, LIUN_G9_NCM, LIUN_Phoinix_Elder"

    terrain_liked="Ff, Fa, Ha, Hh, Ds, Gg"
    # is used exclusively by Wesnoth's Random Map Generator (RMG) to determine keep placement.
    # on random maps, attempting to put the keep near the listed terrains.
    description="<img>src='factions/liminal-union-aoh.webp~BG()' align='middle'</img>

"+_"The <bold>text='Liminal Union: Heroes'</bold> (AoH) era features ♙lvl1 and ♙lvl2 recruits and ♕lvl3 leaders.
"+_"<bold><ref>text='The Liminal Union' dst='..race_maidencommand'</ref></bold> is a disciplined commonwealth fighting under an interlocking military doctrine. Strike at peak power with <bold>text='Three Golden Maxims'</bold>:

1. <bold>text='March in Pairs'</bold>: Keep units adjacent to activate armor alloy traits automatically (Pyrite ranged focus, Kryonite damage Interlock, Arcanite Sunder). Resonance activates immediately upon stepping into formation.
2. <bold>text='Keep an Officer Close'</bold>: Officers and adjacent allied liminal units gain +10 percentage points of damage during Day or Night. Their alignment remains unchanged.
3. <bold>text='Strike at Twilight'</bold>: Attack fiercely at Dawn and Dusk (+25% power). By day and by night your troops fight at normal strength while lawful or chaotic foes are at their peak, so consolidate then.

• <bold>text='Visual & Audio Feedback'</bold>: Color-coded breathing halos (Amber Pyrite, Cyan Kryonite, Purple Arcanite) and floating battle badges display tier status immediately without checking menus.
• <bold>text='Tactical Maneuvers'</bold>: Level 0 troops exert Zone of Control beside an officer; Pyrite troops glide from hills (+1 MP, Skirmisher); G9 Warforms overclock for an extra melee strike whose hits Stun; Mechatronics and Techtronics build warforms, Shieldguards call and rekindle Phoinixes.
• <bold>text='Arms'</bold>: Maidens shoot bodkin points and Pyrite fire; Marines hold the line with khopesh thrust and Kryonite cold; G9 Warforms brawl to slow and strike with Arcanite; Phoinixes strike arcane from afar and close with ember talons.
• <bold>text='Field Codex'</bold>: Right-click any unit anytime on the map, also during the opponent's turn, to review the Doctrine Codex."
    # wmllint: markcheck on

    [ai]
        recruitment_pattern="archer,mixed fighter,healer,fighter,scout,archer,mixed fighter,fighter"
        # 5 doctrinal usage buckets:
        # archer = Maiden troops (Pyrite), mixed fighter = Marine troops (Kryonite),
        # healer = Command Officers (Conductance + First Aid) & Techtronic (Mechanic),
        # fighter = G9 Warforms (Arcanite) & Shieldguard/Weaponguard, scout = Phoinix Messengers.
        # usage=healer does not make Officers healers: the default healer CA selects ability id
        # "healing", so Officers (LIUN_first_aid) fight normally and get no healer positioning.
        # Each total=yes job requests one living non-leader unit per bucket (advanced units count).
        # Recruit choice ignores cost. Engine 1.19.27-29 hands blocker and pattern to recruit_job
        # in swapped order, so blocker=no acts as blocker=yes, pattern=no. If the first purchase of
        # a turn is unaffordable, nothing changed and the RCA loop disables recruiting for the turn;
        # LIUN_recruit_floor (score 179000) then buys the most important affordable open bucket.
        # Keep its floor= in the order of the jobs below. Recheck on engine upgrades.
        grouping=defensive
        caution=0.45
        # Simplified aspects: an [aspect] with a bare value= is ignored by the engine.
        leader_value=4.0
        village_value=1.4
        [aspect]
            id=recruitment_instructions
            [facet]
                [value]
                    [recruit]
                        type=scout
                        number=1
                        total=yes
                        importance=2
                        blocker=no
                    [/recruit]
                    [recruit]
                        type=healer
                        number=1
                        total=yes
                        importance=1
                        blocker=no
                    [/recruit]
                    [recruit]
                        type=fighter
                        number=1
                        total=yes
                        importance=1
                        blocker=no
                    [/recruit]
                    [recruit]
                        type=archer
                        number=1
                        total=yes
                        importance=1
                        blocker=no
                    [/recruit]
                    [recruit]
                        type=mixed fighter
                        number=1
                        total=yes
                        importance=1
                        blocker=no
                    [/recruit]
                    [recruit]
                        importance=0
                    [/recruit]
                [/value]
            [/facet]
        [/aspect]
        [modify_ai]
            action=add
            path=stage[main_loop].candidate_action[]
            [candidate_action]
                id=LIUN_recruit_floor
                engine=lua
                name=LIUN_recruit_floor
                max_score=179000
                location="~add-ons/liminal-union/lua/ai_recruit_floor.lua"
                [args]
                    floor="scout,healer,fighter,archer,mixed fighter"
                    score=179000
                [/args]
            [/candidate_action]
        [/modify_ai]
    [/ai]
[/multiplayer_side]
