#textdomain wesnoth-liminal-union

# wmllint: general spellings golem golems kabbalah kabbalist kabbalists mekubbal mekubbalist mekubbalists
[race]
    id=maidengolem
    male_name= _ "race^Golem"
    female_name= _ "race+female^Golem"
    plural_name= _ "race^Golems"
    description= _ "A G9 Warform is an animated anthropomorphic construct fashioned from inanimate matter — wood, tempered bronze, leather, and sealed clay — by the Union's artificers. Many tales speak of how such a warform is brought to life by golem-script inscribed on parchment set within the frame. G9 Warforms cannot advance to more powerful forms; only recalibration by a skilled artificer extends their service. They wear down with time and must be maintained. When damaged, they may be restored in cities, castles, and keeps, or in the field by a war-artificer."
    num_traits=1
    ignore_global_traits=yes
    {TRAIT_CYBORG}
    markov_chain_size=2
    male_names,female_names= _ "X7 MarkI, X7 MarkII, X3, X1, 08.2, 2.01, 08, 4.0, 13.0, 5.2, 01-I, 01-II, 3-V"
[/race]

[movetype]
    name=golemfoot
    [movement_costs]
        deep_water=2
        shallow_water=1
        reef=1
        swamp_water=2
        flat=1
        sand=1
        forest=1
        hills=1
        mountains=1
        village=1
        castle=1
        cave=1
        frozen=1
        fungus=2
    [/movement_costs]
    [defense]
        deep_water=50
        shallow_water=50
        reef=50
        swamp_water=60
        flat=60
        sand=60
        forest=60
        hills=60
        mountains=60
        village=50
        castle=50
        cave=50
        frozen=50
        fungus=60
    [/defense]
    [resistance]
        blade=90
        pierce=80
        impact=100
        fire=110
        cold=140
        arcane=80
    [/resistance]
[/movetype]

{./golems}
