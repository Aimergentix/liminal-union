#textdomain wesnoth-liminal-union

# wmllint: general spellings liminal_union phoinix phoinixes
[race]
    id=marinephoinix
    male_name= _ "race^Phoinix"
    female_name= _ "race+female^Phoinix"
    plural_name= _ "race^Phoinixes"
    description= _ "A Phoinix is an immortal avian — a living emblem of renewal. It passes through youth, fullness, and consuming flame, burning at last to ash; yet an ember of itself endures and takes form once more to live again."
    undead_variation=falcon
    num_traits=1
    ignore_global_traits=yes
    {TRAIT_IMMORTAL}
    markov_chain_size=2
    male_names,female_names= _ "Avarshina, Avarshin, Avaršine, Avaršina, Chol, Chul, Avorshina, Avorshin, Avorshine, Avarshine"
[/race]

# ##   adapted from core movetype <smallfly>
[movetype]
    name=phoinixfly
    flying=yes
    [movement_costs]
        {FLY_MOVE}
        cave=1
        fungus=1
    [/movement_costs]
    [defense]
        {FLY_DEFENSE 40}
        cave=40
        fungus=40
    [/defense]
    [resistance]
        blade=90        #  It is small and agile
        pierce=90        #  …flies high
        impact=90        #  …and is hard to hit.
        fire=50            #  It is a fire-borne bird
        cold=50         #  …is immortal
        arcane=50        #  …and a mystical being.
    [/resistance]
[/movetype]

{./phoinixes}
