#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Hunterkiller_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🪽⪨ Hunterkiller"
    {SHARED_RACE_CHARACTERISTICS_MAIDEN}
    {LIUN_ALLOY_PYRITE}
    cost=22
    hitpoints=38
    movement=5
    experience=24
    level=2
    advances_to=null
    [attack]
        name=kick
        description=_"Kick"
        icon=attacks/kick-boot.webp
        type=impact
        range=melee
        damage=3
        number=5
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=bow
        description=_"Bow [blunts]"
        icon=attacks/bow-elven.png
        type=impact
        range=ranged
        damage=5
        number=4
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=bow
        description=_"Bow [bodkin]"
        icon=attacks/bow-elven.png
        type=pierce
        range=ranged
        damage=6
        number=4
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=bow
        description=_"Bow [arcanites]"
        icon=attacks/bow-elven-magic.png
        type=arcane
        range=ranged
        damage=4
        number=4
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    halo=halo/troop-ma2.webp
    image="units/halfelven/maiden/hunterkiller.webp"
        profile="portraits/halfelven/maiden.webp"
    description= _ "A Maiden Corps Hunterkiller belongs to the senior infantry reserve of the Maiden Corps. Almost all of them are mothers and grandmothers. They perfect their bowcraft at home — archery being more readily practiced without a partner than spear or blade — and in times of need may be called to serve, or step forward on their own to defend their communities. A Hunterkiller is a disciplined expert in ranged pursuit and encirclement. Those who take them for a minor nuisance seldom underestimate them a second time."
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM "units/halfelven/maiden/hunterkiller.webp" "units/halfelven/maiden/hunterkiller.webp" {SOUND_LIST:HUMAN_FEMALE_HIT}}
    [attack_anim]
        [filter_attack]
            name=kick
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-400
        [frame]
            image="units/halfelven/maiden/hunterkiller.webp:300"
        [/frame]
        {SOUND:HIT_AND_MISS club.ogg {SOUND_LIST:MISS} -200}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=bow
        [/filter_attack]
        start_time=-200
        offset=0
        missile_start_time=-50
        [missile_frame]
            duration=50
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [if]
            hits=yes
            [frame]
                duration=45
                image="units/halfelven/maiden/hunterkiller-bow1.webp"
                sound=bow.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=45
                image="units/halfelven/maiden/hunterkiller-bow1.webp"
                sound=bow-miss.ogg
            [/frame]
        [/else]
        [frame]
            duration=45
            image="units/halfelven/maiden/hunterkiller-bow2.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/hunterkiller-bow3.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/hunterkiller-bow4.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/hunterkiller-bow5.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/hunterkiller-bow6.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/hunterkiller-bow7.webp"
        [/frame]
    [/attack_anim]
    [movement_anim]
        [frame]
            duration=100
            image="units/halfelven/maiden/hunterkiller-jump1.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/hunterkiller-jump2.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/hunterkiller-jump3.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/hunterkiller-jump4.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/hunterkiller-jump5.webp"
        [/frame]
    [/movement_anim]
    [animation]
        apply_to=flying
        [frame]
            duration=100
            image="units/halfelven/maiden/hunterkiller.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/hunterkiller-jump1.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/hunterkiller-jump2.webp"
        [/frame]
    [/animation]
    [abilities]
        {ABILITY_RESONANCE_PYRITE}
    [/abilities]
[/unit_type]
