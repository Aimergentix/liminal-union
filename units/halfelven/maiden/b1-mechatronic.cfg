#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Mechatronic_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🪽⪦ Mechatronic"
    {SHARED_RACE_CHARACTERISTICS_MAIDENMECHANIC}
    cost=17
    recall_cost=17
    hitpoints=26
    movement=5
    experience=12
    level=1
    advances_to=null
    [abilities]
        {ABILITY_RESONANCE_ARCANITE}
    [/abilities]
    [attack]
        name=kick
        description=_"Kick"
        icon=attacks/kick-boot.webp
        type=impact
        range=melee
        damage=3
        number=3
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=bow
        description=_"Bow [bodkin]"
        icon=attacks/bow-elven.png
        type=pierce
        range=ranged
        damage=3
        number=4
        accuracy=0
        parry=0
    [/attack]
    # halo=halo/troop-ma1.webp
    image="units/halfelven/maiden/techtronic.webp"
    profile="portraits/halfelven/maiden-techtronic.webp"
    small_profile="portraits/halfelven/maiden-techtronic-small.webp"
    description= _ "Mechatronics are the junior war-artificers of the Maiden Corps. They carry sealed Curie cores into the field; standing in a village, castle or keep, a Mechatronic quickens an immobile G8 Simulacrum to hold the ground, and she tends the warforms of her squad. A Private who takes this post trades the hunter's arrows for a piercing bow and an artificer's satchel. Proven Mechatronics rise to Techtronic." + {LIUN_STAGE_NOTE}
    # Sprites: reuses the Techtronic images until the Mechatronic has its own.
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM "units/halfelven/maiden/techtronic.webp" "units/halfelven/maiden/techtronic.webp" {SOUND_LIST:HUMAN_FEMALE_HIT}}
    [attack_anim]
        [filter_attack]
            name=kick
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-400
        [frame]
            image="units/halfelven/maiden/techtronic.webp:300"
        [/frame]
        {SOUND:HIT_AND_MISS club.ogg {SOUND_LIST:MISS} -200}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=bow
        [/filter_attack]
        start_time=-200
        offset=0
        missile_start_time=-50
        [missile_frame]
            duration=50
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [if]
            hits=yes
            [frame]
                duration=45
                image="units/halfelven/maiden/techtronic-bow1.webp"
                sound=bow.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=45
                image="units/halfelven/maiden/techtronic-bow1.webp"
                sound=bow-miss.ogg
            [/frame]
        [/else]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow2.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow3.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow4.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow5.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow6.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow7.webp"
        [/frame]
    [/attack_anim]
    [movement_anim]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying1.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying2.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying3.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying4.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying5.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying6.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying7.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying8.webp"
        [/frame]
    [/movement_anim]
    [animation]
        apply_to=flying
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying1.webp"
        [/frame]
    [/animation]
[/unit_type]
