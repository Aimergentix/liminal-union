#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Techtronic_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🪽⪨ Techtronic"
    {SHARED_RACE_CHARACTERISTICS_MAIDENMECHANIC}
    {LIUN_ALLOY_PYRITE}
    cost=25
    hitpoints=38
    movement=5
    experience=24
    level=2
    advances_to=null
    [attack]
        name=kick
        description=_"Kick"
        icon=attacks/kick-boot.webp
        type=impact
        range=melee
        damage=4
        number=4
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=bow
        description=_"Bow"
        icon=attacks/bow-short.webp
        type=pierce
        range=ranged
        damage=4
        number=4
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    halo=halo/troop-ma2.webp
    image="units/halfelven/maiden/techtronic.webp"
        profile="portraits/halfelven/maiden.webp"
    description= _ "Techtronics are trained senior war-artificers of the Maiden Corps. Skilled in Arcanite craft and the binding arts, they construct, maintain, and recalibrate the G9 Warforms under corps command. When called to service, they are most effective in squads alongside G9 golems, a maiden officer, and maiden infantry."
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM "units/halfelven/maiden/techtronic.webp" "units/halfelven/maiden/techtronic.webp" {SOUND_LIST:HUMAN_FEMALE_HIT}}
    [attack_anim]
        [filter_attack]
            name=kick
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-400
        [frame]
            image="units/halfelven/maiden/techtronic.webp:300"
        [/frame]
        {SOUND:HIT_AND_MISS club.ogg {SOUND_LIST:MISS} -200}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=bow
        [/filter_attack]
        start_time=-200
        offset=0
        missile_start_time=-50
        [missile_frame]
            duration=50
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [if]
            hits=yes
            [frame]
                duration=45
                image="units/halfelven/maiden/techtronic-bow1.webp"
                sound=bow.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=45
                image="units/halfelven/maiden/techtronic-bow1.webp"
                sound=bow-miss.ogg
            [/frame]
        [/else]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow2.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow3.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow4.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow5.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow6.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/techtronic-bow7.webp"
        [/frame]
    [/attack_anim]
    [movement_anim]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying1.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying2.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying3.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying4.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying5.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying6.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying7.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying8.webp"
        [/frame]
    [/movement_anim]
    [animation]
        apply_to=flying
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/techtronic-flying1.webp"
        [/frame]
    [/animation]
    [abilities]
        {ABILITY_RESONANCE_PYRITE}
    [/abilities]
[/unit_type]

