        damage=4
        number=2
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=pitchfork
        description=_"Pitchfork [throw]"
        icon=attacks/spear-maiden-bronze.webp
        type=pierce
        range=ranged
        damage=5
        number=1
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=pitchfork
        description=_"Pitchfork [slam]"
        icon=attacks/spear-maiden-bronze.webp
        type=impact
        range=melee
        damage=4
        number=2
        accuracy=0
        parry=0
    [/attack]
    image="units/halfelven/maiden/maiden-private.webp~BLIT(overlays/amla-cu-1.webp)"
    description= _ "CQC commando badge | Qualification for Close Quarters Combat. Unlocks impact melee strike. You can act unseen and unrecognized in urban combat zones."
[/unit_type]
