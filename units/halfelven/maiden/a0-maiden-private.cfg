#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Maiden_Private_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🪽⚬ Private"
    {SHARED_RACE_CHARACTERISTICS_MAIDEN}
    {LIUN_ALLOY_PYRITE}
    cost=10
    recall_cost=12
    hitpoints=21
    movement=5
    experience=13
    level=0
    advances_to=null
    [attack]
        name=pitchfork
        description=_"Pitchfork [thrust]"
        icon=attacks/spear-maiden-bronze.webp
        type=pierce
        range=melee
        damage=4
        number=2
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=pitchfork
        description=_"Pitchfork [throw]"
        icon=attacks/spear-maiden-bronze.webp
        type=pierce
        range=ranged
        damage=3
        number=2
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    [portrait]
       size=400
        side="right"
        mirror="true"
        image="portraits/halfelven/transparent/maiden.webp"
   [/portrait]
   image="units/halfelven/maiden/maiden-private.webp"
       profile="portraits/halfelven/maiden.webp"
   halo=halo/troop-c0.webp
   description= _ "Maiden are the backbone of the halfelven commonwealth. They are mothers, bearing and raising the generations to come. Though not warlike by nature, when the Union calls they have never failed to answer. In times of war there is never a shortage of maiden willing to take their place in the corps, alongside their mothers and grandmothers who proudly served before them. In battle they defend their homes and families with absolute devotion; in peace they strengthen the commonwealth through learning, teaching, care, and disciplined craft."
   die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/halfelven/maiden/maiden-private-defend.webp" "units/halfelven/maiden/maiden-private.webp" {SOUND_LIST:HUMAN_OLD_HIT} }
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="units/halfelven/maiden/maiden-private-idle-[1,2,2,1].webp:[100,200,200,100]"
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=pitchfork
            range=ranged
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/spear-n.webp"
            image_diagonal="projectiles/spear-ne.webp"
        [/missile_frame]
        start_time=-150
        [frame]
            image="units/halfelven/maiden/maiden-private-attack-2.webp:100"
            sound={SOUND_LIST:THROW}
        [/frame]
        {SOUND:HIT spear.ogg -50}
        [frame]
            image="units/halfelven/maiden/maiden-private-ranged.webp:150"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=pitchfork
            range=melee
        [/filter_attack]
        start_time=-250
        [frame]
            image="units/halfelven/maiden/maiden-private.webp:50"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -200}
        [frame]
            image="units/halfelven/maiden/maiden-private-attack-[1,2].webp:[250,100]"
        [/frame]
        [frame]
            image="units/halfelven/maiden/maiden-private.webp:50"
        [/frame]
    [/attack_anim]
    [abilities]
        {ABILITY_RESONANCE_PYRITE}
    [/abilities]
[/unit_type]

# –––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

