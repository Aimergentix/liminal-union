#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Maiden_Private_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🪽⚬ Private"
    {SHARED_RACE_CHARACTERISTICS_MAIDEN}
    {LIUN_ALLOY_PYRITE}
    cost=10
    recall_cost=12
    hitpoints=21
    movement=5
    experience=13
    level=0
    advances_to=null
    [attack]
        name=kick
        description=_"Kick"
        icon=attacks/kick-boot.webp
        type=impact
        range=melee
        damage=2
        number=2
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=bow
        description=_"Bow [blunts]"
        icon=attacks/bow-elven.png
        type=impact
        range=ranged
        damage=2
        number=3
        accuracy=0
        parry=0
    [/attack]
   image="units/halfelven/maiden/maiden-private.webp"
    profile="portraits/halfelven/maiden-private.webp"
    small_profile="portraits/halfelven/maiden-private-small.webp"
   halo=halo/troop-c0.webp
   description= _ "Maiden are the backbone of the halfelven commonwealth. They are mothers, bearing and raising the generations to come. Though not warlike by nature, when the Union calls they have never failed to answer. In times of war there is never a shortage of maiden willing to take their place in the corps, alongside their mothers and grandmothers who proudly served before them. In battle they defend their homes and families with absolute devotion; in peace they strengthen the commonwealth through learning, teaching, care, and disciplined craft."
   die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/halfelven/maiden/maiden-private-defend.webp" "units/halfelven/maiden/maiden-private.webp" {SOUND_LIST:HUMAN_OLD_HIT} }
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="units/halfelven/maiden/maiden-private-idle-[1,2,2,1].webp:[100,200,200,100]"
        [/frame]
    [/idle_anim]
    # Transitional static frames: the old Private sprites still show the former equipment.
    [attack_anim]
        [filter_attack]
            name=kick
        [/filter_attack]
        offset=0.0~0.2,0.2~0.6,0.6~0.2,0.2~0.0
        start_time=-250
        [frame]
            image="units/halfelven/maiden/maiden-private.webp:350"
        [/frame]
        {SOUND:HIT_AND_MISS club.ogg {SOUND_LIST:MISS} -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=bow
        [/filter_attack]
        start_time=-300
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [frame]
            image="units/halfelven/maiden/maiden-private.webp:300"
        [/frame]
        {SOUND:HIT_AND_MISS bow.ogg bow-miss.ogg -150}
    [/attack_anim]
    [abilities]
        {ABILITY_RESONANCE_PYRITE}
    [/abilities]
[/unit_type]

