#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Jaeger_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🪽⪦ Jaeger"    # cf. Poacher
    {SHARED_RACE_CHARACTERISTICS_MAIDEN}
    {LIUN_ALLOY_PYRITE}
    cost=16
    recall_cost=16
    hitpoints=28
    movement=5
    experience=14
    level=1
    advances_to=null
    [attack]
        name=kick
        description=_"Kick"
        icon=attacks/kick-boot.webp
        type=impact
        range=melee
        damage=2
        number=3
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=bow
        description=_"Bow [blunts]"
        icon=attacks/bow-elven.png
        type=impact
        range=ranged
        damage=3
        number=5
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=bow
        description=_"Bow [arcanites]"
        icon=attacks/bow-elven-magic.png
        type=arcane
        range=ranged
        damage=2
        number=5
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    halo=halo/troop-ma1.webp
    image="units/halfelven/maiden/jaeger.webp"
        profile="portraits/halfelven/maiden.webp"
    description= _ "A Maiden Corps Jaeger is part of the ranged infantry reserve of the Maiden Corps, trained to make skilled use of her wingsuit. Many of them are young mothers: raising and teaching the next generation, they naturally keep to archery practice at home rather than in a camp. In times of need they are called to service; otherwise they defend their own communities. They are equipped with the finest Arcanite-composite light armour the corps can provide, for no unit is held more beloved or revered. They operate in squads, harassing enemy infantry with a sustained hail of arrows from their short bows. They avoid individual close combat, preferring always to fight in concert. They have learned hard lessons against drake raids on their homeland, and their Arcanite-cold sling-rounds carry a chill that unsettles even draconic flesh."
    die_sound={SOUND_LIST:ELF_FEMALE_HIT}
    {DEFENSE_ANIM "units/halfelven/maiden/jaeger.webp" "units/halfelven/maiden/jaeger.webp" {SOUND_LIST:HUMAN_FEMALE_HIT}}
    [attack_anim]
        [filter_attack]
            name=kick
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-400
        [frame]
            image="units/halfelven/maiden/jaeger.webp:300"
        [/frame]
        {SOUND:HIT_AND_MISS club.ogg {SOUND_LIST:MISS} -200}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=bow
        [/filter_attack]
        start_time=-200
        offset=0
        missile_start_time=-50
        [missile_frame]
            duration=50
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [if]
            hits=yes
            [frame]
                duration=45
                image="units/halfelven/maiden/jaeger-bow1.webp"
                sound=bow.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=45
                image="units/halfelven/maiden/jaeger-bow1.webp"
                sound=bow-miss.ogg
            [/frame]
        [/else]
        [frame]
            duration=45
            image="units/halfelven/maiden/jaeger-bow2.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/jaeger-bow3.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/jaeger-bow4.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/jaeger-bow5.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/jaeger-bow6.webp"
        [/frame]
        [frame]
            duration=45
            image="units/halfelven/maiden/jaeger-bow7.webp"
        [/frame]
    [/attack_anim]
    [movement_anim]
        [frame]
            duration=100
            image="units/halfelven/maiden/jaeger.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/jaeger.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/jaeger.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/jaeger.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/jaeger-jump1.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/jaeger-jump2.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/jaeger-jump4.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/jaeger-jump5.webp"
        [/frame]
    [/movement_anim]
    [animation]
        apply_to=flying
        [frame]
            duration=100
            image="units/halfelven/maiden/jaeger.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/jaeger.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/jaeger-jump1.webp"
        [/frame]
    [/animation]
    [abilities]
        {ABILITY_RESONANCE_PYRITE}
    [/abilities]
[/unit_type]
# –––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

[unit_type]
    id=LIUN_Jaeger
    [base_unit]
        id=LIUN_Jaeger_Base
    [/base_unit]
    name= _ "🪽⪦ Jaeger (1·0)"
    hitpoints=28
    experience=14
    advances_to=LIUN_Jaeger_1_1
    [+abilities]
        {ABILITY_CONCEALMENT}
        {ABILITY_EXTRA_REPAIR 4}
    [/abilities]
[/unit_type]

[unit_type]
    id=LIUN_Jaeger_1_1
    hide_help=yes
    [base_unit]
        id=LIUN_Jaeger_Base
    [/base_unit]
    name= _ "🪽⪦ Jaeger (1·1)"
    hitpoints=32
    experience=16
    advances_to=LIUN_Hunterkiller,LIUN_Techtronic
    [+abilities]
        {ABILITY_CONCEALMENT}
        {ABILITY_EXTRA_REPAIR 4}
        {ABILITY_SKIRMISHER}
    [/abilities]
    image="units/halfelven/maiden/jaeger.webp~BLIT(overlays/amla-cu-1.webp)"
    description= _ "Command Upgrade | You have intensively trained in skirmish tactics."
[/unit_type]
