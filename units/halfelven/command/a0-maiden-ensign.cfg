#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Maiden_Ensign_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🪽🟃 Ensign"
    {SHARED_RACE_CHARACTERISTICS_MAIDENCADET}
    {LIUN_CONDUCTOR}
    cost=13
    recall_cost=14
    hitpoints=22
    movement=5
    experience=12
    level=0
        zoc=yes
    advances_to=null
    [attack]
        name=spear
        description=_"Lance [pyronite]"
        icon=attacks/spear-maiden-red.webp
        type=fire
        range=melee
        damage=2
        number=5
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=spear
        description=_"Lance [triple tap]"
        icon=attacks/spear-maiden-red.webp
        type=pierce
        range=melee
        damage=5
        number=3
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    [portrait]
       size=400
        side="right"
        mirror="true"
        image="portraits/halfelven/transparent/maiden.webp"
   [/portrait]
   image="units/halfelven/maiden/maiden-ensign.webp"
       profile="portraits/halfelven/maiden.webp"
   halo=halo/leadership-c0.webp
   description= _ "A Maiden Ensign, or confidantë, is a young officer cadet schooled in civic law, battlefield triage, and the arts of alignment conduction. Projecting a steady bio-resonant field, she tempers the daytime and nighttime vulnerabilities of adjacent comrades. Trained as a first responder, she can render first aid to wounded comrades in the field."
   die_sound={SOUND_LIST:HUMAN_DIE}
    [death]
        start_time=0
        [frame]
            duration=150
            image="units/halfelven/maiden/maiden-ensign-die1.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-ensign-die2.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-ensign-die3.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-ensign-die4.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-ensign-die5.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-ensign-die6.webp"
        [/frame]
    [/death]
    {DEFENSE_ANIM "units/halfelven/maiden/maiden-ensign-defend1.webp" "units/halfelven/maiden/maiden-ensign-defend2.webp" {SOUND_LIST:HUMAN_OLD_HIT} }
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="units/halfelven/maiden/maiden-ensign-idle[1,2,2,1].webp:[100,200,200,100]"
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=spear
            range=melee
        [/filter_attack]
        start_time=-400
        [frame]
            duration=150
            image="units/halfelven/maiden/maiden-ensign-attack1.webp"
        [/frame]
        [frame]
            duration=150
            image="units/halfelven/maiden/maiden-ensign-attack2.webp"
        [/frame]
        [frame]
            duration=150
            image="units/halfelven/maiden/maiden-ensign-attack3.webp"
            sound={SOUND_LIST:MISS}
        [/frame]
        [frame]
            duration=150
            image="units/halfelven/maiden/maiden-ensign-attack4.webp"
        [/frame]
    [/attack_anim]
    {CONDUCTANCE_STANDING_ANIM}
    [abilities]
        {ABILITY_CONDUCTOR}
    [/abilities]
[/unit_type]

# ––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

[unit_type]
    id=LIUN_Maiden_Ensign
    [base_unit]
        id=LIUN_Maiden_Ensign_Base
    [/base_unit]
    name= _ "🪽🟃 Ensign (0·0)"
    hitpoints=18
    experience=12
    advances_to=LIUN_Maiden_Ensign_0_1
    [+abilities]
        {ABILITY_FIRSTAID 1}
    [/abilities]
[/unit_type]

[unit_type]
    id=LIUN_Maiden_Ensign_0_1
    hide_help=yes
    [base_unit]
        id=LIUN_Maiden_Ensign_Base
    [/base_unit]
    name= _ "🪽🟃 Ensign (0·1)"
    hitpoints=23    # +3 HP
    experience=15   # +3 XP
    advances_to=LIUN_Maiden_Cornet
    [+abilities]
        {ABILITY_FIRSTAID 1}
    [/abilities]
    image="units/halfelven/maiden/maiden-ensign.webp~BLIT(overlays/amla-cu-1.webp)"
    description= _ "Promotion | Field Aid – Trained in the Halls of Inquiry to read the field with clear judgment, an Ensign provides field triage and assists the unit line."
[/unit_type]
