        {ABILITY_FIRSTAID 2}
    [/abilities]
[/unit_type]

[unit_type]
    id=LIUN_Maiden_Cornet_1_1
    hide_help=yes
    [base_unit]
        id=LIUN_Maiden_Cornet_Base
    [/base_unit]
    name= _ "🪽🟇 Cornet (1·1)"
    hitpoints=36    # +4 HP
    experience=16   # +2 XP
    advances_to=LIUN_Maiden_Captain
    [+abilities]
        {ABILITY_FIRSTAID 2}
    [/abilities]
    [attack]
        name=spear
        description=_"Lance [thrust]"
        icon=attacks/spear-maiden-red.webp
        type=pierce
        range=melee
        damage=6
        number=3
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=spear
        description=_"Lance [pyronite]"
        icon=attacks/spear-maiden-red.webp
        type=fire
        range=melee
        damage=3
        number=5
        accuracy=0
        parry=0
    [/attack]
    image="units/halfelven/maiden/maiden-cornet.webp~BLIT(overlays/amla-cu-2.webp)"
    description= _ "First Aid Badge | Unlocks pyronite flame lance strike. You have passed the field training course on first responder techniques and paramedics."
[/unit_type]
