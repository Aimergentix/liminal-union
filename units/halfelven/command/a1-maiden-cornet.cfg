#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Maiden_Cornet_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🪽🟇 Cornet"
    {SHARED_RACE_CHARACTERISTICS_MAIDENOFFICER}
    {LIUN_CONDUCTOR}
    cost=19
    hitpoints=30
    movement=5
    experience=14
    level=1
    advances_to=null
    [attack]
        name=spear
        description=_"Lance [thrust]"
        icon=attacks/spear-maiden-red.webp
        type=pierce
        range=melee
        damage=6
        number=3
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    image="units/halfelven/maiden/maiden-cornet.webp"
        profile="portraits/halfelven/maiden.webp"
    {LEADING_ANIM "units/halfelven/maiden/maiden-cornet-attack13.webp" "units/halfelven/maiden/maiden-cornet-attack14.webp" -5,-28}
    halo=halo/leadership-ma1.webp
    description= _ "Maiden Cornets form the tactical officer foundation of the Maiden Corps. Equipped with wingsuits, MTAR arcane-hardened lances, and shields, they manoeuvre with exceptional speed and precision. Serving as Conductors, they project a stabilizing field that mitigates alignment penalties for adjacent troops during day and night, turning twilight skirmishers into a resolute all-hours fighting cadre. Trained as first responders, they can render first aid to wounded comrades in the field."
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM "units/halfelven/maiden/maiden-cornet-defend1.webp" "units/halfelven/maiden/maiden-cornet-defend2.webp" {SOUND_LIST:HUMAN_FEMALE_HIT}}
    [attack_anim]
        [filter_attack]
            name=spear
            type=pierce,fire
        [/filter_attack]
        direction=se,ne,sw,nw
        start_time=-200
        [frame]
            image="units/halfelven/maiden/maiden-cornet.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-cornet-attack1.webp"
        [/frame]
        [if]
            hits=yes
            [frame]
                duration=100
                image="units/halfelven/maiden/maiden-cornet-attack2.webp"
                sound=spear.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=100
                image="units/halfelven/maiden/maiden-cornet-attack2.webp"
                sound=spear-miss.ogg
            [/frame]
        [/else]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-cornet-attack3.webp"
        [/frame]
        [frame]
