[unit_type]
    id=LIUN_Maiden_Captain
    [base_unit]
        id=LIUN_Maiden_Captain_Base
    [/base_unit]
    name= _ "🪽🟍 Captain (2·0)"
    hitpoints=38
    experience=24
    advances_to=LIUN_Maiden_Captain_2_1
    [+abilities]
        {ABILITY_FIRSTAID 4}
    [/abilities]
[/unit_type]

[unit_type]
    id=LIUN_Maiden_Captain_2_1
    hide_help=yes
    [base_unit]
        id=LIUN_Maiden_Captain_Base
    [/base_unit]
    name= _ "🪽🟍 Captain (2·1)"
    hitpoints=46    # +6 HP
    experience=28   # +6 XP
    advances_to=LIUN_Maiden_Captain_2_2
    [+abilities]
        {ABILITY_FIRSTAID 4}
    [/abilities]
    image="units/halfelven/maiden/maiden-captain.webp~BLIT(overlays/amla-cu-4.webp)"
    description= _ "Silver Heart Award 🎖️ | For bravery under enemy fire."
[/unit_type]

[unit_type]
    id=LIUN_Maiden_Captain_2_2
    hide_help=yes
    [base_unit]
        id=LIUN_Maiden_Captain_Base
    [/base_unit]
    name= _ "🪽🟍 Captain (2·2)"
    hitpoints=52    # +6 HP
    experience=32   # +6 XP
    advances_to=LIUN_Maiden_Colonel # The final jump to Level 3
    [+abilities]
        {ABILITY_FIRSTAID 4}
    [/abilities]
    image="units/halfelven/maiden/maiden-captain.webp~BLIT(overlays/amla-cu-4.webp)"
    description= _ "Gold Heart Award 🎖️ | For heroic deeds in action."
[/unit_type]
