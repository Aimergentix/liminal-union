#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Maiden_Captain_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🪽🟍 Captain"
    {SHARED_RACE_CHARACTERISTICS_MAIDENOFFICER}
    {LIUN_CONDUCTOR}
    cost=30
    hitpoints=38
    movement=5
    experience=24
    level=2
    advances_to=null
    [attack]
        name=spear
        description=_"Lance [pyronite]"
        icon=attacks/spear-maiden-red.webp
        type=fire
        range=melee
        damage=3
        number=7
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=spear
        description=_"Lance [triple tap]"
        icon=attacks/mtar-spear-end-red.webp
        type=pierce
        range=melee
        damage=10
        number=3
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    halo=halo/leadership-ma2.webp
    image="units/halfelven/maiden/maiden-captain.webp"
        profile="portraits/halfelven/maiden.webp"
    {LEADING_ANIM "units/halfelven/maiden/maiden-captain-attack13.webp" "units/halfelven/maiden/maiden-captain-attack14.webp" -5,-28}
    description= _ "With extensive study in aerial skirmishing and resonance warfare, a Maiden Captain commands the battlefield from above. Serving as an elite Conductor, her aura steadies the daylight and midnight effectiveness of all allied troops within her sphere of influence."
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM "units/halfelven/maiden/maiden-captain-defend1.webp" "units/halfelven/maiden/maiden-captain-defend2.webp" {SOUND_LIST:HUMAN_FEMALE_HIT}}
    [attack_anim]
        [filter_attack]
            name=spear
            type=pierce
        [/filter_attack]
        direction=se,ne,sw,nw
        start_time=-200
        [frame]
            image="units/halfelven/maiden/maiden-captain.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-captain-attack1.webp"
        [/frame]
        [if]
            hits=yes
            [frame]
                duration=100
                image="units/halfelven/maiden/maiden-captain-attack2.webp"
                sound=spear.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=100
                image="units/halfelven/maiden/maiden-captain-attack2.webp"
                sound=spear-miss.ogg
            [/frame]
        [/else]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-captain-attack3.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-captain-attack4.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-captain-attack5.webp"
        [/frame]
        [frame]
            duration=100
