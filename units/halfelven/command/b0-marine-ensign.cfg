#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Marine_Ensign_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🔱 🟃 Ensign"
    {SHARED_RACE_CHARACTERISTICS_MARINECADET}
    {LIUN_CONDUCTOR}
    cost=13
    recall_cost=14
    hitpoints=22
    movement=5
    experience=12
    level=0
        zoc=yes
    advances_to=null
    [attack]
        name=dagger
        description= _ "Sword [kryonite]"
        icon=attacks/sword-short-blue.webp
        type=cold
        range=melee
        damage=3
        number=4
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=dagger
        description= _ "Sword [double tap]"
        icon=attacks/sword-short-blue.webp
        type=pierce
        range=melee
        damage=9
        number=2
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
            image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
            image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    halo=halo/leadership-c0.webp
    image="units/halfelven/marine/marine-ensign.webp"
        profile="portraits/halfelven/marine.webp"
    description= _ "A Marine Ensign is a promising cadet chosen for steady judgment and civic discipline. Entering the officer path as novice Conductors, Ensigns project an initial alignment aura that steadies the fighting rhythm of nearby soldiers during off-peak hours. Though young, their presence on the field anchors the formation."
    die_sound={SOUND_LIST:HUMAN_DIE}
    get_hit_sound={SOUND_LIST:HUMAN_HIT}
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            duration=500
            image="units/halfelven/marine/marine-ensign-idle3.webp"
        [/frame]
        [frame]
            duration=500
            image="units/halfelven/marine/marine-ensign.webp"
        [/frame]
        [frame]
            duration=500
            image="units/halfelven/marine/marine-ensign-idle.webp"
        [/frame]
        [frame]
            duration=250
            image="units/halfelven/marine/marine-ensign-idle1.webp"
        [/frame]
        [frame]
            duration=500
            image="units/halfelven/marine/marine-ensign-idle2.webp"
        [/frame]
        [frame]
            duration=750
            image="units/halfelven/marine/marine-ensign-idle3.webp"
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=dagger
        [/filter_attack]
        start_time=-100
        [frame]
            duration=20
            image="units/halfelven/marine/marine-ensign.webp"
        [/frame]
        [frame]
            duration=30
            image="units/halfelven/marine/marine-ensign-attack-1.webp"
            sound={SOUND_LIST:THROW}
        [/frame]
        [frame]
            duration=25
            image="units/halfelven/marine/marine-ensign-attack-2.webp"
        [/frame]
        [frame]
            duration=25
            image="units/halfelven/marine/marine-ensign-attack-3.webp"
        [/frame]
        [frame]
            duration=25
            image="units/halfelven/marine/marine-ensign-attack-4.webp"
            sound=dagger-swish.wav
        [/frame]
        [if]
            hits=yes
               start_time=25
               [frame]
                duration=75
                image="units/halfelven/marine/marine-ensign-attack-5.webp"
                sound=dagger-swish.wav
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=25
            [frame]
                duration=75
                image="units/halfelven/marine/marine-ensign-attack-5.webp"
            [/frame]
        [/else]
    [/attack_anim]
    {CONDUCTANCE_STANDING_ANIM}
    [abilities]
        {ABILITY_CONDUCTOR}
    [/abilities]
[/unit_type]

# –––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

[unit_type]
    id=LIUN_Marine_Ensign
    [base_unit]
        id=LIUN_Marine_Ensign_Base
    [/base_unit]
    name= _ "🔱 🟃 Ensign (0·0)"
    hitpoints=18
    experience=12
    advances_to=LIUN_Marine_Ensign_0_1
    [+abilities]
        {ABILITY_FIRSTAID 1}
    [/abilities]
[/unit_type]

[unit_type]
    id=LIUN_Marine_Ensign_0_1
    hide_help=yes
    [base_unit]
        id=LIUN_Marine_Ensign_Base
    [/base_unit]
    name= _ "🔱 🟃 Ensign (0·1)"
    hitpoints=23
    experience=15
    advances_to=LIUN_Marine_Cornet
    [+abilities]
        {ABILITY_FIRSTAID 1}
    [/abilities]
    image="units/halfelven/marine/marine-ensign.webp~BLIT(overlays/amla-cu-1.webp)"
    description= _ "Promotion | Field Aid – Trained in the Halls of Inquiry to read the field with clear judgment, an Ensign provides field triage and assists the unit line."
[/unit_type]
