#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Marine_Captain_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🔱 🟍 Captain"
    {SHARED_RACE_CHARACTERISTICS_MARINEOFFICER}
    {LIUN_CONDUCTOR}
    cost=31
    hitpoints=38
    movement=5
    experience=24
    level=2
    advances_to=null
    [attack]
        name=sword
        description= _"Sword [kryonite]"
        icon="attacks/sword-short-blue.webp"
        type=cold
        range=melee
        damage=5
        number=5
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=sword
        description= _"Sword [double tap]"
        icon="attacks/sword-short-blue.webp"
        type=pierce
        range=melee
        damage=15
        number=2
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    halo="halo/leadership-mr2.webp"
    image="units/halfelven/marine/marine-captain.webp"
    profile="portraits/halfelven/marine.webp"
    {LEADING_ANIM "units/halfelven/marine/marine-captain-lead-2.webp" "units/halfelven/marine/marine-captain-lead-1.webp" -5,-28}
    description= _ "With extensive study in tactical operations and resonance warfare, a Marine Captain holds sound battlefield oversight. Serving as a senior Conductor, his presence projects an aura that stabilizes alignment for all nearby troops. A serious officer by merit and oath, he anchors the vanguard with unwavering resolve."
    die_sound={SOUND_LIST:HUMAN_DIE}
    get_hit_sound={SOUND_LIST:HUMAN_HIT}
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/marine-captain-defend.webp" "units/halfelven/marine/marine-captain.webp" {SOUND_LIST:HUMAN_HIT} melee }
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/marine-captain-bow-defend.webp" "units/halfelven/marine/marine-captain.webp" {SOUND_LIST:HUMAN_HIT} ranged }
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            duration=250
            image="units/halfelven/marine/marine-captain-defend.webp"
        [/frame]
        [frame]
            duration=500
            image="units/halfelven/marine/marine-captain-melee1.webp"
        [/frame]
        [frame]
            duration=150
            image="units/halfelven/marine/marine-captain-melee2.webp"
        [/frame]
        [frame]
            duration=175
            image="units/halfelven/marine/marine-captain-melee1.webp"
        [/frame]
        [frame]
            duration=225
            image="units/halfelven/marine/marine-captain-shield.webp"
        [/frame]
        [frame]
            duration=250
            image="units/halfelven/marine/marine-captain-defend.webp"
        [/frame]
        [frame]
            duration=250
            image="units/halfelven/marine/marine-captain-bow-defend.webp"
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        start_time=-150
        [frame]
            duration=50
            image="units/halfelven/marine/marine-captain-melee1.webp"
        [/frame]
        [if]
            hits=yes
            start_time=-100
            [frame]
                duration=200
                image="units/halfelven/marine/marine-captain-melee2.webp"
                sound={SOUND_LIST:SWORD_SWISH}
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-100
            [frame]
                duration=200
                image="units/halfelven/marine/marine-captain-melee2.webp"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
    [/attack_anim]
    {CONDUCTANCE_STANDING_ANIM}
    [abilities]
        {ABILITY_CONDUCTOR}
    [/abilities]
[/unit_type]

# ––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

[unit_type]
    id=LIUN_Marine_Captain
    [base_unit]
        id=LIUN_Marine_Captain_Base
    [/base_unit]
    name= _ "🔱 🟍 Captain (2·0)"
    hitpoints=38
    experience=24
    advances_to=LIUN_Marine_Captain_2_1
    [+abilities]
        {ABILITY_FIRSTAID 4}
    [/abilities]
[/unit_type]

