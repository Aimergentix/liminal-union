#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Maiden_Colonel_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🪽🟔 Colonel"
    {SHARED_RACE_CHARACTERISTICS_MAIDENOFFICER}
    {LIUN_CONDUCTOR}
    cost=52
    hitpoints=60
    movement=5
    experience=36
    level=3
    advances_to=null
    [attack]
        name=spear
        description=_"Lance [pyronite]"
        icon=attacks/spear-maiden-red.webp
        type=fire
        range=melee
        damage=4
        number=7
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=spear
        description=_"Lance [triple tap]"
        icon=attacks/mtar-spear-end-red.webp
        type=pierce
        range=melee
        damage=13
        number=3
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
            image="portraits/halfelven/transparent/maiden.webp"
    [/portrait]
    halo=halo/leadership-ma3.webp
    image="units/halfelven/maiden/maiden-colonel.webp"
        profile="portraits/halfelven/maiden.webp"
    {LEADING_ANIM "units/halfelven/maiden/maiden-colonel-air-attack14.webp" "units/halfelven/maiden/maiden-colonel-air-attack16.webp" -5,-28}
    description= _ "A Maiden Colonel is the most senior field rank of the Maiden Corps. Forged through many campaigns, she exercises excellent strategic judgment, and her overarching Conductance aura steadies the entire army line across every watch."
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM "units/halfelven/maiden/maiden-colonel-defend1.webp" "units/halfelven/maiden/maiden-colonel-defend2.webp" {SOUND_LIST:HUMAN_FEMALE_HIT}}
    [attack_anim]
        [filter_attack]
            name=spear
            type=pierce
        [/filter_attack]
        direction=se,ne,sw,nw
        start_time=-200
        [frame]
            image="units/halfelven/maiden/maiden-colonel.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-colonel-attack1.webp"
        [/frame]
        [if]
            hits=yes
            [frame]
                duration=100
                image="units/halfelven/maiden/maiden-colonel-attack2.webp"
                sound=spear.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=100
                image="units/halfelven/maiden/maiden-colonel-attack2.webp"
                sound=spear-miss.ogg
            [/frame]
        [/else]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-colonel-attack3.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-colonel-attack4.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-colonel-attack5.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/maiden/maiden-colonel-attack6.webp"
        [/frame]
        [frame]
            duration=100
