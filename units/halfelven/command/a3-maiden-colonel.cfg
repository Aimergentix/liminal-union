[unit_type]
    id=LIUN_Maiden_Colonel
    [base_unit]
        id=LIUN_Maiden_Colonel_Base
    [/base_unit]
    name= _ "🪽🟔 Colonel (3·0)"
    {SHARED_RACE_CHARACTERISTICS_MAIDENOFFICER}
    hitpoints=60
    experience=36
    advances_to=LIUN_Maiden_Colonel_3_1
    [+abilities]
        {ABILITY_FIRSTAID 4}
    [/abilities]
[/unit_type]

[unit_type]
    id=LIUN_Maiden_Colonel_3_1
    [base_unit]
        id=LIUN_Maiden_Colonel_Base
