#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Marine_Colonel_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🔱 🟔 Colonel"
    {SHARED_RACE_CHARACTERISTICS_MARINEOFFICER}
    {LIUN_CONDUCTOR}
    cost=56
    hitpoints=60
    movement=5
    experience=36
    level=3
    advances_to=null
    [attack]
        name=sword
        description= _"Sword [kryonite]"
        icon=attacks/sword-short-blue.webp
        type=cold
        range=melee
        damage=6
        number=5
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=sword
        description= _"Sword [double tap]"
        icon=attacks/sword-short-blue.webp
        type=pierce
        range=melee
        damage=20
        number=2
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    halo="halo/leadership-mr3.webp"
    image="units/halfelven/marine/marine-colonel.webp"
    profile="portraits/halfelven/marine.webp"
    {LEADING_ANIM "units/halfelven/marine/marine-colonel-lead-2.webp" "units/halfelven/marine/marine-colonel-lead-1.webp" -5,-28}
    description= _ "A Marine Colonel is the most senior field rank of the Marine Corps — an exemplary master of resonance warfare and a proved anchor of the line. Projecting a powerful Conductance aura, his presence on the field turns ordinary citizen-soldiers into an unshakeable fighting formation."
    die_sound={SOUND_LIST:HUMAN_DIE}
    get_hit_sound={SOUND_LIST:HUMAN_HIT}
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/marine-colonel-defend.webp" "units/halfelven/marine/marine-colonel.webp" {SOUND_LIST:HUMAN_HIT} melee }
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/marine-colonel-bow-defend.webp" "units/halfelven/marine/marine-colonel.webp" {SOUND_LIST:HUMAN_HIT} ranged }
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            duration=250
            image="units/halfelven/marine/marine-colonel-defend.webp"
        [/frame]
        [frame]
            duration=500
            image="units/halfelven/marine/marine-colonel-melee1.webp"
        [/frame]
        [frame]
            duration=150
            image="units/halfelven/marine/marine-colonel-melee2.webp"
        [/frame]
        [frame]
            duration=175
            image="units/halfelven/marine/marine-colonel-melee1.webp"
        [/frame]
        [frame]
            duration=225
            image="units/halfelven/marine/marine-colonel-shield.webp"
        [/frame]
        [frame]
            duration=250
            image="units/halfelven/marine/marine-colonel-defend.webp"
        [/frame]
        [frame]
            duration=250
            image="units/halfelven/marine/marine-colonel-bow-defend.webp"
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        start_time=-150
        [frame]
            duration=50
            image=units/halfelven/marine/marine-colonel-melee1.webp
        [/frame]
        [if]
            hits=yes
            start_time=-100
            [frame]
                duration=200
                image=units/halfelven/marine/marine-colonel-melee2.webp
                sound={SOUND_LIST:SWORD_SWISH}
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-100
            [frame]
                duration=200
                image=units/halfelven/marine/marine-colonel-melee2.webp
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
    [/attack_anim]
    {CONDUCTANCE_STANDING_ANIM}
    [abilities]
        {ABILITY_CONDUCTOR}
    [/abilities]
[/unit_type]

# –––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

