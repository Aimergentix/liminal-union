#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Marine_Cornet_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🔱 🟇 Cornet"
    {SHARED_RACE_CHARACTERISTICS_MARINEOFFICER}
    {LIUN_CONDUCTOR}
    cost=19
    hitpoints=30
    movement=5
    experience=14
    level=1
    advances_to=null
    [attack]
        name=sword
        description= _"Short sword"
        icon=attacks/sword-short-blue.webp
        type=blade
        range=melee
        damage=6
        number=3
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side=left
        mirror=false
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    [portrait]
        size=400
        side=right
        mirror=true
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    halo="halo/leadership-mr1.webp"
    image=units/halfelven/marine/marine-cornet.webp
    profile=portraits/halfelven/marine.webp
    {LEADING_ANIM units/halfelven/marine/marine-cornet-lead-2.webp units/halfelven/marine/marine-cornet-lead-1.webp -5,-28}
    description= _ "A Marine Cornet is a junior officer equipped with an arcane-hardened MTAR alu-bronze short sword and a shield. Trained as bio-resonant Conductors, Cornets project an alignment-stabilizing field that bolsters adjacent liminal comrades through the heat of the day and darkness of night. Like all officers of the Union's corps, a Marine Cornet leads from the front — shouting 'after me!' when pressing the line rather than issuing orders from safety. Trained as first responders, they can render first aid to wounded comrades in the field."
    die_sound={SOUND_LIST:HUMAN_DIE}
    get_hit_sound={SOUND_LIST:HUMAN_HIT}
    {DEFENSE_ANIM_RANGE units/halfelven/marine/marine-cornet-defend.webp units/halfelven/marine/marine-cornet.webp {SOUND_LIST:HUMAN_HIT} melee }
    {DEFENSE_ANIM_RANGE units/halfelven/marine/marine-cornet-bow-defend.webp units/halfelven/marine/marine-cornet.webp {SOUND_LIST:HUMAN_HIT} ranged }
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            duration=250
            image=units/halfelven/marine/marine-cornet-defend.webp
        [/frame]
        [frame]
            duration=500
            image=units/halfelven/marine/marine-cornet-melee1.webp
        [/frame]
        [frame]
            duration=150
            image=units/halfelven/marine/marine-cornet-melee2.webp
        [/frame]
        [frame]
            duration=175
            image=units/halfelven/marine/marine-cornet-melee1.webp
        [/frame]
        [frame]
            duration=225
            image=units/halfelven/marine/marine-cornet-shield.webp
        [/frame]
        [frame]
            duration=250
            image=units/halfelven/marine/marine-cornet-defend.webp
        [/frame]
        [frame]
            duration=250
            image=units/halfelven/marine/marine-cornet-bow-defend.webp
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        start_time=-150
        [frame]
            duration=50
            image=units/halfelven/marine/marine-cornet-melee1.webp
        [/frame]
        [if]
            hits=yes
            start_time=-100
            [frame]
                duration=200
                image=units/halfelven/marine/marine-cornet-melee2.webp
                sound={SOUND_LIST:SWORD_SWISH}
                halo="projectiles/misfire-spark-1.png:50,projectiles/misfire-spark-2.png:50,projectiles/misfire-spark-3.png:50,projectiles/misfire-spark-4.png:50"
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-100
            [frame]
                duration=200
                image=units/halfelven/marine/marine-cornet-melee2.webp
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
    [/attack_anim]
    {CONDUCTANCE_STANDING_ANIM}
    [abilities]
        {ABILITY_CONDUCTOR}
    [/abilities]
[/unit_type]

# –––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

[unit_type]
    id=LIUN_Marine_Cornet
    [base_unit]
        id=LIUN_Marine_Cornet_Base
    [/base_unit]
    name= _ "🔱 🟇 Cornet (1·0)"
    hitpoints=32
    experience=14
    advances_to=LIUN_Marine_Cornet_1_1
    [+abilities]
        {ABILITY_FIRSTAID 2}
    [/abilities]
[/unit_type]

[unit_type]
    id=LIUN_Marine_Cornet_1_1
    hide_help=yes
    [base_unit]
        id=LIUN_Marine_Cornet_Base
    [/base_unit]
    name= _ "🔱 🟇 Cornet (1·1)"
    hitpoints=36
    experience=16
    advances_to=LIUN_Marine_Captain
    [+abilities]
        {ABILITY_FIRSTAID 2}
    [/abilities]
    [attack]
        name=sword
        description= _"Short sword"
        icon=attacks/sword-short-blue.webp
        type=blade
        range=melee
        damage=6
        number=3
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=sword
        description= _"Sword [kryonite]"
        icon=attacks/sword-short-blue.webp
        type=cold
        range=melee
        damage=4
        number=4
        accuracy=0
        parry=0
    [/attack]
    image="units/halfelven/marine/marine-cornet.webp~BLIT(overlays/amla-cu-2.webp)"
    description= _ "First Aid Badge | Unlocks kryonite cold blade strike. You have passed the field training course on first responder techniques and paramedics."
[/unit_type]
