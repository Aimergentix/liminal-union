#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Sergeant_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🔱 ⪦ Sergeant"
    {SHARED_RACE_CHARACTERISTICS_MARINE}
    {LIUN_ALLOY_KRYONITE}
    cost=16
    hitpoints=28
    movement=5
    experience=14
    level=1
    advances_to=null
    [attack]
        name=sword
        description= _"Khopesh [smash]"
        icon=attacks/khopesh-bronze.webp
        type=impact
        range=melee
        damage=3
        number=2
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=sword
        description= _"Khopesh [double tap]"
        icon=attacks/khopesh-yellow.webp
        type=pierce
        range=melee
        damage=4
        number=2
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=sling
        description= _ "Sling [glandes]"
        icon=attacks/sling-glandes.webp
        type=pierce
        range=ranged
        damage=4
        number=4
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    halo="halo/troop-mr1.webp"
    image="units/halfelven/marine/sergeant.webp"
    profile="portraits/halfelven/marine.webp"
    description= _ "A Marine Sergeant is part of the infantry reserve of the Marine Corps. Many of them are young fathers, raising and teaching the next generation; they naturally keep to combat training at home rather than in a standing camp. In times of need they may be drafted, or step forward on their own to defend their communities. The Sergeant is a swift all-round defender, armed with Arcanite-composite light armour, a hardened alu-bronze sword, and a precision sling. He is trained in both land and naval combat. Against forces unshielded by sorcerous protection — such as human or dunefolk levies — he holds a clear advantage. His Arcanite-fire sling-rounds, however, find less purchase against the scaled hides of draken."
    die_sound={SOUND_LIST:HUMAN_DIE}
    get_hit_sound={SOUND_LIST:HUMAN_HIT}
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/sergeant-defend.webp" "units/halfelven/marine/sergeant.webp" {SOUND_LIST:HUMAN_HIT} melee }
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/sergeant-bow-defend.webp" "units/halfelven/marine/sergeant.webp" {SOUND_LIST:HUMAN_HIT} ranged }
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            duration=250
            image=units/halfelven/marine/sergeant-defend.webp
        [/frame]
        [frame]
            duration=500
            image=units/halfelven/marine/sergeant-melee1.webp
        [/frame]
        [frame]
            duration=100
            image=units/halfelven/marine/sergeant-defend.webp
        [/frame]
        [frame]
            duration=150
            image=units/halfelven/marine/sergeant-ranged1.webp
        [/frame]
        [frame]
            duration=150
            image=units/halfelven/marine/sergeant-ranged2.webp
        [/frame]
        [frame]
            duration=150
            image=units/halfelven/marine/sergeant-ranged3.webp
        [/frame]
        [frame]
            duration=250
            image=units/halfelven/marine/sergeant-defend.webp
        [/frame]
        [frame]
            duration=250
            image=units/halfelven/marine/sergeant-bow-defend.webp
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=sling
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image=projectiles/stone-large.webp
            image_diagonal=projectiles/stone.webp
        [/missile_frame]
        start_time=-500
        [frame]
            duration=125
            image=units/halfelven/marine/sergeant-ranged1.webp
        [/frame]
        [if]
            hits=yes
            start_time=-375
            [frame]
                duration=125
                image=units/halfelven/marine/sergeant-ranged2.webp
                sound=hatchet.wav
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-375
            [frame]
                duration=125
                image=units/halfelven/marine/sergeant-ranged2.webp
                sound=hatchet-miss.wav
            [/frame]
        [/else]
        [frame]
            duration=125
            image=units/halfelven/marine/sergeant-ranged3.webp
        [/frame]
        [frame]
            duration=25
            image=units/halfelven/marine/sergeant-ranged4.webp
        [/frame]
        [frame]
            duration=100
            image=units/halfelven/marine/sergeant-ranged4.webp
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        start_time=-150
        [frame]
            duration=50
            image=units/halfelven/marine/sergeant-melee1.webp
        [/frame]
        [if]
            hits=yes
            start_time=-100
            [frame]
                duration=200
                image=units/halfelven/marine/sergeant-melee2.webp
                sound={SOUND_LIST:SWORD_SWISH}
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-100
            [frame]
                duration=200
                image=units/halfelven/marine/sergeant-melee2.webp
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
    [/attack_anim]
    [abilities]
        {ABILITY_RESONANCE_KRYONITE}
    [/abilities]
[/unit_type]

# ––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

[unit_type]
    id=LIUN_Sergeant
    [base_unit]
        id=LIUN_Sergeant_Base
    [/base_unit]
    name= _ "🔱 ⪦ Sergeant (1·0)"
    hitpoints=28
    experience=14
    advances_to=LIUN_Sergeant_1_1
    [+abilities]
        {ABILITY_AMBUSH}
    [/abilities]
[/unit_type]

[unit_type]
    id=LIUN_Sergeant_1_1
    hide_help=yes
    [base_unit]
        id=LIUN_Sergeant_Base
    [/base_unit]
    name= _ "🔱 ⪦ Sergeant (1·1)"
    hitpoints=32
    experience=16
    advances_to=LIUN_Masterchief,LIUN_Weaponguard,LIUN_Shieldguard
    [+abilities]
        {ABILITY_AMBUSH}
        {ABILITY_DIVERSION}
    [/abilities]
    image="units/halfelven/marine/sergeant.webp~BLIT(overlays/amla-cu-1.webp)"
    description= _ "Diversion Badge | You mastered the diversion tactic in battle encounters."
[/unit_type]
