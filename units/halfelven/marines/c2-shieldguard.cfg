#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Shieldguard_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🔱 ⪨ Shieldguard"
    {SHARED_RACE_CHARACTERISTICS_MARINE}
    usage="fighter"
    cost=33
    hitpoints=38
    movement=5
    experience=24
    level=2
    advances_to=null
    [abilities]
        {ABILITY_RESONANCE_KRYONITE}
    [/abilities]
    [attack]
        name=shieldbash
        description= _ "Shield [kryonite rim]"
        icon=attacks/magen-marine.webp
        type=cold
        range=melee
        damage=6
        number=5
        accuracy=0
        parry=10
    [/attack]
    [attack]
        name=shieldbash
        description= _ "Shield [thrust]"
        icon=attacks/magen-marine.webp
        type=pierce
        range=melee
        damage=6
        number=5
        accuracy=0
        parry=10
    [/attack]
    image="units/halfelven/marine/shieldguard.webp"
    profile="portraits/halfelven/marine.webp"
    # halo="halo/troop-mr2.webp"
    description= _ "Shieldguards are masters of line warfare. They cover every gap and hold every breach. Armed with a tower shield, a Shieldguard turns the tide of battle not through swiftness but through the disciplined art of denial." + {LIUN_STAGE_NOTE}
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/shieldguard-defend.webp" "units/halfelven/marine/shieldguard-melee1.webp" {SOUND_LIST:HUMAN_HIT} melee }
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/shieldguard-bow-defend.webp" "units/halfelven/marine/shieldguard-defend.webp" {SOUND_LIST:HUMAN_HIT} ranged }
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            duration=250
            image="units/halfelven/marine/shieldguard-defend.webp"
        [/frame]
        [frame]
            duration=500
            image="units/halfelven/marine/shieldguard-melee1.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/marine/shieldguard-defend.webp"
        [/frame]
        [frame]
            duration=150
            image="units/halfelven/marine/shieldguard-ranged1.webp"
        [/frame]
    [frame]
            duration=150
            image="units/halfelven/marine/shieldguard-ranged2.webp"
        [/frame]
    [frame]
            duration=150
            image="units/halfelven/marine/shieldguard-ranged3.webp"
        [/frame]
        [frame]
            duration=250
            image="units/halfelven/marine/shieldguard-defend.webp"
        [/frame]
        [frame]
            duration=250
            image="units/halfelven/marine/shieldguard-bow-defend.webp"
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=shieldbash
        [/filter_attack]

        start_time=-200

        [frame]
            image="units/halfelven/marine/shieldguard.webp:100"
        [/frame]
        [if]
            hits=yes
            [frame]
                image="units/halfelven/marine/shieldguard.webp:200"
                sound=mace.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                image="units/halfelven/marine/shieldguard.webp:200"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
    [/attack_anim]
[/unit_type]

# –––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

