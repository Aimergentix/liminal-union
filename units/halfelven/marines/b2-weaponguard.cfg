#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Weaponguard_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🔱 ⪨ Weaponguard"
    {SHARED_RACE_CHARACTERISTICS_MARINE}
    {LIUN_ALLOY_KRYONITE}
    cost=25
    hitpoints=38
    movement=5
    experience=24
    level=2
    advances_to=null
    [attack]
        name=sword
        description= _"Swords [kryonite]"
        icon=attacks/sword-nacahkliy-blue.webp
        type=cold
        range=melee
        damage=6    # 30 total vs 40
        number=5
    [/attack]
    [attack]
        name=sword
        description= _"Swords [pyronite]"
        icon=attacks/sword-nacahkliy-yellow.webp
        type=fire
        range=melee
        damage=6    # 30 total, matching cold
        number=5
    [/attack]
    [attack]
        name=sword
        description= _"Swords [double cut]"
        icon=attacks/sword-nacahkliy-yellow.webp
        type=blade
        range=melee
        damage=8    # 16 total — situational finisher, not main carry
        number=2
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    image="units/halfelven/marine/weaponguard.webp"
    profile="portraits/halfelven/marine.webp"
    halo="halo/troop-mr2.webp"
    description= _ "The Weaponguard wields twin mithril blades. Speed and disciplined skill working in concert, he moves through enemy lines with a reaper's surety — reading every opening, turning movement, momentum, and cover to his advantage. Few who face a Weaponguard in full press survive to take his measure a second time."
    die_sound={SOUND_LIST:HUMAN_DIE}
    get_hit_sound={SOUND_LIST:HUMAN_HIT}
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/weaponguard-defend.webp" "units/halfelven/marine/weaponguard.webp" {SOUND_LIST:HUMAN_HIT} melee }
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/weaponguard-bow-defend.webp" "units/halfelven/marine/weaponguard.webp" {SOUND_LIST:HUMAN_HIT} ranged }
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            duration=250
            image="units/halfelven/marine/weaponguard-defend.webp"
        [/frame]
        [frame]
            duration=500
            image="units/halfelven/marine/weaponguard-melee1.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/marine/weaponguard-defend.webp"
        [/frame]
        [frame]
            duration=200
            image="units/halfelven/marine/weaponguard.webp"
        [/frame]
        [frame]
            duration=150
            image="units/halfelven/marine/weaponguard-defend.webp"
        [/frame]
        [frame]
            duration=250
            image="units/halfelven/marine/weaponguard-bow-defend.webp"
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        start_time=-150
        [frame]
            duration=50
            image="units/halfelven/marine/weaponguard-melee1.webp"
        [/frame]
        [if]
            hits=yes
            start_time=-100
            [frame]
                duration=200
                image="units/halfelven/marine/weaponguard-melee2.webp"
                sound={SOUND_LIST:SWORD_SWISH}
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-100
            [frame]
                duration=200
                image="units/halfelven/marine/weaponguard-melee2.webp"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
    [/attack_anim]
    [abilities]
        {ABILITY_RESONANCE_KRYONITE}
    [/abilities]
[/unit_type]

