#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Masterchief_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🔱 ⪨ Masterchief"
    {SHARED_RACE_CHARACTERISTICS_MARINE}
    {LIUN_ALLOY_KRYONITE}
    cost=26
    hitpoints=40
    movement=5
    experience=24
    level=2
    advances_to=null
    [attack]
        name=sword
        description= _"Khopesh [slash]"
        icon=attacks/khopesh-bronze.webp
        type=impact
        range=melee
        damage=3
        number=4
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=sword
        description= _"Khopesh [stab]"
        icon=attacks/khopesh-yellow.webp
        type=pierce
        range=melee
        damage=4
        number=4
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=sling
        description= _"Sling [bullets]"
        icon=attacks/sling.webp
        type=impact
        range=ranged
        damage=3
        number=6
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=sling
        description= _ "Sling [glandes]"
        icon=attacks/sling-glandes.webp
        type=pierce
        range=ranged
        damage=4
        number=6
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    halo="halo/troop-mr2.webp"
    image="units/halfelven/marine/masterchief.webp"
    profile="portraits/halfelven/marine.webp"
    description= _ "A Masterchief is a trained field commander serving in heavy active duty. He is the swiftest and most capable of the Marine Corps field officers — quick enough to press every advantage and steady enough to hold when others waver. Armed with leather armour, a hardened alu-bronze sword, and a precision sling, he is a proved keeper of the line, and a cornerstone of one of the most disciplined corps in the southern lands."
    die_sound={SOUND_LIST:HUMAN_DIE}
    get_hit_sound={SOUND_LIST:HUMAN_HIT}
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/masterchief-defend.webp" "units/halfelven/marine/masterchief.webp" {SOUND_LIST:HUMAN_HIT} melee }
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/masterchief-bow-defend.webp" "units/halfelven/marine/masterchief.webp" {SOUND_LIST:HUMAN_HIT} ranged }
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            duration=250
            image="units/halfelven/marine/masterchief-defend.webp"
        [/frame]
        [frame]
            duration=500
            image="units/halfelven/marine/masterchief-melee1.webp"
        [/frame]
        [frame]
            duration=100
            image="units/halfelven/marine/masterchief-defend.webp"
        [/frame]
        [frame]
            duration=150
            image="units/halfelven/marine/masterchief-ranged1.webp"
        [/frame]
    [frame]
            duration=150
            image="units/halfelven/marine/masterchief-ranged2.webp"
        [/frame]
    [frame]
            duration=150
            image="units/halfelven/marine/masterchief-ranged3.webp"
        [/frame]
        [frame]
            duration=250
            image="units/halfelven/marine/masterchief-defend.webp"
        [/frame]
        [frame]
            duration=250
            image="units/halfelven/marine/masterchief-bow-defend.webp"
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=sling
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image=projectiles/stone-large.webp
            image_diagonal=projectiles/stone.webp
        [/missile_frame]
        start_time=-500
        [frame]
            duration=125
            image=units/halfelven/marine/masterchief-ranged1.webp
        [/frame]
        [if]
            hits=yes
            start_time=-375
            [frame]
                duration=125
                image=units/halfelven/marine/masterchief-ranged2.webp
                sound=hatchet.wav
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-375
            [frame]
                duration=125
                image=units/halfelven/marine/masterchief-ranged2.webp
                sound=hatchet-miss.wav
            [/frame]
        [/else]
        [frame]
            duration=125
            image=units/halfelven/marine/masterchief-ranged3.webp
        [/frame]
        [frame]
            duration=25
            image=units/halfelven/marine/masterchief-ranged4.webp
        [/frame]
        [frame]
            duration=100
            image=units/halfelven/marine/masterchief-ranged4.webp
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        start_time=-150
        [frame]
            duration=50
            image=units/halfelven/marine/masterchief-melee1.webp
        [/frame]
        [if]
            hits=yes
            start_time=-100
            [frame]
                duration=200
                image=units/halfelven/marine/masterchief-melee2.webp
                sound={SOUND_LIST:SWORD_SWISH}
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-100
            [frame]
                duration=200
                image=units/halfelven/marine/masterchief-melee2.webp
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
    [/attack_anim]
    [abilities]
        {ABILITY_RESONANCE_KRYONITE}
    [/abilities]
[/unit_type]

