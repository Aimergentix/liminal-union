#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Marine_Private_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🔱 ⚬ Private"
    {SHARED_RACE_CHARACTERISTICS_MARINE}
    {LIUN_ALLOY_KRYONITE}
    cost=11
    recall_cost=13
    hitpoints=21
    movement=5
    experience=15
    level=0
    advances_to=null
    [attack]
        name=sickle
        description= _ "Sickle [double tap]"
        icon=attacks/sickle-bronze.webp
        type=pierce
        range=melee
        damage=4
        number=2
        accuracy=0
        parry=0
    [/attack]
    [attack]
        name=sling
        description= _ "Sling [bullets]"
        icon=attacks/sling.webp
        type=impact
        range=ranged
        damage=3
        number=3
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
            image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
            image="portraits/halfelven/transparent/marine.webp"
    [/portrait]
    halo=halo/troop-c0.webp
    image="units/halfelven/marine/marine-private.webp"
        profile="portraits/halfelven/marine.webp"
    description= _ "Liminal Union Sabras are the backbone of the commonwealth, and in times of need the defenders of last resort. From childhood these free young men are trained to master the sling with precision. While not warlike by nature, they prove formidable when roused. There is never a shortage of Union youth willing to serve in the corps. They defend their homes and families with complete devotion, and in times of peace strengthen the commonwealth through hard work, lawful inquiry, arts, and disciplined craft."
    die_sound={SOUND_LIST:HUMAN_DIE}
    get_hit_sound={SOUND_LIST:HUMAN_HIT}
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/marine-private-defend-1.webp" "units/halfelven/marine/marine-private-defend-2.webp" {SOUND_LIST:HUMAN_HIT} melee }
    {DEFENSE_ANIM_RANGE "units/halfelven/marine/marine-private-defend-1.webp" "units/halfelven/marine/marine-private-defend-2.webp" {SOUND_LIST:HUMAN_HIT} ranged }

    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            duration=500
            image="units/halfelven/marine/marine-private-idle3.webp"
        [/frame]
        [frame]
            duration=500
            image="units/halfelven/marine/marine-private.webp"
        [/frame]
        [frame]
            duration=500
            image="units/halfelven/marine/marine-private-idle.webp"
        [/frame]
        [frame]
            duration=250
            image="units/halfelven/marine/marine-private-idle1.webp"
        [/frame]
        [frame]
            duration=500
            image="units/halfelven/marine/marine-private-idle2.webp"
        [/frame]
        [frame]
            duration=750
            image="units/halfelven/marine/marine-private-idle3.webp"
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=sickle
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/halfelven/marine/marine-private.webp:100"
        [/frame]
        [if]
            hits=yes
            [frame]
                image="units/halfelven/marine/marine-private-attack-6.webp:200"
                sound=mace.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                image="units/halfelven/marine/marine-private-attack-6.webp:200"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=sling
        [/filter_attack]
        missile_start_time=0
        [missile_frame]
            duration=100
            image="projectiles/stone-large.webp"
            image_diagonal="projectiles/stone-large.webp"
        [/missile_frame]
        start_time=-250
        [frame]
            duration=200
            image="units/halfelven/marine/marine-private-ranged-1.webp"
            sound={SOUND_LIST:THROW}
        [/frame]
        [if]
            hits=yes
            start_time=-50
            [frame]
                duration=60
                image="units/halfelven/marine/marine-private-ranged-2.webp"
            [/frame]
            [frame]
                duration=90
                image="units/halfelven/marine/marine-private.webp"
                sound=sling.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-50
            [frame]
                duration=60
                image="units/halfelven/marine/marine-private-ranged-2.webp"
            [/frame]
            [frame]
                duration=90
                image="units/halfelven/marine/marine-private.webp"
                sound=sling-miss.ogg
            [/frame]
        [/else]
    [/attack_anim]
    [abilities]
        {ABILITY_RESONANCE_KRYONITE}
    [/abilities]
[/unit_type]

