#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_G9_AI_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🤖 🟕 G9 AI"
    {SHARED_RACE_CHARACTERISTICS_GOLEM}
    {LIUN_ALLOY_ARCANITE}
    cost=17
    recall_cost=18
    hitpoints=34
    movement=5
    experience=12
    level=0
    zoc=yes
    advances_to=null
    [attack]
        name=fist
        description=_ "Fist [brawl]"
        icon=attacks/g9-red-fist.webp
        type=impact
        range=melee
        damage=3
        number=4
        accuracy=5
        parry=5
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack]
        name=fist
        description=_ "Fist [double tap]"
        icon=attacks/g9-yellow-fist.webp
        type=pierce
        range=melee
        damage=9
        number=2
        accuracy=5
        parry=5
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/golem.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="portraits/golem.webp"
    [/portrait]
    image="units/golems/g9-ai.webp"
    profile="portraits/golem.webp"
    halo=halo/troop-ma0.webp
    description=_ "G9 Warforms are Quickbound Golems bearing a bound intellect. Their frames are animated by golem-script set on small strips of parchment within the construct. Artificers of the corps carefully assess each awakened intellect: those of the highest order are elevated to the full Neural Curie Mainframe series. Though not swift, they are durable — able to hold a line, secure a retreat, or press through enemy ranks. They wear down with time and must be regularly maintained and inspected by skilled artificers."
    die_sound=net.wav
    {DEFENSE_ANIM_RANGE "units/golems/g9-ai-defend.webp" "units/golems/g9-ai.webp" "miss-2.ogg" melee }
    {DEFENSE_ANIM_RANGE "units/golems/g9-ai-defend.webp" "units/golems/g9-ai.webp" "miss-2.ogg" ranged }
    [death]
        start_time=0
        [frame]
            duration=50
            image=units/golems/g9-ai.webp
        [/frame]
        [frame]
            duration=100
            image=units/golems/g9-ai-die1.webp
        [/frame]
        [frame]
            duration=100
            image=units/golems/g9-ai-die2.webp
            sound=drake-die.ogg
        [/frame]
        [frame]
            duration=100
            image=units/golems/g9-ai-die3.webp
        [/frame]
    [/death]
    [attack_anim]
        [filter_attack]
            name=fist
        [/filter_attack]
        [if]
            hits=yes
            start_time=-150
            [frame]
                duration=200
                image="units/golems/g9-ai-attack.webp"
                sound=fist.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-150
            [frame]
                duration=200
                image="units/golems/g9-ai-attack.webp"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
        start_time=50
        [frame]
            duration=100
            image="units/golems/g9-ai-attack.webp"
        [/frame]
    [/attack_anim]
    [abilities]
        {ABILITY_RESONANCE_ARCANITE}
    [/abilities]
[/unit_type]

#–––––––––––––––––––––––––––––––––––––––––––––––––––––––

[unit_type]
    id=LIUN_G9_AI
    [base_unit]
        id=LIUN_G9_AI_Base
    [/base_unit]
    name= _ "🤖 🟕 G9 AI (0·0)"
    cost=17
    hitpoints=32
    experience=15
    advances_to=LIUN_G9_AI_0_1
[/unit_type]

[unit_type]
    id=LIUN_G9_AI_0_1  # _ one gets by [AltGr] + [,]
    hide_help=yes
    [base_unit]
        id=LIUN_G9_AI_Base
    [/base_unit]
    name= _ "🤖 🟕 G9 AI (0·1)"
    cost=19
    hitpoints=30    # -8 HP
    experience=12   # -3 XP
    advances_to=LIUN_G9_NCM # The jump to Level 1
    [+abilities]
        {ABILITY_SUBMERGE}
    [/abilities]
    [attack]
        name=fist
        description=_ "Fist [brawl]"
        icon=attacks/g9-red-fist.webp
        type=impact
        range=melee
        damage=3
        number=4
        accuracy=0  # -5 – this is lesser than in original new state
        parry=0     # -5 – machines tend to get slacky over time
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack]
        name=fist
        description=_ "Fist [double tap]"
        icon=attacks/g9-yellow-fist.webp
        type=pierce
        range=melee
        damage=9
        number=2
        accuracy=0  # -5
        parry=0     # -5
    [/attack]
    image="units/golems/g9-ai.webp~BLIT(overlays/amla-cu-1.webp)"
    description= _ "Mainframe upgrade | This G9 unit gets the ability to stay submerged in water. Plus repair and error checks."
[/unit_type]
