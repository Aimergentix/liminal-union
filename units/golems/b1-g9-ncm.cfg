#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_G9_NCM_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🤖 🟗 G9 NCM"
    {SHARED_RACE_CHARACTERISTICS_GOLEM}
    {LIUN_ALLOY_ARCANITE}
    cost=26
    hitpoints=50
    movement=5
    experience=18
    level=1
    advances_to=null
    [abilities]
        {ABILITY_SUBMERGE}
        {ABILITY_RESONANCE_ARCANITE}
    [/abilities]
    [attack]
        name=fist
        description=_ "Fist [brawl]"
        icon=attacks/g9-red-fist.webp
        type=impact
        range=melee
        damage=5
        number=4
        accuracy=10
        parry=10
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack]
        name=fist
        description=_ "Fist [double tap]"
        icon=attacks/g9-yellow-fist.webp
        type=pierce
        range=melee
        damage=12
        number=2
        accuracy=10
        parry=10
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/golem.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="portraits/golem.webp"
    [/portrait]
    image="units/golems/g9-ncm.webp"
    profile="portraits/golem.webp"
    halo=halo/troop-ma1.webp
    description=_ "The G9 Neural Curie Mainframe warform series stands among the most formidable ever wrought by the Union's artificers. Only the finest bound intellects are sealed within a Neural Curie Mainframe — the culmination of old golem-craft refined through generations of lawful inquiry. Their bound energy-core, the Curie radiant core, is an Arcanite-sealed vessel no larger than a watermelon, named for the first Union artificer to perfect its design. Though not swift, the sheer mass and energy density of a G9 NCM can endure grievous punishment in the field. These warforms wear down with time and must be maintained and recalibrated by artificers of the corps."
    die_sound=net.wav
    {DEFENSE_ANIM_RANGE "units/golems/g9-ncm-defend.webp" "units/golems/g9-ncm.webp" "miss-2.ogg" melee }
    {DEFENSE_ANIM_RANGE "units/golems/g9-ncm-defend.webp" "units/golems/g9-ncm.webp" "miss-2.ogg" ranged }
    [death]
        start_time=0
        [frame]
            duration=50
            image=units/golems/g9-ncm.webp
        [/frame]
        [frame]
            duration=100
            image=units/golems/g9-ncm-die1.webp
        [/frame]
        [frame]
            duration=100
            image=units/golems/g9-ncm-die2.webp
            sound=drake-die.ogg
        [/frame]
        [frame]
            duration=100
            image=units/golems/g9-ncm-die3.webp
        [/frame]
    [/death]
    [attack_anim]
        [filter_attack]
            name=fist
        [/filter_attack]
        [if]
            hits=yes
            start_time=-150
            [frame]
                duration=200
                image="units/golems/g9-ncm-attack.webp"
                sound=fist.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-150
            [frame]
                duration=200
                image="units/golems/g9-ncm-attack.webp"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
        start_time=50
        [frame]
            duration=100
            image="units/golems/g9-ncm-attack.webp"
        [/frame]
    [/attack_anim]
[/unit_type]

# –––––––––––––––––––––––––––––––––––––––––––––––––

