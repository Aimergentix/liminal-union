#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_G8_Simulacrum_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🤖 🟕 G8 Simulacrum"
    {SHARED_RACE_CHARACTERISTICS_GOLEM}
    cost=8
    recall_cost=6
    hitpoints=24
    movement=0
    experience=10
    level=1
    zoc=no
    advances_to=null
    [attack]
        name=fist
        description=_ "Fist [brawl]"
        icon=attacks/g9-red-fist.webp
        type=impact
        range=melee
        damage=2
        number=4
        accuracy=0
        parry=0
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack]
        name=fist
        description=_ "Fist [double tap]"
        icon=attacks/g9-yellow-fist.webp
        type=impact
        range=melee
        damage=4
        number=2
        accuracy=0
        parry=0
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/golem.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="portraits/golem.webp"
    [/portrait]
    image="units/golems/g8-simulacrum.webp"
    profile="portraits/golem.webp"
    halo=halo/troop-ma0.webp
    description=_ "G8 Simulacra are Quickbound Golems wrought for training and proving. Their frames are brought to life by golem-script inscribed on parchment set within the construct. Corps artificers test the bound intellects awakened in each frame: only those of sufficient quality are elevated to full G9 Warform service — the rest serve out their purpose as Simulacra. Though not swift, the Simulacrum is sturdy and endures sustained engagement well. They serve as training partners and trial opponents for the corps. They wear down with use and must be regularly inspected and maintained by artificers."
    die_sound=net.wav
    {DEFENSE_ANIM_RANGE "units/golems/g9-ai-defend.webp" "units/golems/g9-ai.webp" "miss-2.ogg" melee }
    {DEFENSE_ANIM_RANGE "units/golems/g9-ai-defend.webp" "units/golems/g9-ai.webp" "miss-2.ogg" ranged }
    [death]
        start_time=0
        [frame]
            duration=50
            image=units/golems/g9-ai.webp
        [/frame]
        [frame]
            duration=100
            image=units/golems/g9-ai-die1.webp
        [/frame]
        [frame]
            duration=100
            image=units/golems/g9-ai-die2.webp
            sound=drake-die.ogg
        [/frame]
        [frame]
            duration=100
            image=units/golems/g9-ai-die3.webp
        [/frame]
    [/death]
    [attack_anim]
        [filter_attack]
            name=fist
        [/filter_attack]
        [if]
            hits=yes
            start_time=-150
            [frame]
                duration=200
                image="units/golems/g9-ai-attack.webp"
                sound=fist.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-150
            [frame]
                duration=200
                image="units/golems/g9-ai-attack.webp"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
        start_time=50
        [frame]
            duration=100
            image="units/golems/g9-ai-attack.webp"
        [/frame]
    [/attack_anim]
[/unit_type]

# –––––––––––––––––––––––––––––––––––––––––––––––––

[unit_type]
    id=LIUN_G8_Simulacrum
    [base_unit]
        id=LIUN_G8_Simulacrum_Base
    [/base_unit]
    hitpoints=26
    experience=10
    advances_to=LIUN_G8_Simulacrum_1_1  # the '_' sign we get by [AltGr] + [,]
[/unit_type]

[unit_type]
    id=LIUN_G8_Simulacrum_1_1
    hide_help=yes
    [base_unit]
        id=LIUN_G8_Simulacrum_Base
    [/base_unit]
    name= _ "🤖 🟕 G8 Simulacrum (1·1)"
    hitpoints=23  # -3 HP  – this is a G9 speciality,
    experience=8  # -2 XP  – mechanical G9s abrade over time
    advances_to=LIUN_G8_Simulacrum_1_2
    image="units/golems/g9-ai.webp~BLIT(overlays/amla-cu-2.webp)"
    description=_ "A G8 Simulacrum (1·1) – Core recalibration | Re-inscribed for drill and endurance trials, this training warform bears repeated strikes so that the corps may master formation and timing."
[/unit_type]

[unit_type]
    id=LIUN_G8_Simulacrum_1_2
    hide_help=yes
    [base_unit]
        id=LIUN_G8_Simulacrum_Base
    [/base_unit]
    name= _ "🤖 🟕 G8 Simulacrum (1·2)"
    hitpoints=20  # -3 HP
    experience=6  # -2 XP
    advances_to=null # Max level unit
    # Custom repeatable AMLA at max level:
    {AMLA_SIMULACRUM_END}
    image="units/golems/g9-ai.webp~BLIT(overlays/amla-cu-3.webp)"
    # description=_ "" No new description here. There is enough end-description in AMLA_SIMULACRUM_END
[/unit_type]
