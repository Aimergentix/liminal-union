#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Phoinix_Elder_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🧿 🟗 Phoinix Elder"
    {SHARED_RACE_CHARACTERISTICS_PHOINIX}
    cost=27
    hitpoints=30
    movement=8
    jamming=9
    experience=14
    level=1
    zoc=no
    advances_to=null
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
    [attack]
        name=claws1
        description= _ "Claws"
        icon=attacks/claws.png
        type=arcane
        range=melee
        damage=8
        number=2
        accuracy=0
        parry=0
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
    [attack]
        name=claws1
        description= _ "Claws"
        icon=attacks/claws.png
        type=arcane
        range=ranged
        damage=8
        number=2
        accuracy=0
        parry=0
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/phoinix.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="portraits/phoinix.webp"
    [/portrait]
    image="units/phoinix/phoinix-elder1.webp"
    profile="portraits/phoinix.webp"
    halo=halo/troop-mr1.webp
    description= _ "The Elder Phoinix has grown into its full shimmering form — small, swift, and barely visible at high altitude. It flies far beyond the reach of most enemy weapons, a glimmering presence more often sensed than seen."
    die_sound={SOUND_LIST:GRYPHON_DIE}
    {DEFENSE_ANIM "units/phoinix/phoinix-elder-defend.webp" "units/phoinix/phoinix-elder-attack1.webp" {SOUND_LIST:GRYPHON_HIT} }
    [attack_anim]
        [filter_attack]
            name=claws1
        [/filter_attack]
        start_time=-300
        [frame]
            duration=100
            image="units/phoinix/phoinix-elder1.webp"
            offset=0.0~-0.2
        [/frame]
        [frame]
            duration=200
            image="units/phoinix/phoinix-elder-attack1.webp"
            offset=-0.2~-1.0
        [/frame]
        [if]
            hits=yes
            [frame]
                duration=150
                image="units/phoinix/phoinix-elder-attack2.webp"
                sound=claws.ogg
                offset=0.0~1.25
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=150
                image="units/phoinix/phoinix-elder-defend.webp"
                sound={SOUND_LIST:MISS}
                offset=0.0~1.25
            [/frame]
        [/else]
        [frame]
            duration=100
            image="units/phoinix/phoinix-elder-attack1.webp"
            offset=1.25~0.75
        [/frame]
        [frame]
            duration=100
            image="units/phoinix/phoinix-elder1.webp"
            offset=0.75~0.0
        [/frame]
        {SOUND:HIT_AND_MISS claws.ogg {SOUND_LIST:MISS} -100}
    [/attack_anim]
    [standing_anim]
        start_time=0
        submerge=0.01
        layer=55
        [frame]
            duration=100
            image="units/phoinix/phoinix-elder1.webp"
        [/frame]
        [frame]
            duration=150
            image="units/phoinix/phoinix-elder2.webp"
        [/frame]
        [frame]
            duration=200
            image="units/phoinix/phoinix-elder3.webp"
        [/frame]
        [frame]
            duration=200
            image="units/phoinix/phoinix-elder4.webp"
        [/frame]
        [frame]
            duration=150
            image="units/phoinix/phoinix-elder5.webp"
        [/frame]
        [frame]
            duration=100
            image="units/phoinix/phoinix-elder6.webp"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        layer=55
        [frame]
            duration=150
            image="units/phoinix/phoinix-elder3.webp"
        [/frame]
        [frame]
            duration=200
            image="units/phoinix/phoinix-elder2.webp"
        [/frame]
        [frame]
            duration=200
            image="units/phoinix/phoinix-elder6.webp"
        [/frame]
        [frame]
            duration=150
            image="units/phoinix/phoinix-elder5.webp"
        [/frame]
    [/movement_anim]
[/unit_type]

# ––––––––––––––––––––––––––––––––––––––––––––––––––––

[unit_type]
    id=LIUN_Phoinix_Elder
    [base_unit]
        id=LIUN_Phoinix_Elder_Base
    [/base_unit]
    hitpoints=30
    experience=14
    advances_to=LIUN_Phoinix_Elder_1_1
[/unit_type]

[unit_type]
    id=LIUN_Phoinix_Elder_1_1
    hide_help=yes
    [base_unit]
        id=LIUN_Phoinix_Elder_Base
    [/base_unit]
    name= _ "🧿 🟗 Phoinix Elder (1·1)"
    hitpoints=33    # +3 HP
    experience=16   # +3 XP
    advances_to=LIUN_Phoinix_Elder_1_2
    [abilities]
        {ABILITY_SKIRMISHER}
        {ABILITY_UNPOISON}
    [/abilities]
    image="units/phoinix/phoinix-elder1.webp~BLIT(overlays/amla-cu-2.webp)"
    description= _ "Ability: unpoison | In its final developmental stage, the tears of a phoinix bird can detox units from poison."
[/unit_type]

[unit_type]
    id=LIUN_Phoinix_Elder_1_2
    hide_help=yes
    [base_unit]
        id=LIUN_Phoinix_Elder_Base
    [/base_unit]
    name= _ "🧿 🟗 Phoinix Elder (1·2)"
    hitpoints=36    # +3 HP
    experience=18   # +3 XP
    advances_to=null # Max level unit
    {AMLA_PHOINIX_END} # Standard repeatable AMLA at max level
    [abilities]
        {ABILITY_SKIRMISHER}
        {ABILITY_UNPOISON}
        {ABILITY_TELEPORT}
    [/abilities]
    image="units/phoinix/phoinix-elder1.webp~BLIT(overlays/amla-cu-3.webp)"
    description= _ "Ability: teleport | Friendly villages maintain portals. This Phoinix unit can now teleport between them."
[/unit_type]
