#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Phoinix_Base
    hide_help=yes           # This makes it "hidden" from the player's help menu
    do_not_list=yes         # Extra guard for some UMC scripts
    name= _ "🧿🟕 Phoinix"
    {SHARED_RACE_CHARACTERISTICS_PHOINIX}
    cost=20
    recall_cost=20
    hitpoints=19
    movement=7
    jamming=9
    experience=12
    level=0
    zoc=no
    advances_to=null
    [attack]
        name=claws
        description= _ "Claws"
        icon=attacks/claws.png
        type=arcane
        range=melee
        damage=5
        number=2
        accuracy=0
        parry=0
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
    [attack]
        name=claws
        description= _ "Claws"
        icon=attacks/claws.png
        type=arcane
        range=ranged
        damage=5
        number=2
        accuracy=0
        parry=0
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="portraits/phoinix.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="portraits/phoinix.webp"
    [/portrait]
    image="units/phoinix/phoinix1.webp"
    profile="portraits/phoinix.webp"
    halo=halo/troop-mr0.webp
    description= _ "The Phoinix is a living emblem of renewal and passage, said never to have bowed to corruption. Its presence is an affront to the forces of darkness and an uncomfortable reminder to those who would enthrone arcane will above the common law. A sealed core of vital radiance burns within, and a Phoinix's touch may draw poison from the wounded. The Liminal Union trains Phoinix Messengers as swift mobile scouts. A discerning Phoinix may be called forth by the old kabbalistic recitation of the corps; some choose to bind themselves to a particular singer-keeper. The Phoinix flies very high, beyond the reach of most enemy weapons, and holds no fixed ground — nor does its passage impose constraint upon enemy lines."
    die_sound={SOUND_LIST:GRYPHON_DIE}
    {DEFENSE_ANIM "units/phoinix/phoinix-defend.webp" "units/phoinix/phoinix-attack1.webp" {SOUND_LIST:GRYPHON_HIT} }
    [attack_anim]
        [filter_attack]
            name=claws
        [/filter_attack]
        start_time=-300
        [frame]
            duration=100
            image="units/phoinix/phoinix1.webp"
            offset=0.0~-0.2
        [/frame]
        [frame]
            duration=200
            image="units/phoinix/phoinix-attack1.webp"
            offset=-0.2~-1.0
        [/frame]
        [if]
            hits=yes
            [frame]
                duration=150
                image="units/phoinix/phoinix-attack2.webp"
                sound=claws.ogg
                offset=0.0~1.25
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=150
                image="units/phoinix/phoinix-defend.webp"
                sound={SOUND_LIST:MISS}
                offset=0.0~1.25
            [/frame]
        [/else]
        [frame]
            duration=100
            image="units/phoinix/phoinix-attack1.webp"
            offset=1.25~0.75
        [/frame]
        [frame]
            duration=100
            image="units/phoinix/phoinix1.webp"
            offset=0.75~0.0
        [/frame]
        {SOUND:HIT_AND_MISS claws.ogg {SOUND_LIST:MISS} -100}
    [/attack_anim]
    [standing_anim]
        start_time=0
        submerge=0.01
        layer=55
        [frame]
            duration=100
            image="units/phoinix/phoinix1.webp"
        [/frame]
        [frame]
            duration=150
            image="units/phoinix/phoinix2.webp"
        [/frame]
        [frame]
            duration=200
            image="units/phoinix/phoinix3.webp"
        [/frame]
        [frame]
            duration=200
            image="units/phoinix/phoinix4.webp"
        [/frame]
        [frame]
            duration=150
            image="units/phoinix/phoinix5.webp"
        [/frame]
        [frame]
            duration=100
            image="units/phoinix/phoinix6.webp"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        layer=55
        [frame]
            duration=150
            image="units/phoinix/phoinix3.webp"
        [/frame]
        [frame]
            duration=200
            image="units/phoinix/phoinix2.webp"
        [/frame]
        [frame]
            duration=200
            image="units/phoinix/phoinix6.webp"
        [/frame]
        [frame]
            duration=150
            image="units/phoinix/phoinix5.webp"
        [/frame]
    [/movement_anim]
[/unit_type]

# –––––––––––––––––––––––––––––––––––––––––––––

[unit_type]
    id=LIUN_Phoinix
    [base_unit]
        id=LIUN_Phoinix_Base
    [/base_unit]
    hitpoints=24
    experience=12
    advances_to=LIUN_Phoinix_0_1
[/unit_type]

[unit_type]
    id=LIUN_Phoinix_0_1
    hide_help=yes
    [base_unit]
        id=LIUN_Phoinix_Base
    [/base_unit]
    name= _ "🧿🟕 Phoinix (0·1)"
    hitpoints=27    # +3 HP
    experience=15   # +3 XP
    advances_to=LIUN_Phoinix_Elder
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
    image="units/phoinix/phoinix1.webp~BLIT(overlays/amla-cu-1.webp)"
    description= _ "Ability: skirmisher | The phoinix enters a new developmental stage which creates a <i>critical reality</i>: it is able to move past enemies quickly."
[/unit_type]
