#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Elvish_Healer
    name= _"female^Elvish Healer"
    race=elf
    gender=female
    image="units/elves/healer.webp"
    profile="portraits/elves/shaman.webp"
    hitpoints=16
    movement_type=woodland
    movement=5
    experience=18
    level=0
    alignment=neutral
    advances_to="Elvish Shaman"
    cost=11
    usage=healer
    halo=halo/peasantship-p0.webp
    description= _"Some elves are unusually close to their faerie nature, which enables them to control magic consciously. On the battlefield, they use their skills to heal wounds and summon plants to their aid."
    die_sound={SOUND_LIST:ELF_FEMALE_HIT}
    {DEFENSE_ANIM "units/elves/healer-defend.webp" "units/elves/healer.webp" {SOUND_LIST:ELF_FEMALE_HIT}}
    [abilities]
        {ABILITY_HEALS}
    [/abilities]
    [attack]
        name=staff
        description= _"staff"
        type=impact
        damage=3
        number=1
        range=melee
        icon=attacks/druidstaff.png
    [/attack]
    [attack]
        name=entangle
        description= _"entangle"
        type=impact
        damage=3
        number=2
        range=ranged
    [/attack]

    [healing_anim]
        start_time=-200
        [frame]
            image="units/elves/healer-magic-[1,2].webp:55"
        [/frame]
        [frame]
            image="units/elves/healer-magic-[3~1].webp:[165,110,140]"
            halo="halo/elven/shaman-heal-halo-[1~7].png:55"
        [/frame]
    [/healing_anim]

    [attack_anim]
        [filter_attack]
            name=staff
        [/filter_attack]
        start_time=-175
        [frame]
            image="units/elves/healer.webp:75,units/elves/healer-attack.webp:200,units/elves/healer.webp:75"
        [/frame]
        {SOUND:HIT_AND_MISS staff.wav {SOUND_LIST:MISS} -125}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=entangle
        [/filter_attack]
        missile_start_time=-450
        [missile_frame]
            offset=1.0
            duration=150
            image="projectiles/entangle.png"
            image_diagonal="projectiles/entangle.png"
        [/missile_frame]
        start_time=-450
        [frame]
            image="units/elves/healer-magic-[1~3~1].webp:110"
            halo=halo/elven/nature-halo[1~6].png:75,halo/elven/nature-halo[7~8].png:50
            halo_x,halo_y=0,-12
        [/frame]
        attack_sound_start_time=-75
        [attack_sound_frame]
            sound=entangle.wav
        [/attack_sound_frame]
    [/attack_anim]
[/unit_type]
