#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Dark_Initiate
    name= _"Dark Initiate"
    gender=male,female
    race=human
    ignore_race_traits=yes
    {TRAIT_QUICK}
    {TRAIT_INTELLIGENT}
    {TRAIT_RESILIENT}
    image="units/undead/initiate.webp"
    profile="portraits/humans/mage.webp"
    hitpoints=16
    movement_type=smallfoot
    movement=5
    experience=21
    level=0
    alignment=chaotic
    advances_to="Dark Adept"
    cost=9
    usage=archer
    halo=halo/peasantship-p0.webp
    description= _"Curiosity is the mother of scholarship and thus the highest virtue of the order of magi. However, not all students find the golden mean, and some succumb to the temptation of practising the dark arts at night. The resulting lack of sleep exhausts them so much, that they become even weaker than lawful initiates."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/undead/initiate-defend.webp" "units/undead/initiate.webp" {SOUND_LIST:HUMAN_HIT} }
    [attack]
        name="chill wave"
        description=_"chill wave"
        icon=attacks/iceball.png
        type=cold
        range=ranged
        damage=4
        number=2
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
    [attack]
        name="shadow wave"
        description=_"shadow wave"
        icon=attacks/dark-missile.png
        type=arcane
        range=ranged
        damage=6
        number=2
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
    [attack_anim]
        [filter_attack]
            name="chill wave"
        [/filter_attack]
        {MISSILE_FRAME_CHILL_WAVE 0 -12}
        start_time=-450
        [frame]
            image="units/undead/initiate-attack-magic-1.webp:310"
            halo=halo/undead/dark-magic-[1~6].png:50
            halo_x,halo_y=0,-12
        [/frame]
        {SOUND:HIT_AND_MISS magic-dark.ogg magic-dark-miss.ogg -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name="shadow wave"
        [/filter_attack]
        {MISSILE_FRAME_SHADOW_WAVE}
        start_time=-700
        [frame]
            image="units/undead/initiate-attack-magic-1.webp:650"
            halo=halo/undead/dark-magic-[1~6].png:50
            halo_x,halo_y=0,-12~12
        [/frame]
        {SOUND:HIT_AND_MISS magic-dark-big.ogg magic-dark-big-miss.ogg -50}
    [/attack_anim]

    [female]
        name= _"female^Dark Initiate"
        gender=female
        image="units/undead/initiate+female.webp"
        profile="portraits/humans/mage+female.webp"
        die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
        {DEFENSE_ANIM "units/undead/initiate+female-defend.webp" "units/undead/initiate+female.webp" {SOUND_LIST:HUMAN_FEMALE_HIT} }
        [attack_anim]
            [filter_attack]
                name=chill wave
            [/filter_attack]
            [frame]
                image="units/undead/initiate+female-attack-magic-1.webp:310"
            [/frame]
        [/attack_anim]
        [attack_anim]
            [filter_attack]
                name=shadow wave
            [/filter_attack]
            [frame]
                image="units/undead/initiate+female-attack-magic-1.webp:650"
            [/frame]
        [/attack_anim]
    [/female]
[/unit_type]
