#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Soul
    name= _"Soul"
    race=undead
    image="units/undead/soul-2.webp"
    profile=portraits/undead/ghost.webp
    hitpoints=16
    movement_type=undeadspirit
    movement=7
    experience=18
    level=0
    alignment=chaotic
    advances_to=Ghost
    cost=8
    usage=scout
    halo=halo/peasantship-p0.webp
    description= _"Some souls cannot find rest and are damned to aimlessly wander this world for eternity. Often they belong to inexperienced Dark Adepts, who tried to cheat their premature death. And succeeded. Regrettably."
    die_sound=wail-long.wav

    [standing_anim]
        start_time=0
        alpha=0.8~0.4:1400,0.4~0.6:600,0.6~0.4:600,0.4~0.8:1400
        [frame]
            image="units/undead/soul-[2,1~3,2,1~3,2,1~3,2,1~3].webp:250"
        [/frame]
    [/standing_anim]

    [defend]
        start_time=-126
        [if]
            hits=hit
            offset=0.0~-0.05:126,-0.05~0.0:126
            alpha=0.8~0.5:126,0.5~0.8:126

            hit_sound_start_time=-25
            [hit_sound_frame]
                sound=wail-sml.wav
            [/hit_sound_frame]
        [/if]
        [else]
            hits=kill
            offset=0.0~-0.05:126,-0.05~0.0:126
            alpha=0.8~0.5:126,0.5~0.8:126
        [/else]
        [else]
            hits=miss
            offset=0.0~-0.1:126,-0.1~0.0:126
            alpha=0.8~0.25:126,0.25~0.8:126
        [/else]
        [frame]
            image="units/undead/soul-1.webp:1"
        [/frame]
        [frame]
            image="units/undead/soul-attack-melee.webp:250"
        [/frame]
        [frame]
            image="units/undead/soul-1.webp:1"
        [/frame]
    [/defend]

    [attack]
        name=touch
        description= _"touch"
        icon=attacks/touch-undead.png
        type=arcane
        range=melee
        damage=3 # 4
        number=3 # 2
        [specials]
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
    [/attack]

    [attack]
        name=wail
        description= _"wail"
        type=cold
        range=ranged
        damage=3
        number=2 # 3
    [/attack]

    [attack_anim]
        [filter_attack]
            name=touch
        [/filter_attack]
        start_time=-500
        offset=0.0~1.0:425,0.0:225
        alpha=0.8~0.0:425,0.0~0.8:225
        [frame]
            image="units/undead/soul-1.webp:25"
        [/frame]
        [frame]
            image="units/undead/soul-attack-melee.webp:600"
        [/frame]
        [frame]
            image="units/undead/soul-1.webp:25"
        [/frame]
        attack_sound_start_time=-126
        [attack_sound_frame]
            duration=1
        [/attack_sound_frame]
        [attack_sound_frame]
            sound=wail-sml.wav
        [/attack_sound_frame]
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=wail
        [/filter_attack]
        {MISSILE_FRAME_WAIL}
        start_time=-200
        [frame]
            image="units/undead/soul-1.webp:25"
        [/frame]
        [frame]
            image="units/undead/soul-attack-ranged.webp:300"
        [/frame]
        [frame]
            image="units/undead/soul-1.webp:25"
        [/frame]
        attack_sound_start_time=-100
        [attack_sound_frame]
            sound=wail-sml.wav
        [/attack_sound_frame]
    [/attack_anim]
[/unit_type]
