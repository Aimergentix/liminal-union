#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Drake_Brave
    name= _ "Draken Brave"
    race=drake
    gender=male
    hitpoints=18
    movement_type=drakefoot
    movement=5
    experience=18
    level=0
    alignment=lawful
    advances_to="Drake Burner, Drake Clasher, Drake Fighter, Drake Glider"
    cost=10
    usage=fighter
    halo=halo/peasantship-p0.webp
    image="units/drakes/peasant-drake.webp"
    profile="portraits/drakes/peasant-drake.webp"
    description= _ "Peasants are the backbone of the rural economy, and the soldiers of last resort. While not warlike by nature, they will stubbornly defend their homes. However, if you’re hurling peasants at your foes, you’re clearly out of superior forces."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/drakes/peasant-drake-defend.webp" "units/drakes/peasant-drake.webp" {SOUND_LIST:HUMAN_OLD_HIT} }
#    [portrait]
#        size=400
#        side="left"
#        mirror="false"
#        image="portraits/drakes/transparent/peasant_drake.webp"
#    [/portrait]
#    [portrait]
#       size=400
#        side="right"
#        mirror="true"
#        image="portraits/drakes/transparent/peasant_drake.webp"
#   [/portrait]
    [attack]
        name=pitchfork
        description=_"pitchfork"
        type=pierce
        range=melee
        damage=6
        number=2
        icon=attacks/pitchfork.png
    [/attack]
    [attack]
        name=pitchfork
        description=_"pitchfork"
        type=pierce
        range=ranged
        damage=3
        number=1
        icon=attacks/pitchfork.png
    [/attack]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="units/drakes/peasant-drake-idle-[1,2,2,1].webp:[100,200,200,100]"
        [/frame]
    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=pitchfork
            range=ranged
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/spear-n.webp"
            image_diagonal="projectiles/spear-ne.webp"
        [/missile_frame]
        start_time=-150
        [frame]
            image="units/drakes/peasant-drake-attack-2.webp:100"
            sound={SOUND_LIST:THROW}
        [/frame]
        {SOUND:HIT spear.ogg -50}
        [frame]
            image="units/drakes/peasant-drake-ranged.webp:150"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=pitchfork
            range=melee
        [/filter_attack]
        start_time=-250
        [frame]
            image="units/drakes/peasant-drake.webp:50"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -200}
        [frame]
            image="units/drakes/peasant-drake-attack-[1,2].webp:[250,100]"
        [/frame]
        [frame]
            image="units/drakes/peasant-drake.webp:50"
        [/frame]
    [/attack_anim]
[/unit_type]

