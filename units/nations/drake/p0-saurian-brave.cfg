#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Saurian_Brave
    name= _ "female^Saurian Brave"
    race=lizard
    movement_type=lizard
    alignment=chaotic
    gender=female
    hitpoints=18
    movement=5
    experience=18
    level=0
    advances_to="Saurian Skirmisher"
    cost=8
    usage=scout
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
    [attack]
        name=dagger
        description= _ "dagger"
        icon=attacks/dagger-human.png
        type=blade
        range=melee
        damage=5
        number=2
    [/attack]
    [attack]
        name=knives
        description= _ "knives"
        icon=attacks/dagger-thrown-poison-human.png
        type=blade
        range=ranged
        damage=4
        number=1
    [/attack]
    halo=halo/peasantship-p0.webp
    image="units/saurians/skirmisher/skirmisher.png"
    profile=portraits/saurians/skirmisher.webp
    description= _ "Saurian braves are very small of frame, and though they are somewhat frail because of this, they are very, very agile. In combat, their size allows them to dart past defenses that would hold any grown man at bay, making them a tricky foe to deal with."
    die_sound=hiss-die.wav
    [defend]
        start_time=-275
        [frame]
            duration=50
            image="units/saurians/assassine-defenda-1.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-defenda-2.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-defenda-3.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-defenda-4.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-defenda-5.webp"
        [/frame]
        [if]
            hits=yes
            start_time=-25
            [frame]
                duration=50
                image="units/saurians/assassine-defenda-6.webp"
                sound=hiss-hit.wav
            [/frame]
        [/if]
        [else]
            hits=no
            start_time=-25
            [frame]
                duration=50
                image="units/saurians/assassine-defenda-6.webp"
            [/frame]
        [/else]
        [frame]
            duration=50
            image="units/saurians/assassine-defenda-7.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-defenda-8.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-defenda-9.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-defenda-10.webp"
        [/frame]
    [/defend]

    [attack_anim]
        [filter_attack]
            name=dagger
            range=melee
        [/filter_attack]
        start_time=-100
        [frame]
            duration=200
            image="units/saurians/assassine-attack.webp"
        [/frame]
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=knives
            range=ranged
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/dagger-n.png"
            image_diagonal="projectiles/dagger-ne.png"
        [/missile_frame]
        start_time=-250
        [frame]
            duration=100
            image="units/saurians/assassin-ranged-1.webp"
        [/frame]
        {SOUND:HIT_AND_MISS throwing-knife.ogg throwing-knife-miss.ogg -150}
        [frame]
            duration=250
            image="units/saurians/assassin-ranged-2.webp"
        [/frame]
    [/attack_anim]

    [death]
        start_time=0
        [frame]
            duration=50
            image="units/saurians/assassine-die-1.webp"
            sound=hiss-die.wav
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-die-2.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-die-3.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-die-4.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-die-5.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-die-7.webp"
        [/frame]
        [frame]
            duration=50
            image="units/saurians/assassine-die-8.webp"
        [/frame]
        [frame]
            duration=200
            image="units/saurians/assassine-die-9.webp"
            sound=squishy-hit.wav
        [/frame]
    [/death]
[/unit_type]

