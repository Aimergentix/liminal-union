[unit_type]
    id=LIUN_Muhandiz
    name= _ "💥 Dune Dropout"
    race=dunefolk
    gender=male,female
    hitpoints=77
    movement_type=dunefoot
    movement=5
    experience=14
    level=0
    alignment=neutral
    advances_to="LIUN_Herbalist, Dune Burner"
    cost=10
    usage=fighter
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="{LIUN_PORTRAITSTR}.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="{LIUN_PORTRAITSTR}.webp"
    [/portrait]
    image="{LIUN_UNITSTR}.webp"
    profile="{LIUN_PROFILESTR}.webp"
    halo=halo/peasantship-p0.webp
    description= _ "Unlike the learned herbalists, dunefolk dropouts have given up their life as undergraduates. These students develop an interest in alchemical substances and explosives in order to prove themselves useful in asymmetric war. That they will die in the process of obtaining 'victory' does not interest those who carry a suicide bomb into battle. The dunefolk officials promote self-sacrifice as an act of devotion and promise 'heavenly rewards' for killing 'infidels'. However, not few are forced into it by their clans as a repay of an honor debt, or by blackmail, because the demand for such bombers is always greater than the supply."
    die_sound={SOUND_LIST:GOBLIN_DIE}
    [abilities]
        {ABILITY_SUICIDEBOMBER}
        {ABILITY_SKIRMISHER}
    [/abilities]
    {DEFENSE_ANIM_RANGE "{LIUN_UNITSTR}-defend-1.webp" "{LIUN_UNITSTR}-defend-2.webp" {SOUND_LIST:HUMAN_HIT} ranged }
    {DEFENSE_ANIM_RANGE "{LIUN_UNITSTR}-defend-1.webp" "{LIUN_UNITSTR}-defend-2.webp" {SOUND_LIST:HUMAN_OLD_HIT} melee }
    [attack]
        name=dagger
        description= _ "dagger"
        type=blade
        range=melee
        damage=4
        number=3
        icon=attacks/dagger-curved.png
    [/attack]
    [attack]
        name=suicidebomb
        description= _ "bomb"
        type=fire
        range=kamikaze # otherwise it will not work
        damage=17
        number=1
        icon=attacks/bomb.webp
        [specials]
            {WEAPON_SPECIAL_BOMBEXPLOSION}
        [/specials]
    [/attack]
    [attack_anim]
        [filter_attack]
            name=dagger
        [/filter_attack]
        start_time=-200
        [frame]
            image="{LIUN_PATH_TEMP}burner.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS dagger-swish.wav dagger-swish.wav -150}
