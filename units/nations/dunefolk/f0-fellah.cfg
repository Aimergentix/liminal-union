#textdomain wesnoth-liminal-union
# wmllint: general spellings Fellah fellah
#define LIUN_UNITSTR
units/dunefolks/peasant-fellah#enddef
#define LIUN_PROFILESTR
portraits/dunefolk/rover#enddef
#define LIUN_PORTRAITSTR
portraits/dunefolk/rover#enddef

[unit_type]
    id=LIUN_Fellah
    name= _ "Dune Serf"
    race=dunefolk
    gender=male
    image="{LIUN_UNITSTR}.webp"
    profile="{LIUN_PROFILESTR}.webp"
    hitpoints=18
    movement_type=dunefoot
    movement=5
    experience=18
    level=0
    alignment=lawful
    advances_to="Dune Soldier, Dune Rover, Dune Skirmisher"
    cost=9
    usage=fighter
    halo=halo/peasantship-p0.webp
    description= _ "A serf, is the backbone of the dunefolk economy, and a soldiers of last resort. While not warlike by nature, they can be forced to stubbornly fight because they fear the subduer's whip. However, if you’re hurling serfs at your foes, you’re clearly out of superior forces."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "{LIUN_UNITSTR}-defend.webp" "{LIUN_UNITSTR}.webp" {SOUND_LIST:HUMAN_OLD_HIT} }
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="{LIUN_PORTRAITSTR}.webp"
    [/portrait]
    [portrait]
       size=400
        side="right"
        mirror="true"
        image="{LIUN_PORTRAITSTR}.webp"
   [/portrait]
    [attack]
        name=pitchfork
        description=_"pitchfork"
        type=pierce
        range=melee
        damage=6
        number=2
        icon=attacks/pitchfork.png
    [/attack]
    [attack]
        name=pitchfork
        description=_"pitchfork"
        type=pierce
        range=ranged
        damage=3
        number=1
        icon=attacks/pitchfork.png
    [/attack]
#    [idle_anim]
#        {STANDARD_IDLE_FILTER}
#        start_time=0
#        [frame]
#            image="{LIUN_UNITSTR}-idle-[1~7,4,2,1].webp:[100*4,200*3,100*3]"
#        [/frame]
#    [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=pitchfork
            range=ranged
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/spear-n.webp"
            image_diagonal="projectiles/spear-ne.webp"
        [/missile_frame]
        start_time=-150
        [frame]
            image="{LIUN_UNITSTR}-attack-2.webp:100"
            sound={SOUND_LIST:THROW}
        [/frame]
        {SOUND:HIT spear.ogg -50}
        [frame]
            image="{LIUN_UNITSTR}-ranged.webp:150"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=pitchfork
            range=melee
        [/filter_attack]
        start_time=-250
        [frame]
            image="{LIUN_UNITSTR}.webp:50"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -200}
        [frame]
            image="{LIUN_UNITSTR}-attack-[1,2].webp:[250,100]"
        [/frame]
        [frame]
            image="{LIUN_UNITSTR}.webp:50"
        [/frame]
    [/attack_anim]
[/unit_type]

#undef LIUN_UNITSTR
#undef LIUN_PROFILESTR
#undef LIUN_PORTRAITSTR
