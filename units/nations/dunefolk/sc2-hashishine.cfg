#textdomain wesnoth-liminal-union
# wmllint: general spellings Fellah fellah

#define LIUN_UNITSTR
units/dunefolks/nightblade#enddef
#define LIUN_PROFILESTR
portraits/orcs/slayer#enddef
#define LIUN_PORTRAITSTR
portraits/orcs/slayer#enddef

[unit_type]
    id=LIUN_Hashishine
    name= _ "Dune Hashishi"
    race=dunefolk
    gender=male
    hitpoints=42
    movement_type=duneelusivefoot
    [resistance]
        arcane=100
    [/resistance]
    movement=6
    experience=100
    level=2
    alignment=liminal
    advances_to=null
    {AMLA_DEFAULT}
    cost=36
    usage=fighter
    [portrait]
        size=400
        side="left"
        mirror="false"
        image="{LIUN_PORTRAITSTR}.webp"
    [/portrait]
    [portrait]
        size=400
        side="right"
        mirror="true"
        image="{LIUN_PORTRAITSTR}.webp"
    [/portrait]
    image="{LIUN_UNITSTR}.webp"
    profile="{LIUN_PROFILESTR}.webp"
    description= _ "Amongst the dunefolk developed a special unit, the Hashishi, the best assassinator. The Hashishi assailants are trained in techniques of hand-to-hand combat. Their most preferred weapon for a kill from behind are multiple knives dipped in poison. However, the Hashishi became best known for their excessive psychoactive drug abuse: hashish. The only downside of this practice in an army is, that by altering the visual, auditory, and olfactory senses, the drugs lead Hashishi sometimes to poison the false person, even merry comrades."
    die_sound={SOUND_LIST:ORC_DIE}
    [abilities]
        {ABILITY_NIGHTSTALK}
    [/abilities]
    [attack]
        name=blade
        description=_"blade"
        icon=attacks/dagger-orcish.png
        type=blade
        range=melee
        damage=7
        number=2
        [specials]
            {WEAPON_SPECIAL_BERSERK}
        [/specials]
    [/attack]
    [attack]
        name=kick
        description=_"kick & punch"
        icon=attacks/fist-human.png
        type=impact
        range=melee
        damage=8
        number=2
    [/attack]
    [attack]
        name="throwing knives"
        description=_"hashishi attack"
        icon=attacks/dagger-thrown-poison-orcish.png
        type=blade
        range=ranged
        damage=4
        number=4
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [defend]
        hits=miss
        start_time=-150
        [frame]
            duration=1
            image="{LIUN_UNITSTR}.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-defend-se2-1.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-defend-se2-2.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-defend-se2-1.webp"
        [/frame]
        [frame]
            duration=1
            image="{LIUN_UNITSTR}.webp"
        [/frame]
    [/defend]

    [defend]
        hits=miss
        start_time=-370
        [frame]
            duration=100
            image="{LIUN_UNITSTR}.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-defend-se1-1.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-defend-se1-2.webp"
        [/frame]
        [frame]
            duration=140
            image="{LIUN_UNITSTR}-defend-se1-3.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-defend-se1-4.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-defend-se1-5.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}.webp"
        [/frame]
    [/defend]

    [defend]
        hits=hit
        start_time=-126
        [frame]
            duration=1
            image="{LIUN_UNITSTR}.webp"
        [/frame]
        [frame]
            duration=250
            image="{LIUN_UNITSTR}-defend-se1-1.webp"
            sound={SOUND_LIST:ORC_HIT}
        [/frame]
        [frame]
            duration=1
            image="{LIUN_UNITSTR}.webp"
        [/frame]
    [/defend]


    [attack_anim]
        [filter_attack]
            name="throwing knives"
        [/filter_attack]
        start_time=-450
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/dagger-n.png"
            image_diagonal="projectiles/dagger-ne.png"
        [/missile_frame]

        [frame]
            duration=100
            image="{LIUN_UNITSTR}-throw-se1.webp"
        [/frame]

        [frame]
            duration=100
            image="{LIUN_UNITSTR}-throw-se2.webp"
        [/frame]

        [frame]
            duration=100
            image="{LIUN_UNITSTR}-throw-se3.webp"
        [/frame]

        [if]
            hits=yes
            [frame]
                duration=100
                image="{LIUN_UNITSTR}-throw-se4.webp"
                sound=throwing-knife.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=100
                image="{LIUN_UNITSTR}-throw-se4.webp"
                sound=throwing-knife-miss.ogg
            [/frame]
        [/else]

        [frame]
            duration=100
            image="{LIUN_UNITSTR}-throw-se5.webp"
        [/frame]

        [frame]
            duration=100
            image="{LIUN_UNITSTR}-throw-se6.webp"
        [/frame]

        [frame]
            duration=100
            image="{LIUN_UNITSTR}-throw-se7.webp"
        [/frame]

        [frame]
            duration=100
            image="{LIUN_UNITSTR}-throw-se8.webp"
        [/frame]

        [frame]
            duration=100
            image="{LIUN_UNITSTR}-throw-se9.webp"
        [/frame]
        {SOUND:HIT_AND_MISS dagger-swish.wav {SOUND_LIST:MISS} -100}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=blade
        [/filter_attack]
        start_time=-500
        offset=0.0~0.5:500,0.5~0.0:500
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-attack-se1.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-attack-se2.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-attack-se3.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-attack-se4.webp"
        [/frame]
        [if]
            hits=yes
            [frame]
                duration=100
                image="{LIUN_UNITSTR}-attack-se5.webp"
                sound={SOUND_LIST:SWORD_SWISH}
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=100
                image="{LIUN_UNITSTR}-attack-se5.webp"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-attack-se6.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-attack-se7.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-attack-se8.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-attack-se9.webp"
        [/frame]
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=kick
        [/filter_attack]
        start_time=-500
        offset=0.0~0.0:300,0.0~0.3:300,0.3~0.4:200,0.4~0.4:200,0.4~0.0:200
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-kick-se1.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-kick-se2.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-kick-se3.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-kick-se4.webp"
        [/frame]
        [if]
            hits=yes
            [frame]
                duration=100
                image="{LIUN_UNITSTR}-kick-se5.webp"
                sound=club.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                duration=100
                image="{LIUN_UNITSTR}-kick-se5.webp"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-kick-se6.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-kick-se7.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-kick-se8.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-kick-se9.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-kick-se10.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-kick-se11.webp"
        [/frame]
        [frame]
            duration=100
            image="{LIUN_UNITSTR}-kick-se12.webp"
        [/frame]
    [/attack_anim]
[/unit_type]

#undef LIUN_UNITSTR
#undef LIUN_PROFILESTR
#undef LIUN_PORTRAITSTR

