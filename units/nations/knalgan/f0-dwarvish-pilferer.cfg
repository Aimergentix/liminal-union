#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Dwarvish_Pilferer
    name= _"Dwarvish Pilferer"
    race=human
    gender=male,female
    image="units/humans/pilferer.webp"
    profile="portraits/humans/thief.webp"
    hitpoints=16
    movement_type=elusivefoot
    movement=5
    experience=18
    level=0
    alignment=chaotic
    advances_to="Thief, Footpad, Poacher"
    cost=8 # 6
    usage=fighter
    halo=halo/peasantship-p0.webp
    description= _"Pilferers are impoverished individuals who can be found in the back alleys of any town. They subsist by petty crime and day labor, and even rats are always a welcome meal in such conditions."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/humans/pilferer-defend.webp" "units/humans/pilferer.webp" {SOUND_LIST:HUMAN_HIT} }

    [attack]
        name=dagger
        description= _"dagger"
        icon=attacks/dagger-human.png
        type=blade
        range=melee
        damage=3 # 4
        number=3 # 2
    [/attack]

    [attack_anim]
        [filter_attack]
            name=dagger
        [/filter_attack]
        start_time=-150
        [frame]
            image="units/humans/pilferer.webp:50"
        [/frame]
        [frame]
            image="units/humans/pilferer-attack.webp:200"
        [/frame]
        {SOUND:HIT_AND_MISS dagger-swish.wav {SOUND_LIST:MISS} -100}
        [frame]
            image="units/humans/pilferer.webp:50"
        [/frame]
    [/attack_anim]

    [female]
        name= _"female^Pilferer"
        gender=female
        image="units/humans/pilferer+female.webp"
        profile="portraits/humans/thief+female.webp"
        die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
        {DEFENSE_ANIM "units/humans/pilferer+female-defend.webp" "units/humans/pilferer+female.webp" {SOUND_LIST:HUMAN_FEMALE_HIT} }

        [attack_anim]
            [filter_attack]
                name=dagger
            [/filter_attack]
            [frame]
                image="units/humans/pilferer+female.webp:50"
            [/frame]
            [frame]
                image="units/humans/pilferer+female-attack.webp:200"
            [/frame]
            [frame]
                image="units/humans/pilferer+female.webp:50"
            [/frame]
        [/attack_anim]
    [/female]
[/unit_type]
