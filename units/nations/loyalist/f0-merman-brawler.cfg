#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Brawler
    name= _"Merman Brawler"
    profile="portraits/merfolk/brawler.webp"
    race=merman
    image="units/merfolk/brawler.webp"
    hitpoints=16
    movement_type=swimmer
    movement=6
    experience=18
    level=0
    alignment=lawful
    advances_to="Merman Fighter"
    cost=8
    usage=fighter
    halo=halo/peasantship-p0.webp
    description= _"Exceptionally large and strong mermen are sometimes more comfortable with their own fists and tails than with other weapons."
    die_sound=mermen-die.ogg
    {DEFENSE_ANIM "units/merfolk/brawler-defend.webp" "units/merfolk/brawler-defend.webp" mermen-hit.wav }
    [attack]
        name=fist-merman
        description= _"fist"
        type=impact
        range=melee
        damage=3
        number=3
    [/attack]
    [attack]
        name=tail-merman
        description= _"tail"
        type=impact
        range=melee
        damage=4
        number=2
        [specials]
            {WEAPON_SPECIAL_LIUN_STUN}
        [/specials]
    [/attack]

    [attack_anim]
        [filter_attack]
            name=fist-merman
        [/filter_attack]
        start_time=-300
        [frame]
            image="units/merfolk/brawler.webp:50"
        [/frame]
        [frame]
            image="units/merfolk/brawler-fist-[1~3].webp:[200,100*2]"
        [/frame]
        {SOUND:HIT_AND_MISS fist.ogg dagger-swish.wav -50}
        [frame]
            image="units/merfolk/brawler.webp:50"
        [/frame]
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=tail-merman
        [/filter_attack]
        start_time=-140
        {SOUND:HIT_AND_MISS fist.ogg dagger-swish.wav -50}
        [frame]
            image="units/merfolk/brawler-tail-land-[1,3,5~1].webp:[30*2,80,30,80*3]"
        [/frame]
        [frame]
            image="units/merfolk/brawler.webp:80"
        [/frame]
    [/attack_anim]

    {LIUN_STUN_EVENTS}
[/unit_type]

