#textdomain wesnoth-liminal-union
[unit_type]
    id=LIUN_Squire
    name= _"Squire"
    race=human
    image="units/humans/squire.webp"
    profile="portraits/humans/horseman.webp"
    hitpoints=18
    movement_type=mounted
    movement=7
    experience=23
    level=0
    alignment=lawful
    advances_to="Horseman, Cavalryman"
    undead_variation=mounted
    cost=12
    usage=scout
    halo=halo/peasantship-p0.webp
    description= _"Squires are apprentices to knights, who often hail from either wealthy families or the eastern horse clans. They practise fighting with a wooden lance, but have yet to master the fearsome charges of their mentors."
    die_sound=horse-die.ogg
    [attack]
        name=spear
        description=_"spear"
        icon=attacks/javelin-orcish.png
        type=pierce
        range=melee
        damage=6
        number=2
    [/attack]
    {DEFENSE_ANIM "units/humans/squire-defend.webp" "units/humans/squire.webp" {SOUND_LIST:HORSE_HIT} }
    [movement_anim]
        start_time=0
        [frame]
            duration=150
            image="units/humans/squire-attack.webp"
        [/frame]
    [/movement_anim]
    [attack_anim]
        [filter_attack]
            name=spear
        [/filter_attack]
        start_time=-400
        sound_start_time=-400
        offset=0.0~0.3:300,0.3~0.45:210,0.45~0.0:420
        [sound_frame]
            sound=horse-canter.wav
        [/sound_frame]
        [frame]
            image="units/humans/squire-attack.webp:930"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]
