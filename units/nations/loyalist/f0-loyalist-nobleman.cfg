#textdomain wesnoth-liminal-union

[unit_type]
    id=LIUN_Nobleman
    name= _"Nobleman"
    race=human
    image="units/humans/nobleman.webp"
    profile="portraits/humans/fencer.webp"
    hitpoints=18
    movement_type=elusivefoot
    movement=5
    experience=21
    level=0
    alignment=lawful
    advances_to="Fencer, Sergeant, Heavy Infantryman"
    cost=9
    usage=fighter
    halo=halo/peasantship-p0.webp
    description= _"Noblemen lead a life of relative luxury and do not shy away to show this to the world. The privilege to carry weapons and their choreographic movements have attracted quite a number of looks from court ladies."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/humans/nobleman-defend.webp" "units/humans/nobleman-attack-1.webp" {SOUND_LIST:HUMAN_HIT} }

    [resistance]
        cold=90
    [/resistance]

    [attack]
        name=dagger
        description= _"dagger"
        icon=attacks/dagger-human.png
        type=blade
        damage=4 # 3
        number=3
        range=melee
    [/attack]

    [attack_anim]
        [filter_attack]
            name=dagger
        [/filter_attack]
        start_time=-250
        [frame]
            image="units/humans/nobleman-attack-[1,2,1].webp:[100,200,100]"
        [/frame]
        {SOUND:HIT_AND_MISS dagger-swish.wav {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]
