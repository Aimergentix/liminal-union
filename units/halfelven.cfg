#textdomain wesnoth-liminal-union

# movetypes: adapted from core/units.cfg
# wmllint: general spellings phoinix-bird phoinix-birds
# wmllint: general spellings phoinix phoinixes
# wmllint: general spellings golem golems
# wmllint: general spellings maid maiden
# wmllint: general spellings mäid mäiden
[race]
    id=marinecommand
    male_name= _ "race^Marine"
    female_name= _ "race+female^Marine"
    plural_name= _ "race^Marines"
    description= _ "Marines are the crossing-keepers of the Liminal Union's armed forces. They wear water-resistant Arcanite-composite armour, wrought to stand against sorcerous assault. Marines are trained to move with equal ease through woodland, sand, and shallow water, and are well-versed in riverine and coastal combat. Intelligent and disciplined, they advance swiftly through the corps by merit. To gather intelligence in the field, they train and tend Phoinix Messengers as swift scouts."
    undead_variation=elf
    num_traits=2
    ignore_global_traits=yes
        {TRAIT_INTELLIGENT}
        {TRAIT_QUICK}
        {TRAIT_STRONG}
        {TRAIT_RESILIENT}
    markov_chain_size=2
    # wmlscope: start ignoring
    {LIMINAL_UNION_NAMES}
    # wmlscope: stop ignoring
[/race]
[movetype]
    name=marinefoot
    [movement_costs]
        deep_water=2
        shallow_water=2
        reef=2
        swamp_water=2
        flat=1
        sand=1
        forest=1
        hills=2
        mountains=2
        village=1
        castle=1
        cave=1
        frozen=1
        fungus=2
    [/movement_costs]
    [defense]
        deep_water=40
        shallow_water=40
        reef=40
        swamp_water=60
        flat=60
        sand=60
        forest=40
        hills=40
        mountains=50
        village=40
        castle=40
        cave=40
        frozen=50
        fungus=50
    [/defense]
    [resistance]
        blade=110
        pierce=100
        impact=100
        fire=110
        cold=100
        arcane=100
    [/resistance]
[/movetype]

[race]
    id=maidencommand
    male_name= _ "race^Mäid"
    female_name= _ "race+female^Mäid"
    plural_name= _ "race^Mäiden"
    description= _ "Maïden are the most honoured fighting arm of the Liminal Union's corps. The commonwealth reveres their threefold charge: bearing, rearing, and defending. They are therefore fitted with the finest Arcanite-composite armour the Union's artificers can fashion. Maiden units wear light armoured suits worked with Arcanite-braced wingfeathers, granting swift passage over all manner of terrain, though not true flight. Intelligent and disciplined, they advance swiftly through the corps by merit. They also oversee and maintain the G9 Warforms that hold the Union's iron line."
    undead_variation=elf
    num_traits=2
    ignore_global_traits=yes
        {TRAIT_INTELLIGENT}
        {TRAIT_QUICK}
        {TRAIT_DEXTROUS}
        {TRAIT_RESILIENT}
    markov_chain_size=2
    # wmlscope: start ignoring
    {LIMINAL_UNION_NAMES}
    # wmlscope: stop ignoring
[/race]
[movetype]
    name=maidenfoot
    [movement_costs]
        deep_water=3
        shallow_water=2
        reef=2
        swamp_water=3
        flat=1
        sand=1
        forest=1
        hills=1
        mountains=2
        village=1
        castle=1
        cave=1
        frozen=1
        fungus=3
    [/movement_costs]
    [defense]
        deep_water=60
        shallow_water=50
        reef=50
        swamp_water=60
        flat=60
        sand=50
        forest=40
        hills=50
        mountains=60
        village=40
        castle=40
        cave=50
        frozen=50
        fungus=50
    [/defense]
    [resistance]
        blade=110
        pierce=110
        impact=100
        fire=90
        cold=100
        arcane=100
    [/resistance]
[/movetype]

# -----------------------------------------------
{./halfelven/command/}
{./halfelven/maiden/}
{./halfelven/marines/}
