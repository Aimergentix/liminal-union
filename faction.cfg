    # Register Contextual Menu Items on game start and reload
    [event]
        id=LIUN_event_register_menus
        name=prestart,preload
        first_time_only=no

        # G9 Overclock contextual action menu
        [set_menu_item]
            id=LIUN_menu_g9_overclock
            description= _ "Overclock Core (Emergency Protocol Bypass)"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    side=$side_number
                    race=maidengolem
                [/have_unit]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local g9 = wesnoth.require("~add-ons/liminal-union/lua/g9_overclock.lua")
                        g9.activate(wesnoth.current.event_context)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        # Marine Salt-Grounding Pylum contextual action menu
        [set_menu_item]
            id=LIUN_menu_marine_grounding
            description= _ "⚡ Deploy Salt-Grounding Pylum (Root & Anti-Sorcery Ward)"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    side=$side_number
                    # Kryonite troops of level 1+; Officers share race=marinecommand but carry no Kryonite.
                    ability=LIUN_resonance_kryonite
                    # Sergeants and above; level 0 Privates carry no Pylum.
                    [not]
                        level=0
                    [/not]
                    [not]
                        [filter_wml]
                            [variables]
                                lu_grounded=yes
                            [/variables]
                        [/filter_wml]
                    [/not]
                [/have_unit]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                        marine.activate(wesnoth.current.event_context)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        # Field works: artificers build warforms, Shieldguards call or rekindle Phoinixes (lua/field_works.lua)
        [set_menu_item]
            id=LIUN_menu_build_g8
            description= _ "Build G8 Simulacrum here (10 gold, 1 aimergent-core)"
            [show_if]
                [lua]
                    code=<<
                        local side = wesnoth.current.side
                        if not wesnoth.sides[side].is_local then return false end
                        local fw = wesnoth.require("~add-ons/liminal-union/lua/field_works.lua")
                        local b, l = fw.builder_for(side, wml.variables.x1, wml.variables.y1)
                        return b ~= nil and l.line == "mechatronic"
                    >>
                [/lua]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local ctx = wesnoth.current.event_context
                        wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").build(ctx.x1, ctx.y1)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        [set_menu_item]
            id=LIUN_menu_build_g9
            description= _ "Build G9 AI here (20 gold, 1 aimergent-core)"
            [show_if]
                [lua]
                    code=<<
                        local side = wesnoth.current.side
                        if not wesnoth.sides[side].is_local then return false end
                        local fw = wesnoth.require("~add-ons/liminal-union/lua/field_works.lua")
                        local b, l = fw.builder_for(side, wml.variables.x1, wml.variables.y1)
                        return b ~= nil and l.line == "techtronic"
                    >>
                [/lua]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local ctx = wesnoth.current.event_context
                        wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").build(ctx.x1, ctx.y1)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        [set_menu_item]
            id=LIUN_menu_call_phoinix
            description= _ "Open ember capsule: call a Phoinix here (10 gold)"
            [show_if]
                [lua]
                    code=<<
                        local side = wesnoth.current.side
                        if not wesnoth.sides[side].is_local then return false end
                        local fw = wesnoth.require("~add-ons/liminal-union/lua/field_works.lua")
                        return fw.caller_for(side, wml.variables.x1, wml.variables.y1) ~= nil
                    >>
                [/lua]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local ctx = wesnoth.current.event_context
                        wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").call_phoinix(ctx.x1, ctx.y1)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        [set_menu_item]
            id=LIUN_menu_kindle_ash
            description= _ "Kindle Phoinix ash here"
            [show_if]
                [lua]
                    code=<<
                        local side = wesnoth.current.side
                        if not wesnoth.sides[side].is_local then return false end
                        local fw = wesnoth.require("~add-ons/liminal-union/lua/field_works.lua")
                        return fw.kindler_for(side, wml.variables.x1, wml.variables.y1) ~= nil
                    >>
                [/lua]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local ctx = wesnoth.current.event_context
                        wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").kindle_ash(ctx.x1, ctx.y1)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        # Liminal Union In-Game Doctrine Codex (Accessible on any allied unit)
        [set_menu_item]
            id=LIUN_menu_doctrine_codex
            description= _ "📖 Liminal Union Doctrine Codex"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    side=$side_number
                [/have_unit]
            [/show_if]
            [command]
                {LIUN_CODEX_GOTO overview}
                [while]
                    [variable]
                        name=LIUN_codex_page
                        not_equals=closed
                    [/variable]
                    [do]
                        [switch]
                            variable=LIUN_codex_page
                            [case]
                                value=overview
                                    [message]
                                        speaker=narrator
                                        image="factions/liminal-union-default.webp"
                                        caption= _ "Liminal Union Field Codex"
                                        message= _ "Select a strategic doctrine to review:"
                                    [option]
                                        label= _ "⭐ Quick Start: The Three Golden Maxims"
                                        [command]
                                            {LIUN_CODEX_GOTO maxims}
                                        [/command]
                                    [/option]
                                    [option]
                                        label= _ "1. Formation Pods & Armor Alloys (Pyrite, Kryonite, Arcanite)"
                                        [command]
                                            {LIUN_CODEX_GOTO pods}
                                        [/command]
                                    [/option]
                                    [option]
                                        label= _ "2. Formation Zone of Control (Level 0 Troops)"
                                        [command]
                                            {LIUN_CODEX_GOTO zoc}
                                        [/command]
                                    [/option]
                                    [option]
                                        label= _ "3. Conductance Auras & Liminal Timing"
                                        [command]
                                            {LIUN_CODEX_GOTO conductance}
                                        [/command]
                                    [/option]
                                    [option]
                                        label= _ "4. Special Tactical Actions (Pylum, Overclock, Wingsuit)"
                                        [command]
                                            {LIUN_CODEX_GOTO tactics}
                                        [/command]
                                    [/option]
                                    {LIUN_CODEX_CLOSE_OPTION}
                                    [/message]
                            [/case]
                            [case]
                                value=maxims
                                    [message]
                                        speaker=narrator
                                        image="factions/liminal-union-default.webp"
                                        caption= _ "Field Primer: Three Golden Maxims"
                                        message= _ "To master the Liminal Union, keep three simple rules in mind:

1. <b>March in Pairs:</b> Keep same-alloy troops adjacent to build Resonance. Its tier is based on the current formation and updates after movement. Poison disables Resonance; slow can reduce its tier.

2. <b>Keep an Officer Close:</b> Conductors add 10 percentage points of damage for themselves and adjacent allied liminal units during Day or Night. This softens, but does not erase, their alignment penalties.

3. <b>Strike at Twilight:</b> Liminal units deal 25% more damage at Dawn and Dusk.

<b>Visual Feedback:</b>
• <i>Pulsing Halos:</i> Amber (Pyrite), Cyan (Kryonite), and Purple (Arcanite) halos and tier pips show Resonance status.
• <i>Battle Badges:</i> Floating notifications announce ZOC locks, Conductance, and Tier elevations without checking menus."
                                        {LIUN_CODEX_TOPIC_NAV tactics pods}
                                    [/message]
                            [/case]
                            [case]
                                value=pods
                                    [message]
                                        speaker=narrator
                                        image="factions/liminal-union-default.webp"
                                        caption= _ "Resonance Pods & Armor Alloys"
                                        message= _ "Resonance activates immediately when standing adjacent to allies with matching armor alloys. A pod of 2, 3 or 4+ units reaches Tier 1, 2 or 3; each tier grants +5% blade, pierce and impact resistance.

• <b>Pyrite (Maidens):</b> <b>Focus</b>: +5% chance to hit per tier with ranged attacks on offense, +10% more beside a Hunterkiller Squad Anchor; a bow's own accuracy and Focus together never exceed +20%. Tier 3 adds +10% Fire and Arcane resistance.
• <b>Kryonite (Marines):</b> <b>Bulwark</b>: enemies lose 5% (Tier 1) or 10% (Tier 2+) chance to hit this unit in melee; a weapon's own parry and Bulwark together never exceed 15%. Tier 3 adds first strike on defense and +10% Cold and Arcane resistance. <b>Interlock</b> passes up to 30% of a normal hit to adjacent Kryonite allies; none falls below 1 HP. Magical and marksman strikes are not shared.
• <b>Arcanite (G9 Warforms, Techtronics):</b> <b>Sunder</b>: +1 melee damage per tier on offense, +1 more beside a Techtronic Squad Anchor, at most +3. Tier 3 adds +20% Fire and Cold resistance.

<i>Poison disables resonance; slow can lower its tier.</i>"
                                        {LIUN_CODEX_TOPIC_NAV maxims zoc}
                                    [/message]
                            [/case]
                            [case]
                                value=zoc
                                    [message]
                                        speaker=narrator
                                        image="factions/liminal-union-default.webp"
                                        caption= _ "Formation Zone of Control"
                                        message= _ "Standard level 0 troops in Wesnoth exert no Zone of Control (ZOC).

Liminal Union level 0 units (Marine/Maiden Privates, G9 AI, Ensigns) <b>exert full Zone of Control</b> while an allied officer (Ensign, Cornet, Captain or Colonel) stands adjacent and is not poisoned. Poison on the unit itself also removes it.

Keep officers beside your conscripts to hold chokepoints, protect wounded comrades and deny cavalry breakthroughs; an officer who falls or moves away leaves the line open."
                                        {LIUN_CODEX_TOPIC_NAV pods conductance}
                                    [/message]
                            [/case]
                            [case]
                                value=conductance
                                    [message]
                                        speaker=narrator
                                        image="factions/liminal-union-default.webp"
                                        caption= _ "Conductance & Alignment"
                                        message= _ "Liminal Union units fight at peak strength during <b>Dawn and Dusk (+25% damage)</b>.

All Command units (Ensigns, Cornets, Captains, Colonels) radiate a <b>Conductance Aura</b> (pulsing ground halo). These officers and adjacent allied liminal units gain +10 percentage points of damage:
• <b>Day:</b> Penalty softened from -25% to -15% net.
• <b>Night:</b> Penalty softened from -25% to -15% net.
• <b>Dawn/Dusk:</b> Full +25% net power maintained.

<i>Officers do not give flat offensive leadership; their purpose is stabilizing the frontline through unfavorable daylight cycles.</i>"
                                        {LIUN_CODEX_TOPIC_NAV zoc tactics}
                                    [/message]
                            [/case]
                            [case]
                                value=tactics
                                    [message]
                                        speaker=narrator
                                        image="factions/liminal-union-default.webp"
                                        caption= _ "Tactical Maneuvers"
                                        message= _ "• <b>Marine Salt-Grounding Pylum (Right-Click):</b> Right-click an ungrounded Kryonite Marine (Sergeant or higher; not Privates or Officers) to deploy their conductive pylon stake. Grants adjacent allies +20% elemental warding, grounds adjacent enemies' fire, cold and arcane attacks (max 50% CTH), and reduces enemy elemental damage by 20%. Costs: 0 MP and +20% melee Blade/Impact vulnerability. Lasts through the following enemy turn; redeploy it on your next turn.
• <b>G9 Overclock (Right-Click):</b> Right-click a G9 Warform with more than 4 HP and an attack left to trigger emergency protocol bypass (+1 melee strike and <b>Stun</b> for the turn). At turn end, the golem suffers up to 3 HP core thermal stress and cannot die from it.
• <b>Maiden Wingsuit Glide (Passive):</b> Any Maiden unit beginning its turn on elevated terrain (Hills or Mountains) deploys thermal wingsuits, gaining <b>+1 MP and Skirmisher</b> for that turn!
• <b>Portal Warden (Passive):</b> A Shieldguard that stood still for a full turn with a Phoinix beside it opens its portable Arcanite portal, charged by mana crystals. Marines other than leaders may travel one way from your villages to free hexes beside it, arriving with no moves and no attack that turn. The portal closes when the Shieldguard moves.
