#textdomain wesnoth-liminal-union

#ifndef LIUN_FACTION_CFG_INCLUDED
#define LIUN_FACTION_CFG_INCLUDED
#enddef

# Shared Liminal Union faction loader, binary path, macros, units, and event hooks.

[binary_path]
    path=data/add-ons/liminal-union
[/binary_path]

{~add-ons/liminal-union/macros/traits.cfg}
{~add-ons/liminal-union/macros/abilities.cfg}
{~add-ons/liminal-union/macros/advancements.cfg}
{~add-ons/liminal-union/macros/animation-utils.cfg}
{~add-ons/liminal-union/macros/names.cfg}
{~add-ons/liminal-union/macros/shared-race-characteristics.cfg}
{~add-ons/liminal-union/macros/weaponspecials.cfg}

[units]
    {~add-ons/liminal-union/macros/alignment.cfg}
    {~add-ons/liminal-union/units/golems.cfg}
    {~add-ons/liminal-union/units/halfelven.cfg}
    {~add-ons/liminal-union/units/nations.cfg}
    {~add-ons/liminal-union/units/phoinixes.cfg}
[/units]

#define LIUN_ERA_EVENTS
    [event]
        id=LIUN_event_preload
        name=preload
        first_time_only=no
        [lua]
            code=<<
                wesnoth.dofile("~add-ons/liminal-union/lua/promotion-handler.lua")
                wesnoth.dofile("~add-ons/liminal-union/lua/formation.lua")
                wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                wesnoth.require("~add-ons/liminal-union/lua/g9_overclock.lua")
                wesnoth.require("~add-ons/liminal-union/lua/maiden_wingsuit.lua")
                wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                wesnoth.require("~add-ons/liminal-union/lua/phoinix_courier.lua")
                wesnoth.require("~add-ons/liminal-union/lua/portal_warden.lua")
            >>
        [/lua]
    [/event]

    # Resonance recalculation hooks
    [event]
        id=LIUN_event_side_turn
        name=side turn
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_side_turn()
                local wingsuit = wesnoth.require("~add-ons/liminal-union/lua/maiden_wingsuit.lua")
                wingsuit.on_side_turn(wesnoth.current.side)
                local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                marine.on_side_turn(wesnoth.current.side)
                local portal = wesnoth.require("~add-ons/liminal-union/lua/portal_warden.lua")
                portal.on_side_turn(wesnoth.current.side)
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_moveto
        name=moveto
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_unit_moved(wesnoth.current.event_context)
                local phoinix = wesnoth.require("~add-ons/liminal-union/lua/phoinix_courier.lua")
                phoinix.on_unit_moved(wesnoth.current.event_context)
                local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                marine.on_unit_moved(wesnoth.current.event_context)
                local portal = wesnoth.require("~add-ons/liminal-union/lua/portal_warden.lua")
                portal.on_unit_moved(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    # AI reflexes: each side's AI status is fixed once per scenario (replay-safe).
    [event]
        id=LIUN_event_side_control_prestart
        name=prestart
        [lua]
            code=<<
                wesnoth.require("~add-ons/liminal-union/lua/side_control.lua").on_prestart()
            >>
        [/lua]
    [/event]

    # Portal Warden: tunnels persist in saves, so they are installed once.
    [event]
        id=LIUN_event_portal_tunnels
        name=prestart
        [lua]
            code=<<
                wesnoth.require("~add-ons/liminal-union/lua/portal_warden.lua").install_tunnels()
            >>
        [/lua]
    [/event]

    # Field works: every charge-carrying unit starts each scenario with full charges.
    [event]
        id=LIUN_event_field_works_prestart
        name=prestart
        [lua]
            code=<<
                wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").on_prestart()
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_portal_turn_refresh
        name=turn refresh
        first_time_only=no
        [lua]
            code=<<
                wesnoth.require("~add-ons/liminal-union/lua/portal_warden.lua").on_turn_refresh(wesnoth.current.side)
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_portal_enter_hex
        name=enter hex
        first_time_only=no
        [lua]
            code=<<
                wesnoth.require("~add-ons/liminal-union/lua/portal_warden.lua").on_enter_hex(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_unit_placed
        name=recruit,recall
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_unit_placed(wesnoth.current.event_context)
                wesnoth.require("~add-ons/liminal-union/lua/portal_warden.lua").on_unit_placed(wesnoth.current.event_context)
                wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua").on_unit_placed(wesnoth.current.event_context)
                wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").on_unit_event(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_post_advance
        name=post advance
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_unit_advanced(wesnoth.current.event_context)
                wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua").update_wards()
                wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").on_unit_event(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_die
        name=die
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_unit_died(wesnoth.current.event_context)
                local phoinix = wesnoth.require("~add-ons/liminal-union/lua/phoinix_courier.lua")
                phoinix.on_phoinix_died(wesnoth.current.event_context)
                local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                marine.on_unit_died(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    # Stun (Overclock and Merman Brawler); the same ids in the Brawler's type register once
    {LIUN_STUN_EVENTS}

    # Interlock damage redistribution hooks
    [event]
        id=LIUN_event_attacker_hits
        name=attacker_hits
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_attacker_hits(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_defender_hits
        name=defender_hits
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_defender_hits(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    # Pods recalculate right after each fight, so kills, poison and slow break them at once
    [event]
        id=LIUN_event_attack_end
        name=attack_end
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_attack_end(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    # AI tactical reflexes before combat (G9 Overclock and Marine Salt-Grounding Pylum)
    [event]
        id=LIUN_event_ai_attack_reflexes
        name=attack
        first_time_only=no
        [lua]
            code=<<
                local g9 = wesnoth.require("~add-ons/liminal-union/lua/g9_overclock.lua")
                g9.on_attack(wesnoth.current.event_context)
                local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                marine.on_attack(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    # Turn end resolution (G9 thermal stress, Wingsuit glide reset, AI Salt-Grounding and AI field works)
    [event]
        id=LIUN_event_side_turn_end_cleanup
        name=side turn end
        first_time_only=no
        [lua]
            code=<<
                local g9 = wesnoth.require("~add-ons/liminal-union/lua/g9_overclock.lua")
                g9.on_side_turn_end(wesnoth.current.side)
                local wingsuit = wesnoth.require("~add-ons/liminal-union/lua/maiden_wingsuit.lua")
                wingsuit.on_side_turn_end(wesnoth.current.side)
                local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                marine.on_side_turn_end(wesnoth.current.side)
                wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").on_side_turn_end(wesnoth.current.side)
            >>
        [/lua]
    [/event]

    # Register Contextual Menu Items on game start and reload
    [event]
        id=LIUN_event_register_menus
        name=prestart,preload
        first_time_only=no

        # G9 Overclock contextual action menu
        [set_menu_item]
            id=LIUN_menu_g9_overclock
            description= _ "Overclock Core (Emergency Protocol Bypass)"
            # Shown only while the G9 can overclock right now (HP > 4, attack left, not overclocked).
            [show_if]
                [lua]
                    code=<<
                        local u = wesnoth.units.get(wml.variables.x1, wml.variables.y1)
                        local g9 = wesnoth.require("~add-ons/liminal-union/lua/g9_overclock.lua")
                        return g9.can_overclock(u)
                    >>
                [/lua]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local g9 = wesnoth.require("~add-ons/liminal-union/lua/g9_overclock.lua")
                        g9.activate(wesnoth.current.event_context)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        # Marine Salt-Grounding Pylum contextual action menu
        [set_menu_item]
            id=LIUN_menu_marine_grounding
            description= _ "⚡ Deploy Salt-Grounding Pylum (Root & Anti-Sorcery Ward)"
            # Shown only while the Marine can deploy right now (level 1+ Kryonite, own turn, not grounded).
            [show_if]
                [lua]
                    code=<<
                        local u = wesnoth.units.get(wml.variables.x1, wml.variables.y1)
                        local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                        return marine.can_ground(u)
                    >>
                [/lua]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                        marine.activate(wesnoth.current.event_context)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        # Field works: artificers build warforms, Shieldguards call or rekindle Phoinixes (lua/field_works.lua)
        [set_menu_item]
            id=LIUN_menu_build_g8
            description= _ "Build G8 Simulacrum here (10 gold, 1 aimergent-core)"
            [show_if]
                [lua]
                    code=<<
                        local side = wesnoth.current.side
                        local fw = wesnoth.require("~add-ons/liminal-union/lua/field_works.lua")
                        local b, l = fw.builder_for(side, wml.variables.x1, wml.variables.y1)
                        return b ~= nil and l.line == "mechatronic"
                    >>
                [/lua]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local ctx = wesnoth.current.event_context
                        wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").build(ctx.x1, ctx.y1)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        [set_menu_item]
            id=LIUN_menu_build_g9
            description= _ "Build G9 AI here (20 gold, 1 aimergent-core)"
            [show_if]
                [lua]
                    code=<<
                        local side = wesnoth.current.side
                        local fw = wesnoth.require("~add-ons/liminal-union/lua/field_works.lua")
                        local b, l = fw.builder_for(side, wml.variables.x1, wml.variables.y1)
                        return b ~= nil and l.line == "techtronic"
                    >>
                [/lua]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local ctx = wesnoth.current.event_context
                        wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").build(ctx.x1, ctx.y1)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        [set_menu_item]
            id=LIUN_menu_call_phoinix
            description= _ "Open ember capsule: call a Phoinix here (10 gold)"
            [show_if]
                [lua]
                    code=<<
                        local side = wesnoth.current.side
                        local fw = wesnoth.require("~add-ons/liminal-union/lua/field_works.lua")
                        return fw.caller_for(side, wml.variables.x1, wml.variables.y1) ~= nil
                    >>
                [/lua]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local ctx = wesnoth.current.event_context
                        wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").call_phoinix(ctx.x1, ctx.y1)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        [set_menu_item]
            id=LIUN_menu_kindle_ash
            description= _ "Kindle Phoinix ash here"
            [show_if]
                [lua]
                    code=<<
                        local side = wesnoth.current.side
                        local fw = wesnoth.require("~add-ons/liminal-union/lua/field_works.lua")
                        return fw.kindler_for(side, wml.variables.x1, wml.variables.y1) ~= nil
                    >>
                [/lua]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local ctx = wesnoth.current.event_context
                        wesnoth.require("~add-ons/liminal-union/lua/field_works.lua").kindle_ash(ctx.x1, ctx.y1)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        # Liminal Union Field Codex (lua/codex.lua): unsynced and read-only, so it opens on any
        # unit at any time, also on the opponent's turn and for observers, and keeps undo.
        [set_menu_item]
            id=LIUN_menu_doctrine_codex
            description= _ "📖 Liminal Union Doctrine Codex"
            synced=no
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                [/have_unit]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        wesnoth.require("~add-ons/liminal-union/lua/codex.lua").open()
                    >>
                [/lua]
            [/command]
        [/set_menu_item]
    [/event]
#enddef

[resource]
    id=LIUN_era_events
    {LIUN_ERA_EVENTS}
[/resource]

#endif
