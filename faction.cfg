#textdomain wesnoth-liminal-union

#ifndef LIUN_FACTION_CFG_INCLUDED
#define LIUN_FACTION_CFG_INCLUDED
#enddef

# Shared Liminal Union faction loader, binary path, macros, units, and event hooks.

[binary_path]
    path=data/add-ons/liminal-union
[/binary_path]

{~add-ons/liminal-union/macros/traits.cfg}
{~add-ons/liminal-union/macros/abilities.cfg}
{~add-ons/liminal-union/macros/advancements.cfg}
{~add-ons/liminal-union/macros/animation-utils.cfg}
{~add-ons/liminal-union/macros/names.cfg}
{~add-ons/liminal-union/macros/shared-race-characteristics.cfg}
{~add-ons/liminal-union/macros/weaponspecials.cfg}

[units]
    {~add-ons/liminal-union/macros/alignment.cfg}
    {~add-ons/liminal-union/units/golems.cfg}
    {~add-ons/liminal-union/units/halfelven.cfg}
    {~add-ons/liminal-union/units/nations.cfg}
    {~add-ons/liminal-union/units/phoinixes.cfg}
[/units]

#define LIUN_ERA_EVENTS
    [event]
        id=LIUN_event_preload
        name=preload
        first_time_only=no
        [lua]
            code=<<
                wesnoth.dofile("~add-ons/liminal-union/lua/promotion-handler.lua")
                wesnoth.dofile("~add-ons/liminal-union/lua/formation.lua")
                wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                wesnoth.require("~add-ons/liminal-union/lua/g9_overclock.lua")
                wesnoth.require("~add-ons/liminal-union/lua/maiden_wingsuit.lua")
                wesnoth.require("~add-ons/liminal-union/lua/phoinix_courier.lua")
            >>
        [/lua]
    [/event]

    # Resonance recalculation hooks
    [event]
        id=LIUN_event_side_turn
        name=side turn
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_side_turn()
                local wingsuit = wesnoth.require("~add-ons/liminal-union/lua/maiden_wingsuit.lua")
                wingsuit.on_side_turn(wesnoth.current.side)
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_moveto
        name=moveto
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_unit_moved(wesnoth.current.event_context)
                local phoinix = wesnoth.require("~add-ons/liminal-union/lua/phoinix_courier.lua")
                phoinix.on_unit_moved(wesnoth.current.event_context)
                local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                marine.on_unit_moved(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_unit_placed
        name=recruit,recall
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_unit_placed(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_post_advance
        name=post advance
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_unit_advanced(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_die
        name=die
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_unit_died(wesnoth.current.event_context)
                local phoinix = wesnoth.require("~add-ons/liminal-union/lua/phoinix_courier.lua")
                phoinix.on_phoinix_died(wesnoth.current.event_context)
                local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                marine.on_unit_died(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    # Interlock damage redistribution hooks
    [event]
        id=LIUN_event_attacker_hits
        name=attacker_hits
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_attacker_hits(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    [event]
        id=LIUN_event_defender_hits
        name=defender_hits
        first_time_only=no
        [lua]
            code=<<
                local reso = wesnoth.require("~add-ons/liminal-union/lua/resonance.lua")
                reso.on_defender_hits(wesnoth.current.event_context)
            >>
        [/lua]
    [/event]

    # Turn end resolution (G9 thermal stress and Wingsuit glide reset)
    [event]
        id=LIUN_event_side_turn_end_cleanup
        name=side turn end
        first_time_only=no
        [lua]
            code=<<
                local g9 = wesnoth.require("~add-ons/liminal-union/lua/g9_overclock.lua")
                g9.on_side_turn_end(wesnoth.current.side)
                local wingsuit = wesnoth.require("~add-ons/liminal-union/lua/maiden_wingsuit.lua")
                wingsuit.on_side_turn_end(wesnoth.current.side)
                local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                marine.on_side_turn_end(wesnoth.current.side)
            >>
        [/lua]
    [/event]

    # Register Contextual Menu Items on game start and reload
    [event]
        id=LIUN_event_register_menus
        name=prestart,preload
        first_time_only=no

        # G9 Overclock contextual action menu
        [set_menu_item]
            id=LIUN_menu_g9_overclock
            description= _ "Overclock Core (Emergency Protocol Bypass)"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    side=$side_number
                    race=maidengolem
                [/have_unit]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local g9 = wesnoth.require("~add-ons/liminal-union/lua/g9_overclock.lua")
                        g9.activate(wesnoth.current.event_context)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        # Marine Salt-Grounding Pylum contextual action menu
        [set_menu_item]
            id=LIUN_menu_marine_grounding
            description= _ "⚡ Deploy Salt-Grounding Pylum (Root & Anti-Sorcery Ward)"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    side=$side_number
                    race=marinecommand
                    [not]
                        [filter_wml]
                            [variables]
                                lu_grounded=yes
                            [/variables]
                        [/filter_wml]
                    [/not]
                [/have_unit]
            [/show_if]
            [command]
                [lua]
                    code=<<
                        local marine = wesnoth.require("~add-ons/liminal-union/lua/marine_grounding.lua")
                        marine.activate(wesnoth.current.event_context)
                    >>
                [/lua]
            [/command]
        [/set_menu_item]

        # Liminal Union In-Game Doctrine Codex (Accessible on any allied unit)
        [set_menu_item]
            id=LIUN_menu_doctrine_codex
            description= _ "📖 Liminal Union Doctrine Codex"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    side=$side_number
                [/have_unit]
            [/show_if]
            [command]
                [message]
                    speaker=narrator
                    image="factions/liminal-union-default.webp"
                    caption= _ "Liminal Union Field Codex"
                    message= _ "Select a strategic doctrine to review:"
                    [option]
                        label= _ "⭐ Quick Start: The Three Golden Maxims"
                        [command]
                            [message]
                                speaker=narrator
                                image="factions/liminal-union-default.webp"
                                caption= _ "Field Primer: Three Golden Maxims"
                                message= _ "To master the Liminal Union, keep three simple rules in mind:\n\n1. <b>March in Pairs:</b> Keep same-alloy troops adjacent to build Resonance. Its tier is based on the current formation and updates after movement. Poison disables Resonance; slow can reduce its tier.\n\n2. <b>Keep an Officer Close:</b> Conductors add 10 percentage points of damage for themselves and adjacent allied liminal units during Day or Night. This softens, but does not erase, their alignment penalties.\n\n3. <b>Strike at Twilight:</b> Liminal units deal 25% more damage at Dawn and Dusk.\n\n<b>Visual Feedback:</b>\n• <i>Pulsing Halos:</i> Amber (Pyrite), Cyan (Kryonite), and Purple (Arcanite) halos and tier pips show Resonance status.\n• <i>Battle Badges:</i> Floating notifications announce ZOC locks, Conductance, and Tier elevations without checking menus."
                            [/message]
                        [/command]
                    [/option]
                    [option]
                        label= _ "1. Formation Pods & Armor Alloys (Pyrite, Kryonite, Arcanite)"
                        [command]
                            [message]
                                speaker=narrator
                                image="factions/liminal-union-default.webp"
                                caption= _ "Resonance Pods & Armor Alloys"
                                message= _ "Resonance activates immediately when standing adjacent to allies with matching armor alloys:\n\n• <b>Pyrite (Maidens):</b> Precision marksmanship & warding. Pod of 4+ units gains <b>Focus</b> (min 60% CTH at range) and +15% Fire/Arcane resistance.\n• <b>Kryonite (Marines):</b> Cohesion & <b>Interlock</b>. 30% of incoming damage is absorbed across adjacent Kryonite allies (> 1 HP), preventing single-unit focus-fire assassinations.\n• <b>Arcanite (G9 Warforms):</b> Heavy plating. Pod of 4+ units gains <b>Arcanite Warding</b> (+20% Fire/Cold resistance).\n\n<i>Note: Resonance activates immediately upon moving or recruiting adjacent to allies, providing instant defensive line bonuses!</i>"
                            [/message]
                        [/command]
                    [/option]
                    [option]
                        label= _ "2. Formation Zone of Control (Level 0 Troops)"
                        [command]
                            [message]
                                speaker=narrator
                                image="factions/liminal-union-default.webp"
                                caption= _ "Formation Zone of Control"
                                message= _ "Standard level 0 troops in Wesnoth exert no Zone of Control (ZOC).\n\nHowever, Liminal Union level 0 troops (Marine/Maiden Privates, G9 AI, Ensigns) <b>exert full Zone of Control</b> whenever standing in a pod of 2 or more allied troops.\n\nUse tight formations to anchor chokepoints, protect wounded comrades, and deny enemy cavalry breakthroughs."
                            [/message]
                        [/command]
                    [/option]
                    [option]
                        label= _ "3. Conductance Auras & Liminal Timing"
                        [command]
                            [message]
                                speaker=narrator
                                image="factions/liminal-union-default.webp"
                                caption= _ "Conductance & Alignment"
                                message= _ "Liminal Union units fight at peak strength during <b>Dawn and Dusk (+25% damage)</b>.\n\nAll Command units (Ensigns, Cornets, Captains, Colonels) radiate a <b>Conductance Aura</b> (pulsing ground halo). Adjacent liminal allies receive a +15% alignment offset:\n• <b>Day:</b> Penalty softened from -25% to -10% net.\n• <b>Night:</b> Penalty softened from -25% to -10% net.\n• <b>Dawn/Dusk:</b> Full +25% net power maintained.\n\n<i>Officers do not give flat offensive leadership; their purpose is stabilizing the frontline through unfavorable daylight cycles.</i>"
                            [/message]
                        [/command]
                    [/option]
                    [option]
                        label= _ "4. Special Tactical Actions (Pylum, Overclock, Wingsuit)"
                        [command]
                            [message]
                                speaker=narrator
                                image="factions/liminal-union-default.webp"
                                caption= _ "Tactical Maneuvers"
                                message= _ "• <b>Marine Salt-Grounding Pylum (Right-Click):</b> Right-click an ungrounded Marine to deploy their conductive pylon stake. Grants adjacent allies +20% elemental warding, grounds adjacent enemy magical attacks (max 50% CTH), and reduces enemy elemental damage by 20%. Costs: 0 MP and +20% melee Blade/Impact vulnerability for that turn.\n• <b>G9 Overclock (Right-Click):</b> Right-click any undamaged G9 Warform to trigger emergency protocol bypass (+1 melee strike, +2 damage, and <b>Stun</b> for the turn). At turn end, the golem suffers 4 HP core thermal stress.\n• <b>Maiden Wingsuit Glide (Passive):</b> Any Maiden unit beginning its turn on elevated terrain (Hills or Mountains) deploys thermal wingsuits, gaining <b>+1 MP and Skirmisher</b> for that turn!\n• <b>Phoinix Signal Relay:</b> Phoinixes within 3 hexes of a Conductor extend the Conductance aura to adjacent troops, acting as aerial signal beacons."
                            [/message]
                        [/command]
                    [/option]
                    [option]
                        label= _ "Close Codex"
                        [command]
                        [/command]
                    [/option]
                [/message]
            [/command]
        [/set_menu_item]
    [/event]
#enddef

[resource]
    id=LIUN_era_events
    {LIUN_ERA_EVENTS}
[/resource]

#endif
